{q:'How would you migrate an on-premises Hadoop/Spark platform to Databricks? Key steps and pitfalls?',diff:'ar',
simple:`Migration phases: Assess → Setup Infrastructure → Migrate Data → Migrate Workloads → Validate → Decommission. Run old and new in parallel during validation. Key pitfalls: Hive Metastore migration is harder than it looks, S3 small-file problem hits differently than HDFS, and Spark API changes between versions require code fixes.`,
detailed:`**Phase 1: Assessment**:
- Inventory all Spark jobs, Hive tables, Oozie workflows, data volumes
- Classify: batch vs streaming, critical vs non-critical
- Map dependencies: what feeds what, who consumes what
- Cost model: Databricks DBUs + cloud storage vs on-prem capex

**Phase 2: Infrastructure Setup**:
- Databricks workspace in your VPC (private, no public internet)
- Unity Catalog metastore + External Locations (S3/ADLS replacing HDFS mounts)
- SCIM sync for user/group management from Azure AD / Okta
- Network security: VPC endpoints for S3, no public egress
- Cluster policies: cost guardrails per team

**Phase 3: Data Migration**:
- HDFS → S3/ADLS: use distcp, s3-dist-cp, or AzCopy for bulk transfer
- Hive tables → Delta Lake: CONVERT TO DELTA for Parquet tables; CTAS for ORC/Text
- Hive Metastore → Unity Catalog: databricks-labs migrate-hms tool or manual scripting
- Validate: row counts, data checksums, sample spot-checks

**Phase 4: Workload Migration**:
- Oozie → Databricks Workflows (action→task, coordinator→schedule, decision→condition_task)
- HiveQL → Spark SQL: mostly compatible; test GROUP BY behavior, UDFs, custom SerDes
- PySpark 2.x → 3.x: SparkContext → SparkSession, deprecated APIs
- RDD code → DataFrame: significant performance improvement

**Critical pitfalls**:
1. S3 small file problem: HDFS handles 1M small files fine; S3 listing is slow → run OPTIMIZE after migration
2. Spot preemption: Spark jobs must be idempotent; use checkpointing for long jobs
3. Kerberos → IAM: no Kerberos in Databricks — replace with IAM instance profiles / service principals
4. HDFS sequential write performance vs S3: use optimizeWrite + autoCompact for Delta
5. Hive UDFs: Java/Scala UDFs may need recompilation against new Spark version`,
code:`-- Phase 3: Data migration patterns

-- Option 1: Convert Parquet Hive table to Delta in-place (fastest)
CONVERT TO DELTA hive_metastore.schema.flights
  PARTITIONED BY (flight_date DATE);    -- Declare partition schema

-- Option 2: CTAS for ORC/Text tables (full rewrite)
CREATE TABLE main.silver.flights
USING DELTA
PARTITIONED BY (flight_date)
TBLPROPERTIES ('delta.autoOptimize.optimizeWrite' = 'true')
AS SELECT * FROM hive_metastore.schema.flights_orc;

# Phase 3: HDFS → S3 → Bronze Delta via Auto Loader
# 1. Run on EMR/Hadoop: hadoop distcp hdfs://nn/data/flights s3://bucket/migration/

# 2. Auto Loader: S3 → Bronze Delta
bronze = (spark.readStream
    .format("cloudFiles")
    .option("cloudFiles.format", "parquet")
    .option("cloudFiles.schemaLocation", "/Volumes/main/schemas/flights_schema")
    .load("s3://bucket/migration/flights/")
    .withColumn("_migrated_at", F.current_timestamp())
    .writeStream.format("delta")
    .option("checkpointLocation", "/Volumes/main/checkpoints/migration_flights")
    .table("main.bronze.flights"))

# Phase 4: Translate Oozie action types → Databricks task types
OOZIE_TO_DATABRICKS = {
    "<spark>":       "notebook_task or python_wheel_task",
    "<hive>":        "sql_task (Databricks SQL)",
    "<shell>":       "python_wheel_task (script)",
    "<fork>/<join>": "parallel tasks with shared depends_on",
    "<decision>":    "condition_task + outcome routing"
}`,
tags:['Hadoop Migration','HDFS to S3','Hive to Delta','Oozie to Workflows','CONVERT TO DELTA','Lift and Shift','On-prem','distcp','Small File Problem','Kerberos']},

{q:'What governance controls are non-negotiable for Databricks in a regulated industry (aviation/finance)?',diff:'ar',
simple:`Non-negotiable controls: column-level PII masking (Unity Catalog masking policies), row-level security by carrier/entity, complete audit logging of all data access (system.access.audit), private network (no public internet for data plane), customer-managed encryption keys, and data residency enforcement (all Canadian data stays in ca-central-1).`,
detailed:`**The six pillars of regulated Databricks governance**:

**1. Data Classification + Tagging**:
- Tag all tables by sensitivity: PUBLIC → INTERNAL → CONFIDENTIAL → RESTRICTED
- Unity Catalog system tags on columns (pii, phi, financial)
- Automated tagging pipeline: scan new tables → classify → apply UC tags
- Block untagged tables from analytics access after 30-day grace period

**2. Column-level Masking** (Unity Catalog):
- PII: passenger_name, passport_number, SIN → REDACTED for non-PII roles
- Partial masking for privileged-but-not-fully-privileged roles (analysts see first letter only)
- Masking policy functions centralized in main.governance schema
- Audit: who accessed unmasked data + when

**3. Row-level Security**:
- Air Canada data visible only to Air Canada engineers
- WestJet data visible only to WestJet engineers
- Regulators (Transport Canada) see aggregate only, not individual PII rows
- Row filter functions attached to all fact tables

**4. Complete Audit Trail**:
- system.access.audit: every query, SELECT, table access, permission change
- Retention: 7 years (Canadian aviation regulatory requirement)
- Real-time streaming to SIEM (Splunk / Microsoft Sentinel)
- Automated alerts: PII access outside business hours, bulk extracts (>100K rows), failed auth

**5. Network Isolation**:
- No Public Access workspace (Databricks setting: publicNetworkAccess=DISABLED)
- Private Endpoints / AWS PrivateLink: workspace accessible only from corporate network
- S3 Gateway Endpoint: cluster → S3 never traverses public internet
- Deny-all outbound except specific allowlist: Databricks control plane, S3, Unity Catalog

**6. Encryption + Key Management**:
- Customer-Managed Keys (CMK) for workspace + DBFS + storage
- AWS KMS / Azure Key Vault: Databricks never holds your encryption keys
- Key rotation: annual (CMK), automated (DEK derived from CMK)
- Tokenization for card data (PCI-DSS); field-level encryption for PHI (HIPAA)`,
code:`-- Complete regulated-industry governance setup

-- 1. Masking policy for passenger PII
CREATE OR REPLACE FUNCTION main.governance.mask_passenger_pii(val STRING)
RETURNS STRING
RETURN CASE
    WHEN CURRENT_ROLE() IN ('PII_ADMIN','DATA_GOVERNANCE','REGULATOR_FULL') THEN val
    WHEN CURRENT_ROLE() IN ('SENIOR_ANALYST') THEN
        CONCAT(LEFT(val,1), REPEAT('*', GREATEST(LENGTH(val)-1,0)))
    ELSE 'REDACTED'
END;

ALTER TABLE prod.silver.passengers
    ALTER COLUMN passenger_name    SET MASKING POLICY main.governance.mask_passenger_pii,
    ALTER COLUMN passport_number   SET MASKING POLICY main.governance.mask_passenger_pii,
    ALTER COLUMN date_of_birth     SET MASKING POLICY main.governance.mask_date_partial;

-- 2. Row filter: carrier isolation
CREATE OR REPLACE FUNCTION main.governance.carrier_row_filter(carrier_code STRING)
RETURNS BOOLEAN
RETURN CASE
    WHEN CURRENT_ROLE() IN ('ADMIN','TRANSPORT_CANADA') THEN TRUE
    WHEN CURRENT_ROLE() LIKE 'AIRCANADA_%' THEN carrier_code = 'AC'
    WHEN CURRENT_ROLE() LIKE 'WESTJET_%'   THEN carrier_code IN ('WS','WR')
    ELSE FALSE
END;

ALTER TABLE prod.silver.flights
    SET ROW FILTER main.governance.carrier_row_filter ON (carrier_code);

-- 3. Anomalous access detection (real-time alert)
SELECT user_identity.email, event_time, action_name,
       request_params['full_name_arg'] AS table_name,
       source_ip_address
FROM system.access.audit
WHERE action_name IN ('getTable','runQuery','applyMask')
  AND request_params['full_name_arg'] LIKE '%passengers%'
  AND (HOUR(event_time) < 7 OR HOUR(event_time) > 19)  -- Off-hours PII access
ORDER BY event_time DESC
LIMIT 100;`,
tags:['Regulated Industry','Aviation','PII Masking','Row-level Security','Audit Log','Network Isolation','Customer-Managed Keys','CMK','Data Residency','SOC2','GDPR','HIPAA']},
]},

{q:'What is Databricks Vector Search? How does it integrate with Delta Lake for RAG pipelines?',diff:'pr',
simple:`Databricks Vector Search is a managed vector database integrated directly with Delta Lake. You point it at a Delta table with a text column → it generates embeddings automatically → creates a queryable vector index that stays in sync with the source Delta table.

No separate vector database needed. Delta Sync mode ensures the index is always up-to-date as new documents are added to the Bronze/Silver Delta table.`,
detailed:`**Vector Search architecture**:

**Endpoint**: A managed, auto-scaling vector search service (no cluster management)
**Index**: Vector index backed by a Delta table as the source of truth

**Two index types**:

**Delta Sync Index** (recommended for production):
- Source: any Delta table with a text column + primary key
- Embeddings: generated by a Model Serving endpoint (your embeddings model) or pre-computed
- Sync: automatically triggered when source Delta table is updated
- Consistency: eventually consistent (slight lag behind source table)
- Best for: Documents that change frequently, RAG pipelines where documents are continuously updated

**Direct Vector Access Index** (manual management):
- You provide pre-computed embeddings directly
- Manual updates: you push vectors to the index yourself
- Best for: When you need to use your own embedding process outside Databricks, or ultra-low latency requirements

**Query types**:
- Similarity search: Top-K most similar vectors (cosine or Euclidean distance)
- Hybrid search: Combine vector similarity + keyword search (BM25) for better retrieval
- Filtered search: Filter by metadata before vector similarity (e.g., only documents from "APPR_regulations")

**Integration with LangChain/LlamaIndex**:
\`\`\`python
from databricks.langchain import DatabricksVectorSearch
retriever = DatabricksVectorSearch(index, embedding, text_column="chunk_text")
                    .as_retriever(search_kwargs={"k": 5, "filter": {"doc_type": "regulation"}})
\`\`\`

**Cost optimization**:
- Vector Search Endpoint: Pay for uptime, not per-query
- Optimize embedding model: Smaller embeddings (384-dim BGE-small) vs (1536-dim Ada-002)
- Semantic caching: Cache (query_embedding, response) pairs in Redis — avoid recomputing for repeated queries`,
code:`from databricks.vector_search.client import VectorSearchClient

vsc = VectorSearchClient()

# Create endpoint (one-time)
vsc.create_endpoint(
    name="appr-vs-endpoint",
    endpoint_type="STANDARD"
)

# Create Delta Sync Index (auto-embeddings)
index = vsc.create_delta_sync_index(
    endpoint_name="appr-vs-endpoint",
    source_table_name="prod.silver.appr_document_chunks",
    index_name="prod.vector_indexes.appr_docs",
    primary_key="chunk_id",
    embedding_source_column="chunk_text",
    embedding_model_endpoint_name="databricks-bge-large-en",   # Model Serving endpoint
    pipeline_type="TRIGGERED"   # or "CONTINUOUS" for near-real-time sync
)

# Or: pre-computed embeddings (Direct Vector Access)
index_direct = vsc.create_direct_vector_access_index(
    endpoint_name="appr-vs-endpoint",
    index_name="prod.vector_indexes.appr_precomputed",
    primary_key="chunk_id",
    embedding_dimension=768,
    embedding_vector_column="embedding"
)
index_direct.upsert(chunks_with_embeddings_df)

# Query: semantic search
results = index.similarity_search(
    query_text="What is the compensation for a 3-hour flight delay?",
    columns=["chunk_text", "source_document", "regulation_section"],
    num_results=5,
    filters={"doc_type": "REGULATION"}  # Metadata filter
)

# Hybrid search (vector + keyword)
results = index.similarity_search(
    query_text="flight delay compensation Air Canada",
    columns=["chunk_text", "source_document"],
    query_type="HYBRID",   # Combines BM25 + vector similarity
    num_results=5
)`,
tags:['Vector Search','Delta Sync Index','RAG','Embeddings','Hybrid Search','LangChain','Semantic Search','BGE','Cosine Similarity','Unity Catalog']},

{q:'What is DBRX? How do Databricks Foundation Model APIs simplify GenAI development?',diff:'pr',
simple:`DBRX is Databricks' open-source LLM (132B parameter MoE architecture), competitive with GPT-3.5 and Mixtral. Released March 2024.

Foundation Model APIs are a unified serving layer in Databricks that lets you call pre-built LLMs (DBRX, Llama 3, Mistral, BGE) via the same API as your own deployed models — no separate API keys, billing, or infrastructure. Governed by Unity Catalog.`,
detailed:`**DBRX architecture**:
- 132B total parameters, MoE (Mixture of Experts): 36B active per forward pass
- 16 experts, 4 selected per token → efficient inference despite large model
- Context length: 32K tokens
- Open weights on Hugging Face: databricks/dbrx-instruct
- Trained on 12T tokens of curated text + code data
- Outperforms: GPT-3.5 Turbo, Llama 2 70B, Mixtral 8×7B on most benchmarks

**Foundation Model APIs** (Databricks Serverless LLMs):
- No infrastructure management: call models without deploying GPU clusters
- Models available: DBRX Instruct, Llama 3 (8B, 70B), Mistral 7B, BGE (embeddings), Llama 2 (7B, 13B, 70B)
- Pricing: per token (similar to OpenAI pricing but fully in your Databricks account)
- Unity Catalog governed: all calls logged, access controlled, auditable
- HIPAA/SOC2 compliant: data never leaves your account for processing

**External Model Endpoint**:
- Route requests to external providers (OpenAI, Anthropic, Azure OpenAI, AWS Bedrock)
- Same /invocations endpoint as your custom models
- Centralized governance: all external API calls go through Databricks → unified logging, rate limiting, cost tracking
- For APPR chatbot: Claude 3.5 Sonnet via Anthropic → same endpoint API as DBRX

**LLM Fine-tuning on Databricks**:
- Mosaic AI Training: managed fine-tuning on Databricks compute
- Supports: DBRX, Llama 2/3, Code Llama, MPT
- Techniques: Full fine-tuning, LoRA, QLoRA
- Data: Delta table → tokenization → training → model registered in Unity Catalog

**AI Playground**:
- Databricks UI for testing Foundation Models interactively
- Compare DBRX vs Llama 3 vs Claude on the same prompt
- Export conversation as LangChain code for notebook development`,
code:`# Foundation Model APIs: use DBRX via Databricks serving
import mlflow.deployments

# Connect to Databricks deployment client
client = mlflow.deployments.get_deploy_client("databricks")

# Chat with DBRX (Foundation Model API)
response = client.predict(
    endpoint="databricks-dbrx-instruct",
    inputs={
        "messages": [
            {"role": "system", "content": "You are an APPR claims specialist."},
            {"role": "user", "content": "What compensation is owed for a 4h delay?"}
        ],
        "max_tokens": 512,
        "temperature": 0.0
    }
)

# Use BGE for embeddings (Foundation Model API)
embeddings_response = client.predict(
    endpoint="databricks-bge-large-en",
    inputs={"input": ["Flight delay compensation", "APPR regulatory requirements"]}
)

# External model: Claude via Databricks endpoint (unified API)
claude_response = client.predict(
    endpoint="my-anthropic-claude-endpoint",   # External model configured in UC
    inputs={"messages": [{"role": "user", "content": "Summarize APPR Section 19"}]}
)

# LangChain with Databricks Foundation Models
from langchain_databricks import ChatDatabricks, DatabricksEmbeddings

llm = ChatDatabricks(
    endpoint="databricks-dbrx-instruct",
    max_tokens=1024,
    temperature=0.1
)

embeddings = DatabricksEmbeddings(endpoint="databricks-bge-large-en")`,

{q:'What is Databricks AutoML? When does it help and when is it not enough?',diff:'sr',
simple:`Databricks AutoML automatically trains and tunes multiple ML models for your dataset — running a grid search over algorithms (Gradient Boosting, Random Forest, LightGBM, etc.) and hyperparameters, logging all runs to MLflow, and producing the best model.

Outputs: best model registered in MLflow, plus an editable notebook showing the winning configuration so you can customize further.`,
detailed:`**What AutoML does**:
1. Data analysis: inspects feature types, distributions, missing values
2. Feature engineering: date features from timestamps, ordinal encoding, imputation
3. Model training: runs multiple algorithms with different hyperparameter configurations
4. MLflow logging: all runs tracked — compare models across experiment
5. Best model: identified by primary metric (F1, AUC, RMSE)
6. Explanation notebook: generated Python notebook showing winning model's exact code

**Supported problem types**:
- Classification (binary, multi-class)
- Regression
- Forecasting (time-series, using Prophet, ARIMA, AutoARIMA)

**When AutoML helps**:
✅ Quick baseline: establish what AUC/RMSE is achievable on your data
✅ Feature importance: fast understanding of which features matter
✅ Non-ML teams: analysts can run AutoML without Spark/ML expertise
✅ Time pressure: need a deployed model quickly without hyperparameter research
✅ Small-to-medium datasets: < 100M rows, typical tabular data

**When AutoML is not enough**:
❌ Custom architectures: deep learning, multi-modal, sequence models
❌ Custom loss functions: business-specific optimization target
❌ Complex feature engineering: domain-specific features AutoML can't generate
❌ Very large datasets: AutoML samples data; may miss patterns in full data
❌ Sequential/text/image data: AutoML is tabular-only

**AutoML + manual iteration** (best pattern):
1. Run AutoML → get baseline AUC (e.g., 0.78)
2. Open generated notebook → understand winning features
3. Add domain-specific features (delay patterns, carrier history, route seasonality)
4. Re-run experiments with new features → achieve higher AUC (e.g., 0.91)

**Forecasting AutoML**:
- Handles: multiple time series (one per carrier, per route), seasonality, holidays
- Algorithms: Prophet, ARIMA, Exponential Smoothing, DeepAR (via custom model)
- Useful for: demand forecasting, capacity planning, anomaly detection baselines`,
code:`import databricks.automl as automl

# Classification AutoML
summary = automl.classify(
    dataset=spark.table("gold.appr_training_features"),
    target_col="will_be_delayed",                    # Binary label
    primary_metric="f1",                             # Optimize for F1
    timeout_minutes=60,                              # Budget
    exclude_frameworks=["sklearn"],                  # Only tree-based models
    max_trials=50                                    # Max experiments to run
)

# Access results
print(f"Best model AUC: {summary.best_trial.evaluation_metric_score}")
print(f"Best trial run ID: {summary.best_trial.mlflow_run_id}")

# Open the generated exploration notebook
print(f"Exploration notebook: {summary.exploration_notebook_path}")
print(f"Best trial notebook:  {summary.best_trial.notebook_path}")

# Register best model
mlflow.register_model(
    f"runs:/{summary.best_trial.mlflow_run_id}/model",
    "main.ml_models.appr_delay_classifier"
)

# Time-series forecasting
forecast_summary = automl.forecast(
    dataset=spark.table("gold.daily_flight_demand"),
    target_col="passenger_count",
    time_col="flight_date",
    frequency="d",                   # Daily frequency
    horizon=30,                      # Forecast 30 days ahead
    identity_col=["carrier_code"],   # One forecast per carrier
    primary_metric="smape"           # Symmetric MAPE
)`,

{q:'Walk me through your most impactful Databricks implementation. (STAR format - APPR Claims Chatbot)',diff:'pr',
simple:`Use your APPR Claims Processing Chatbot as the anchor story. This has all the elements of a strong Principal-level answer: large-scale data problem, ML + data engineering, measurable business impact, architectural decisions with documented trade-offs.

Key metrics to highlight: 88% time reduction, 94% ruling consistency, 0.87 RAGAS faithfulness, 42% cost reduction.`,
detailed:`**Full STAR Story — APPR Claims Chatbot**:

**Situation**:
"At Air Canada, APPR (Air Passenger Protection Regulations) claims processing was handled by 12 claims agents who manually reviewed disruption records against Canadian regulatory guidelines. Each claim took 8-12 minutes to research. During disruption events (weather, ATC), we'd receive 500+ simultaneous claims — the backlog would grow for days, creating regulatory risk and passenger dissatisfaction."

**Task**:
"As the senior ML engineer, I was tasked with building an AI-assisted claims processing system. The goal: reduce agent research time by >80%, improve consistency across agents (who had different interpretations of regulations), and integrate into the existing Snowflake data infrastructure."

**Action**:
Step 1 — Data Architecture on Databricks:
- Built Delta Lake Bronze/Silver pipeline for APPR regulations (PDFs), disruption records (from Snowflake CDC), and historical rulings
- DLT pipeline for continuous ingestion of new regulatory guidance
- Auto Loader for document processing, with DLT Expectations for quality validation

Step 2 — RAG Pipeline:
- Document chunking (512-token chunks with 50-token overlap) stored in Silver Delta table
- Databricks Vector Search with BGE-M3 embeddings → Delta Sync index
- LangGraph stateful orchestration: query → retrieve → augment → LLM → confidence check → HITL if low confidence
- Claude 3.5 Sonnet via Anthropic API (best performance on regulatory text)
- PostgresSaver checkpoint for multi-turn conversation state

Step 3 — MLflow + Evaluation:
- MLflow experiment tracking: chunk sizes, top-K, temperature, model variants
- RAGAS framework: faithfulness 0.87, answer relevancy 0.91, context recall 0.89
- Semantic caching (Redis): cache (embedding, response) pairs for repeated regulatory questions

Step 4 — Production deployment:
- Model Serving endpoint on Databricks with payload logging
- LangSmith for production trace monitoring
- Power BI dashboard for claims agent productivity metrics

**Result**:
- Claims research time: 8-12 min → 90 seconds (88% reduction)
- Ruling consistency: 78% → 94% (agents follow AI recommendation 94% of time)
- Cost: $0.12/claim → $0.07/claim after semantic caching (42% reduction)
- Scale: Handles 500+ simultaneous claims vs previous 50-claim backlog ceiling`,
code:`# APPR Claims Chatbot - Key architectural components
# (simplified version of production system)

# LangGraph stateful pipeline
from langgraph.graph import StateGraph, END
from langgraph.checkpoint.postgres import PostgresSaver

class APPRState(TypedDict):
    query: str
    flight_context: dict          # From Snowflake disruption records
    retrieved_regulations: list   # From Databricks Vector Search
    draft_ruling: str             # LLM draft
    confidence_score: float       # Self-assessed confidence
    requires_human_review: bool   # HITL flag
    final_ruling: str             # Approved ruling

def retrieve_regulations(state: APPRState) -> APPRState:
    """Query Vector Search for relevant APPR regulations."""
    results = index.similarity_search(
        query_text=state["query"],
        num_results=5,
        filters={"doc_type": ["REGULATION", "RULING"]}
    )
    state["retrieved_regulations"] = results
    return state

def generate_ruling(state: APPRState) -> APPRState:
    """LLM generates ruling with confidence."""
    prompt = build_appr_prompt(state["query"], state["retrieved_regulations"],
                               state["flight_context"])
    response = llm.invoke(prompt)
    state["draft_ruling"] = response.content
    state["confidence_score"] = extract_confidence(response)
    return state

def route_hitl(state: APPRState) -> str:
    """Route to human if confidence < threshold."""
    if state["confidence_score"] < 0.85:
        return "human_review"
    return "finalize"

# Build graph
graph = StateGraph(APPRState)
graph.add_node("retrieve", retrieve_regulations)
graph.add_node("generate", generate_ruling)
graph.add_node("human_review", human_in_the_loop)
graph.add_node("finalize", finalize_ruling)
graph.add_edge("retrieve", "generate")

{q:'How do you handle a Databricks pipeline failure in production? Walk through your incident response.',diff:'pr',
simple:`Databricks production incident response: Alert → Assess → Mitigate → Diagnose → Fix → Post-mortem. Same framework as any production system, but Databricks-specific tools: Workflow job alerts, DLT pipeline event log, Spark UI, MLflow experiment tracking, Databricks Lakehouse Monitoring.`,
detailed:`**Databricks-specific incident response**:

**Phase 1: Detect (<5 min)**:
- Databricks Job/DLT Pipeline alert fires (PagerDuty/Slack via webhook)
- Check: Job Runs UI → failed run → error message
- DLT Pipeline: Event log for last failure → "flow_progress" events with error details
- Lakehouse Monitoring: Check data quality metrics dashboard

**Phase 2: Assess & Mitigate (<15 min)**:
Categorize the failure:
1. **Data issue**: Bad input file, schema mismatch, malformed JSON → Check DLT expectations, Auto Loader rescue data column
2. **OOM**: Executor crash → Check Spark UI task metrics, reduce partition size
3. **Cluster failure**: Node failure → Databricks auto-restarts failed tasks; check cluster logs in DBFS
4. **Code bug**: Null pointer, import error → Check driver logs, fix and redeploy
5. **Downstream dependency**: Snowflake connection timeout, S3 throttle → Check external service status

**Mitigation options**:
- DLT: Manually trigger pipeline run → it resumes from last checkpoint
- Structured Streaming: Query restarts from checkpoint automatically
- Job: Retry failed task only (not full run) via Workflow API
- Emergency: Switch to backup data path (e.g., fallback to hourly batch if streaming fails)

**Phase 3: Diagnose**:
- DLT Event log: \`SELECT * FROM event_log('/pipelines/{id}/system/events') WHERE level = 'ERROR'\`
- Spark UI: Driver logs → Executor logs → GC logs
- DBFS audit: Check if files arrived (Auto Loader source)
- Unity Catalog audit log: Check access failures
- Expectation violations: Which rows failed what checks?

**Phase 4: Fix & Prevent**:
Fix with code review → deploy via CI/CD (Asset Bundles)
Prevention: Add DLT expectations, improve OOM handling (repartition), add Lakehouse Monitoring rules

**Post-mortem**: Document in Confluence. 5 Whys. Action items with owners.`,
code:`# DLT: Query event log for errors
events_df = spark.sql("""
    SELECT
        timestamp,
        event_type,
        level,
        details:flow_name::STRING AS flow_name,
        details:error:fatal_error::STRING AS fatal_error,
        details:error:cause::STRING AS cause
    FROM event_log('/pipelines/appr-pipeline-id/system/events')
    WHERE level IN ('ERROR', 'WARN')
      AND timestamp >= DATEADD(HOUR, -2, CURRENT_TIMESTAMP())
    ORDER BY timestamp DESC
""")
events_df.show(truncate=False)

# Check expectation violations
violations = spark.sql("""
    SELECT
        details.flow_name,
        details.expectations[0].name   AS rule_name,
        details.expectations[0].failed AS failed_count,
        details.expectations[0].passed AS passed_count
    FROM event_log('/pipelines/appr-pipeline-id/system/events')
    WHERE event_type = 'flow_progress'
      AND details.expectations[0].failed > 0
    ORDER BY timestamp DESC LIMIT 10
""")

# Databricks Jobs: trigger retry via API
import requests
resp = requests.post(
    "https://adb-xxx.azuredatabricks.net/api/2.1/jobs/runs/submit",
    headers={"Authorization": f"Bearer {token}"},
    json={
        "run_name": "manual-retry-appr-pipeline",
        "job_id": 12345,
        "idempotency_token": str(uuid.uuid4())
    }
)`,

{q:'Describe a difficult technical trade-off you made on a Databricks project.',diff:'pr',
simple:`Use a real decision where both options had genuine merit. The best answers show systematic evaluation, quantified trade-offs, a defensible decision, and measured outcome.

Good Databricks trade-off topics: DLT vs manual Structured Streaming, Vector Search vs Pinecone, Triggered vs Continuous pipeline mode, Serverless SQL vs Classic Warehouse, Delta Lake vs Iceberg for multi-engine access.`,
detailed:`**Strong answer structure for APPR chatbot context**:

**Situation**: "We needed to choose a vector database for the APPR claims RAG pipeline. Options: Databricks Vector Search vs Pinecone."

**Trade-off evaluation**:
\`\`\`
Databricks Vector Search:
✅ Unity Catalog governance (column masking, audit logging on retrievals)
✅ Delta Sync: auto-updates when Bronze table changes
✅ Same platform (no external API dependency, no extra billing)
✅ Native LangChain integration
❌ Less mature: fewer query options, no multi-vector search at time of evaluation
❌ Only works within Databricks workspace

Pinecone:
✅ More mature: namespace filtering, hybrid search, metadata filtering
✅ Serverless with < 100ms guaranteed latency
✅ Works outside Databricks (future flexibility)
❌ External API: PII in claims data leaving our VPC boundary = compliance risk
❌ Separate billing, separate access control, separate audit logs
❌ No automatic sync with Delta — need custom pipeline to keep in sync
\`\`\`

**Decision**: Chose Databricks Vector Search. Compliance non-negotiable — passenger PII cannot leave our cloud boundary. Governance was the deciding factor.

**Outcome**: Production in 3 weeks. P95 retrieval latency 85ms (within SLA). Delta Sync saved us ~200 lines of sync pipeline code. When APPR regulatory documents updated, index refreshed automatically within 1 hour.

**What I'd do differently**: Start with a load test to validate latency at 100 concurrent claims agents — we got lucky that 85ms was sufficient. Next time: benchmark latency SLA before committing to vector database choice.`,
code:`# Decision scorecard: Vector Search vs Pinecone
TRADE_OFF_MATRIX = {
    "criteria": {
        "weight_pct": {
            "governance_compliance": 40,  # Non-negotiable for APPR
            "retrieval_latency_p95": 20,
            "sync_complexity":       15,
            "feature_maturity":      15,
            "total_cost":            10
        },
        "databricks_vector_search": {
            "governance_compliance": 10,  # Unity Catalog native (max score)
            "retrieval_latency_p95":  7,  # 85ms measured
            "sync_complexity":       10,  # Delta Sync = automatic
            "feature_maturity":       6,  # Good but not as rich
            "total_cost":             9   # Included in Databricks spend
        },
        "pinecone": {
            "governance_compliance":  4,  # PII leaves VPC = compliance risk
            "retrieval_latency_p95": 10,  # <100ms guaranteed SLA
            "sync_complexity":        5,  # Custom sync pipeline needed
            "feature_maturity":      10,  # More mature, richer API
            "total_cost":             7   # Separate billing
        }
    },
    "weighted_score": {
        "databricks_vector_search": 8.7,  # Winner on weighted criteria
        "pinecone":                  6.3
    },
    "decision": "Databricks Vector Search",
    "primary_driver": "Compliance: passenger PII cannot leave VPC boundary"
}`,

{q:'How do you stay current with the Databricks platform? How do you manage rapid feature releases?',diff:'sr',
simple:`Databricks ships major features every 1-2 months. Staying current: follow the Databricks Blog and release notes, attend Data + AI Summit (annual), use Databricks Academy for certifications, participate in the community forum, and run a personal "lab workspace" to test new features before they hit production.

For teams: establish a "feature adoption" process — track releases, evaluate relevance, test in dev, deploy with documentation.`,
detailed:`**Information sources (prioritized)**:

**Tier 1 — Must read**:
- Databricks Blog (databricks.com/blog): major feature announcements
- GitHub databricks/databricks-sdk-py and databricks/databricks-cli: release notes
- Data + AI Summit (June, virtual available): 3-day deep dive on roadmap
- Databricks Academy: certification paths updated with new features

**Tier 2 — Follow regularly**:
- Databricks Community Forum: real production problems + solutions
- @databricks on Twitter/X: quick feature callouts
- LinkedIn Learning Databricks paths
- YouTube: Databricks channel — conference talks + feature demos

**Tier 3 — Monitor**:
- Databricks GitHub issues: understand what's being fixed / planned
- Delta.io and openformat communities: open-source feature direction

**Feature adoption process for a team**:
1. Monthly review: read release notes for DBR + Unity Catalog + DLT
2. Relevance assessment: does this affect our stack? Score 1-5.
3. Lab test: try high-relevance features in dev workspace
4. Decision: adopt / defer / skip + document reasoning
5. Deploy: update production with runway (migration plan if breaking change)

**Databricks certifications** (showing commitment):
- Databricks Certified Data Engineer Associate → Professional
- Databricks Certified Machine Learning Professional
- Databricks Certified Associate Developer for Apache Spark

**Rapid release management**:
- Pin DBR versions in cluster policies + job configs (never use "latest")
- Test DBR upgrades in dev first, monitor for deprecation warnings
- Use LTS releases for production (maintained 2 years)
- Subscribe to Databricks security advisories (separate from feature releases)`,
code:`# Staying current: automated release monitoring
# (Example: GitHub Actions workflow to track Databricks release notes)

# .github/workflows/databricks-release-monitor.yml
name: Monitor Databricks Releases
on:
  schedule:
    - cron: '0 9 * * MON'  # Every Monday morning
jobs:
  check-releases:
    steps:
      - name: Fetch latest DBR version
        run: |
          # Check latest published DBR
          curl -s https://api.databricks.com/api/2.0/clusters/spark-versions \
            -H "Authorization: Bearer \${{ secrets.DATABRICKS_TOKEN }}" \
            | jq '[.versions[] | select(.key | startswith("13"))] | .[0]'

      - name: Compare with pinned version
        run: |
          CURRENT="13.3.x-scala2.12"
          LATEST=$(fetch_latest_lts)
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "::warning::New LTS available: $LATEST (current: $CURRENT)"
          fi

# Team feature adoption tracker (Delta table)
CREATE TABLE IF NOT EXISTS team.platform.feature_adoption (
    feature_name   STRING,
    release_date   DATE,
    relevance_score INT,   -- 1-5
    status         STRING, -- 'evaluating' / 'adopted' / 'deferred' / 'skipped'
    notes          STRING,
    owner          STRING,
    updated_at     TIMESTAMP
) USING DELTA;

 'Needed for full-refresh CDC sources', 'sid', current_timestamp()),
('Serverless DLT', '2024-01-20', 5, 'evaluating',
 'Cost modeling in progress vs current job clusters', 'sid', current_timestamp());`,

];


// ═══════════════════════════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════════════════════════
let curCat='platform', gMode='simple', gFilter='all', allExp=false;
const _memStore={};
let reviewed=new Set();
try{reviewed=new Set(JSON.parse(localStorage.getItem('db_interview_rev')||'[]'));}catch(e){reviewed=new Set(JSON.parse(_memStore['db_interview_rev']||'[]'));}

function save(){try{localStorage.setItem('db_interview_rev',JSON.stringify([...reviewed]));}catch(e){_memStore['db_interview_rev']=JSON.stringify([...reviewed]);}}
function totalQ(){return CATS.reduce((s,c)=>s+c.qs.length,0);}
function startNum(catId){let n=1;for(const c of CATS){if(c.id===catId)break;n+=c.qs.length;}return n;}

function init(){renderTabs();renderCat(curCat);updateStats();}

function renderTabs(){
  document.getElementById('tabs').innerHTML=CATS.map(c=>`
    <button class="tab ${c.id===curCat?'on':''}" onclick="switchCat('${c.id}')">
      ${c.icon} ${c.label} <span class="tab-c">${c.qs.length}</span>
    </button>`).join('');
}

function switchCat(id){
  curCat=id;allExp=false;
  document.getElementById('exp-btn').textContent='Expand All';
  document.getElementById('si').value='';
  renderTabs();renderCat(id);
  document.getElementById('main').scrollIntoView({behavior:'smooth'});
}

function renderCat(id){
  const cat=CATS.find(c=>c.id===id);
  const sn=startNum(id);
  document.getElementById('main').innerHTML=`
    <div class="cat-hdr">
      <span class="cat-icon">${cat.icon}</span>
      <div><div class="cat-title">${cat.label}</div>
      <div class="cat-desc">${cat.desc} · ${cat.qs.length} questions</div></div>
    </div>
    <div class="qa-grid">${cat.qs.map((q,i)=>card(q,sn+i)).join('')}</div>`;
}

function card(q,n){
  const done=reviewed.has(n);
  const dc={'sr':'d-sr','pr':'d-pr','ar':'d-ar'}[q.diff];
  const dl={'sr':'Senior','pr':'Principal','ar':'Architect'}[q.diff];
  return `<div class="card${done?' done':''}" id="c${n}" data-diff="${q.diff}">
    <div class="card-hdr" onclick="tog(${n})">
      <span class="qn">Q${n}</span>
      <span class="diff ${dc}">${dl}</span>
      <span class="q-txt">${q.q}</span>
      <input type="checkbox" class="rev-cb" ${done?'checked':''} title="Mark reviewed"
        onclick="event.stopPropagation();toggleRev(${n})">
      <span class="exp-ico">▼</span>
    </div>
    <div class="card-body">
      <div class="mode-btns">
        <button class="m-btn${gMode==='simple'?' on':''}" onclick="setMode(${n},'simple')">Simple</button>
        <button class="m-btn${gMode==='detailed'?' on':''}" onclick="setMode(${n},'detailed')">Detailed</button>
      </div>
      <div class="sec${gMode==='simple'?' vis':''}" id="s${n}">
        <div class="a-lbl">Simple Explanation</div>${fmt(q.simple)}
      </div>
      <div class="sec${gMode==='detailed'?' vis':''}" id="d${n}">
        <div class="a-lbl">Principal-Level Answer</div>${fmt(q.detailed)}
        ${q.code?`<div class="cb">${esc(q.code)}</div>`:''}
      </div>
      <div class="tags">${q.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>
  </div>`;
}

function fmt(t){
  if(!t)return'';
  return t.split('\n').map(l=>{
    l=l.trim();if(!l)return'';
    l=l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    l=l.replace(/`([^`]+)`/g,'<code class="ic">$1</code>');
    return`<p>${l}</p>`;
  }).join('');
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tog(n){document.getElementById('c'+n).classList.toggle('open');}

function setMode(n,m){
  const s=document.getElementById('s'+n),d=document.getElementById('d'+n);
  s.classList.toggle('vis',m==='simple');d.classList.toggle('vis',m==='detailed');
  document.querySelectorAll(`#c${n} .m-btn`).forEach((b,i)=>b.classList.toggle('on',(i===0)===(m==='simple')));
}

function toggleGlobal(){
  gMode=gMode==='simple'?'detailed':'simple';
  document.getElementById('mode-btn').textContent=`Mode: ${gMode==='simple'?'Simple':'Detailed'}`;
  document.querySelectorAll('.card.open').forEach(c=>{
    const n=c.id.replace('c','');
    const s=document.getElementById('s'+n),d=document.getElementById('d'+n);
    if(s){s.classList.toggle('vis',gMode==='simple');d.classList.toggle('vis',gMode==='detailed');}
    c.querySelectorAll('.m-btn').forEach((b,i)=>b.classList.toggle('on',(i===0)===(gMode==='simple')));
  });
}

function toggleAll(){
  allExp=!allExp;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('open',allExp));
  document.getElementById('exp-btn').textContent=allExp?'Collapse All':'Expand All';
}

function toggleRev(n){
  if(reviewed.has(n)){reviewed.delete(n);document.getElementById('c'+n)?.classList.remove('done');}
  else{reviewed.add(n);document.getElementById('c'+n)?.classList.add('done');}
  save();updateStats();
}

function updateStats(){
  const t=totalQ(),r=reviewed.size,p=Math.round(r/t*100);
  document.getElementById('tot').textContent=t;
  document.getElementById('rev').textContent=r;
  document.getElementById('pct').textContent=p+'%';
  document.getElementById('pb').style.width=p+'%';
}

function doSearch(){
  const q=document.getElementById('si').value.toLowerCase().trim();
  if(!q){renderCat(curCat);return;}
  let res=[],n=1;
  for(const cat of CATS){
    for(const qs of cat.qs){
      const hay=(qs.q+' '+qs.simple+' '+qs.detailed+' '+qs.tags.join(' ')).toLowerCase();
      if(hay.includes(q))res.push({qs,n,cat});
      n++;
    }
  }
  const main=document.getElementById('main');
  if(!res.length){
    main.innerHTML=`<div class="no-res">🔍 No results for "${q}"<br><span style="font-size:12px;opacity:.5">Try: Delta Lake, MLflow, AQE, DLT, Vector Search, Photon, APPR...</span></div>`;
    return;
  }
  main.innerHTML=`
    <div class="cat-hdr"><span class="cat-icon">🔍</span>
    <div><div class="cat-title">Search Results</div>
    <div class="cat-desc">${res.length} questions matching "${q}"</div></div></div>
    <div class="qa-grid">${res.map(r=>card(r.qs,r.n)).join('')}</div>`;
}

function setFilter(f){
  gFilter=f;
  ['all','sr','pr','ar','un'].forEach(x=>document.getElementById('f-'+x)?.classList.remove('on'));
  document.getElementById('f-'+f)?.classList.add('on');
  document.querySelectorAll('.card').forEach(c=>{
    const n=parseInt(c.id.replace('c',''));
    let hide=false;
    if(f==='un')hide=reviewed.has(n);
    else if(f!=='all')hide=c.dataset.diff!==f;
    c.classList.toggle('hidden',hide);
  });
}

function randQ(){
  const cat=CATS[Math.floor(Math.random()*CATS.length)];
  switchCat(cat.id);
  setTimeout(()=>{
    const cards=document.querySelectorAll('.card');
    if(!cards.length)return;
    const c=cards[Math.floor(Math.random()*cards.length)];
    c.classList.add('open');
    c.scrollIntoView({behavior:'smooth',block:'center'});
    c.style.borderColor='var(--accent)';
    c.style.boxShadow='0 0 20px rgba(255,54,33,0.15)';
    setTimeout(()=>{c.style.borderColor='';c.style.boxShadow='';},2500);
  },150);
}

init();
</script>
