{q:'What is Spark\'s speculative execution? How does it handle straggler tasks?',diff:'sr',
simple:`Speculative execution detects "straggler" tasks — tasks running much longer than their peers — and launches duplicate copies of them on other executors. Whichever copy finishes first wins; the other is killed. This prevents one slow node from delaying the entire stage.

Enable: spark.speculation = true. Default: false (disabled). The trade-off: wastes resources running duplicate tasks.`,
detailed:`**Why straggler tasks happen**:
- Hardware: one node has degraded disk I/O or network
- OS interference: JVM GC pause, OS swap, noisy-neighbour VM
- Data skew: one partition has disproportionate data (speculation won't fix this root cause)
- External call: task calling a slow external API or service

**How speculative execution works**:
1. Tracks median task duration within a stage
2. If a task runs > spark.speculation.multiplier × median (default 1.5×) AND the stage is > spark.speculation.quantile (default 90%) complete
3. Launches a speculative copy of that task on another executor
4. First copy to finish → result kept; other copy → killed
5. Logged in Spark UI as "speculative"

**Configuration**:
- spark.speculation = true (enable)
- spark.speculation.multiplier = 1.5 (task > 1.5× median = straggler)
- spark.speculation.quantile = 0.9 (wait until 90% of tasks done before speculating)
- spark.speculation.interval = 100ms (how often to check for stragglers)

**When speculation helps vs doesn't help**:
✅ Hardware degradation: bad disk/NIC on one executor → duplicate runs on healthy node
✅ Transient OS/JVM pauses
✅ Network call variance
❌ Data skew: skewed task is slow because of DATA VOLUME, not hardware — duplicate runs same skewed partition on another node, same result
❌ External service calls that aren't idempotent — duplicate call could double-charge/double-write

**Side effects to handle**:
- If tasks have side effects (writing to external DB), speculative execution may trigger them twice
- Solution: make all task operations idempotent (Delta Lake writes are idempotent; external writes need idempotency keys)

**Databricks note**: Spot instance preemption can look like a straggler. Speculation + Spot requires idempotent writes (Delta handles this automatically).`,
code:`# Enable speculative execution for production jobs with hardware variance
spark.conf.set("spark.speculation", "true")
spark.conf.set("spark.speculation.multiplier", "2.0")   # 2× median = straggler
spark.conf.set("spark.speculation.quantile", "0.85")    # 85% done before checking
spark.conf.set("spark.speculation.interval", "200ms")   # Check every 200ms

# Check if tasks were speculated in Spark UI:
# Stages → Tasks → "Status" column → "success (speculative)" entries

# Detect straggler distribution (proactive):
from pyspark.sql import functions as F
# After a job: query SparkListener events to find task duration outliers

# Ensure writes are idempotent (critical if speculation enabled):
# Delta Lake: always idempotent (transaction log prevents duplicate commits)
df.write.format("delta").mode("append").saveAsTable("silver.flights")  # Safe ✅

# External writes: add idempotency key
df.withColumn("write_attempt_id", F.monotonically_increasing_id()) \
  .write.format("jdbc") \
  .option("dbtable", "target") \
  .mode("append").save()  # ⚠️ Without idempotency key on DB side, may duplicate`,
tags:['Speculative Execution','Straggler Tasks','spark.speculation','Idempotent Writes','Spot Instance','Hardware Degradation','Task Duration','Stage Completion']},

{q:'How do you tune Spark for large-scale joins? What is the cost-based optimizer (CBO) and how do you enable it?',diff:'pr',
simple:`Spark's Cost-Based Optimizer (CBO) uses table and column statistics to make smarter join ordering, broadcast decisions, and aggregation strategies — instead of relying only on rule-based heuristics. Enable it with spark.sql.cbo.enabled=true and collect statistics with ANALYZE TABLE.`,
detailed:`**Why CBO matters**:
- Rule-based optimizer (default): applies transformations without knowing data size → may choose wrong join order
- CBO: uses actual row counts and column statistics to estimate result sizes → better decisions

**Statistics CBO uses**:
- Row count: how many rows in each table
- Column statistics: min, max, distinct count, null count, average column length
- Histogram: value distribution per column (for more accurate cardinality estimates)

**Enabling CBO**:
\`\`\`
spark.sql.cbo.enabled = true
spark.sql.cbo.joinReorder.enabled = true    # Let CBO reorder joins
spark.sql.cbo.joinReorder.dp.threshold = 12  # Max tables in reorder search
spark.sql.statistics.histogram.enabled = true # Column histograms
\`\`\`

**Collecting statistics**:
\`\`\`sql
ANALYZE TABLE silver.flights COMPUTE STATISTICS;
-- For specific columns (needed for CBO join decisions):
ANALYZE TABLE silver.flights COMPUTE STATISTICS FOR COLUMNS carrier_code, delay_min, flight_date;
\`\`\`

**Delta Lake and statistics**:
- Delta tables: Databricks automatically collects file-level statistics (min/max per column) in the Delta log
- These are used for data skipping (not the same as Spark CBO statistics)
- For Spark CBO: still need ANALYZE TABLE or spark.databricks.delta.collectStats=true

**Join tuning checklist**:
1. Check plans with EXPLAIN → identify SortMergeJoins that should be BroadcastHashJoins
2. Ensure broadcast threshold set correctly (spark.sql.autoBroadcastJoinThreshold)
3. Enable AQE (on by default) → dynamic broadcast conversion at runtime
4. Enable CBO + collect statistics for better join ordering
5. Use BROADCAST hints for known-small tables when stats are stale
6. Z-order fact tables on join keys → Delta data skipping reduces partitions scanned`,
code:`# Enable CBO and collect statistics
spark.conf.set("spark.sql.cbo.enabled", "true")
spark.conf.set("spark.sql.cbo.joinReorder.enabled", "true")
spark.conf.set("spark.sql.statistics.histogram.enabled", "true")

# Collect statistics on Silver tables (run after major data loads)
spark.sql("ANALYZE TABLE prod.silver.flights COMPUTE STATISTICS")
spark.sql("""
    ANALYZE TABLE prod.silver.flights
    COMPUTE STATISTICS FOR COLUMNS
        carrier_code, flight_date, delay_min, origin_airport, dest_airport
""")

# Check collected statistics
spark.sql("DESCRIBE EXTENDED prod.silver.flights").show(50, truncate=False)
# Look for: Statistics row showing bytes + row count

# Delta: enable automatic stats collection on write
spark.conf.set("spark.databricks.delta.stats.collect", "true")
spark.conf.set("spark.databricks.delta.stats.skipping", "true")

# Multi-way join ordering: CBO reorders for minimum intermediate size
# Example: 3-way join
result = (fact_flights
    .join(dim_carrier, "carrier_code")         # CBO decides order
    .join(dim_airport, "origin_airport")        # CBO may reorder these
    .join(dim_date,    "date_key"))             # based on table sizes

result.explain("cost")  # Shows estimated costs with CBO enabled
# Look for: estimated rows and sizes at each step

# Without CBO (rule-based): joins in written order (may be suboptimal)
# With CBO: smallest table joined first → smaller intermediate results`,
tags:['Cost-Based Optimizer','CBO','Join Ordering','ANALYZE TABLE','Statistics','Column Statistics','Histogram','AQE','Join Tuning','Broadcast Threshold']},
{q:'What is Spark partitioning? How do repartition() and coalesce() differ? How do you choose partition count?',diff:'sr',
simple:`Partitioning splits data across executor tasks. More partitions = more parallelism, but also more overhead per task. The right partition count matches your cluster's cores.

• repartition(n): Full shuffle — redistributes all data evenly across n partitions. Expensive but produces even partitions.
• coalesce(n): Reduces partitions WITHOUT a full shuffle — merges existing partitions. No data movement if reducing. Cheaper than repartition but may produce uneven partitions.`,
detailed:`**Partition sizing rules**:
- Target size: 128MB–1GB per partition (Databricks default: 128MB)
- Too many small partitions: Task scheduling overhead dominates; 1000 tasks × 1MB = bad
- Too few large partitions: Under-utilizes cluster; long GC pauses; OOM risk per task
- Rule of thumb: 2-4× the number of CPU cores in the cluster for shuffle partitions

**repartition(n)** or **repartition(n, col)**:
- Always triggers a full shuffle
- Produces exactly n partitions, evenly distributed (by hash of column or round-robin)
- Use when: data is skewed and you need even redistribution; before a write to control file count; increasing partition count
- repartition(n, "carrier_code"): colocates same carrier on same partition — useful before groupBy("carrier_code")

**coalesce(n)**:
- Reduces partition count by merging adjacent partitions
- No shuffle: tasks simply process multiple input partitions
- Result: partitions may be uneven (adjacent partitions merged as-is)
- Use when: reducing partition count after filtering (e.g., 500 partitions → 50 after WHERE)
- Cannot increase partition count (use repartition for that)

**spark.sql.shuffle.partitions** (default 200):
- Applies to shuffle operations (groupBy, join)
- 200 is often wrong: too many for small data (overhead), too few for large data (OOM/spill)
- AQE tunes this at runtime — leave it and let AQE handle it
- Manual tuning: shuffle_partitions ≈ (total_shuffle_data_GB × 1024) / 128MB_per_partition

**Delta write partitioning** (different concept):
- Partitioned Delta tables: PARTITIONED BY (date) creates separate directories
- Within each partition: file count controlled by repartition before write or optimizeWrite
- Target: ~1 GB files for optimal Delta read performance`,
code:`from pyspark.sql import functions as F

# Check current partition count
print(df.rdd.getNumPartitions())

# repartition: even shuffle to target count
df_even = df.repartition(200)

# repartition by column: colocate same values (useful before groupBy)
df_by_carrier = df.repartition(50, "carrier_code")

# coalesce: merge partitions (cheaper, no shuffle)
# After heavy filter that reduced data 10x:
df_filtered = df.filter(F.col("year") == 2024)  # 500 parts → ~50 parts of data
df_compact = df_filtered.coalesce(50)            # Reduce to 50 without shuffle

# Optimal partition count for cluster:
cluster_cores = 32  # 8 workers × 4 cores
optimal_partitions = cluster_cores * 3  # 96 partitions
spark.conf.set("spark.sql.shuffle.partitions", optimal_partitions)

# Writing Delta with controlled file size
(df
    .repartition(50, "flight_date")  # 50 files per date partition
    .write.format("delta")
    .partitionBy("flight_date")
    .option("dataChange", "true")
    .saveAsTable("silver.flights"))

# Better: let optimizeWrite handle it
spark.conf.set("spark.databricks.delta.optimizeWrite.enabled", "true")
df.write.format("delta").partitionBy("flight_date").saveAsTable("silver.flights")`,
tags:['Partitioning','repartition','coalesce','shuffle.partitions','AQE','File Size','OptimizeWrite','Partition Count','Cluster Cores']},

{q:'How do you diagnose and fix Out of Memory (OOM) errors in Spark?',diff:'pr',
simple:`OOM errors happen when a task tries to use more memory than its allocated executor or driver memory. Diagnose by checking: which stage failed, task memory usage in Spark UI, and whether it's executor OOM or driver OOM.

Common causes: data skew (one task gets 10× more data), broadcast join of tables too large to fit, collect() pulling all data to driver, too little memory per executor.`,
detailed:`**Types of Spark OOM**:

**1. Executor OOM** (java.lang.OutOfMemoryError: Java heap space):
- A task is processing too much data for its allocated memory
- Causes: Skewed partition (one task getting disproportionate data), large join, insufficient executor memory
- Fix: More executor memory, fewer shuffle partitions (larger tasks), fix data skew, avoid cartesian products

**2. Driver OOM** (OOM on driver node):
- Common cause: collect(), toPandas(), or show(n) pulling ALL data to driver
- Also: too many broadcast variables, too many accumulator values, query plan too complex
- Fix: Never collect() large datasets; use write() to storage instead; increase driver memory for large metadata

**3. GC OOM** (java.lang.OutOfMemoryError: GC overhead limit exceeded):
- JVM spending > 98% of time in garbage collection
- Cause: Too many small JVM objects, memory pressure from serialized data
- Fix: Use serialized storage levels, increase executor memory, use Databricks (Photon doesn't have JVM GC)

**Diagnostic workflow**:
1. Spark UI → Jobs → failed stage → Tasks tab
2. Look for: one task taking 10× longer than others (skew), GC time > 10% of task time
3. Executor logs: actual OOM stack trace
4. Storage tab: check if cache is taking too much memory

**Memory allocation breakdown** (executor memory):
- spark.executor.memory: Total JVM heap (e.g., 8g)
- spark.memory.fraction (0.6): 60% for execution + storage memory (unified)
- spark.memory.storageFraction (0.5): 50% of above for storage (cache)
- Remaining 40%: User memory for UDFs, data structures, etc.

**Photon advantage**: Photon runs off-heap (native C++ memory) — no JVM GC pressure on SQL queries. Dramatically reduces OOM risk for SQL workloads.

**Quick fixes**:
- Increase executor memory: cluster config → memory per core
- Reduce broadcast threshold: spark.sql.autoBroadcastJoinThreshold = -1 (disable if causing OOM)
- Increase shuffle partitions: more, smaller tasks
- Add .repartition() before large operations
- Use Photon for SQL-heavy workloads`,
code:`# Diagnosing OOM — key checks

# 1. Check data distribution (detect skew)
df.groupBy("carrier_code").count().orderBy(F.desc("count")).show(10)

# 2. Check memory usage per task in Spark UI
# Spark UI → Stages → Tasks → "Peak Memory" column

# 3. Fix driver OOM: never collect() large data
# BAD:
all_flights = flights_df.collect()  # 10M rows pulled to driver = OOM!

# GOOD: write to storage
flights_df.write.format("delta").save("/output/flights")

# Or if you need a sample:
sample = flights_df.limit(1000).toPandas()

# 4. Memory configuration
spark.conf.set("spark.executor.memory", "16g")
spark.conf.set("spark.executor.memoryOverhead", "4g")  # Off-heap (shuffle buffers)
spark.conf.set("spark.driver.memory", "8g")
spark.conf.set("spark.driver.maxResultSize", "4g")  # Limit collect() result size

# 5. Fix skewed join (skew OOM)
# Detect: one task has 100M rows while others have 10K
# AQE skew join (automatic):
spark.conf.set("spark.sql.adaptive.skewJoin.enabled", "true")

# Manual salting for extreme skew:
from pyspark.sql import functions as F
SALT = 10
large_df = df.withColumn("salt", (F.rand() * SALT).cast("int")) \
    .withColumn("skewed_key_salt", F.concat("skewed_key", F.lit("_"), "salt"))

small_df = small.crossJoin(spark.range(SALT).withColumnRenamed("id","salt")) \
    .withColumn("skewed_key_salt", F.concat("key", F.lit("_"), "salt"))
result = large_df.join(small_df, "skewed_key_salt")`,
tags:['OOM','Out of Memory','Data Skew','Driver OOM','Executor OOM','GC','Photon','Memory Tuning','Broadcast Threshold','collect()']},

{q:'What is Photon? How does it differ from Spark SQL and when does it not help?',diff:'pr',
simple:`Photon is Databricks' native vectorized query engine written in C++. It replaces the JVM-based Spark SQL engine for compatible operations, delivering 2-10× better performance for SQL workloads.

Instead of processing one row at a time (Spark's Volcano model), Photon processes thousands of rows at once in SIMD-optimized batches — using CPU caches and modern CPU vector instructions for maximum throughput.`,
detailed:`**Why Photon is faster than Spark SQL**:

**Spark SQL (JVM)**:
- Processes data using JVM objects → JVM overhead
- JVM garbage collection pauses → latency spikes
- Java code generated at runtime (Project Tungsten) — good but still JVM
- Row-at-a-time interpretation in Volcano model → CPU cache misses

**Photon (C++)**:
- Native C++ execution → no JVM overhead, no GC
- Vectorized processing: processes columnar batches of 1000s of rows using SIMD instructions
- CPU cache-friendly: columnar layout → entire column fits in L1/L2 cache
- No JIT warm-up: always at full native speed from first query

**Speedup patterns**:
- Table scans + filter + aggregation: 2-5× faster
- Large joins (hash join, sort merge join): 2-8× faster
- Window functions: 3-10× faster
- String operations: 2-4× faster

**When Photon DOESN'T help**:
- Python UDFs: Photon can't execute Python code — falls back to JVM for UDF rows
- Pandas UDFs: Photon doesn't apply to Python execution side
- RDD operations: Photon is SQL/DataFrame only
- Unsupported functions: Some exotic functions fall back to JVM Spark
- Data loading (I/O bound queries): Photon helps CPU-bound parts; S3 throughput still the limit

**Where Photon is enabled**:
- All SQL Warehouses (always on)
- DBR 9.1+ clusters: configure in cluster settings
- Not available on GPU clusters

**Checking Photon usage**:
Spark UI → SQL tab → look for "Photon" operators in the query plan. If you see "WholeStageCodegen" instead of "Photon", that operation fell back to JVM Spark.`,
code:`-- Photon SQL: automatic speedup, no code changes
-- This query runs through Photon automatically on SQL Warehouse:
SELECT
    carrier_code,
    AVG(delay_minutes) AS avg_delay,
    PERCENTILE(delay_minutes, 0.95) AS p95_delay,
    COUNT(*) AS flight_count
FROM silver.flights
WHERE flight_date >= '2024-01-01'
GROUP BY carrier_code
ORDER BY avg_delay DESC;

# Python/PySpark: Photon applies to DataFrame operations
# (but NOT Python UDFs)
result = (spark.table("silver.flights")
    .filter(F.col("flight_date") >= "2024-01-01")
    .groupBy("carrier_code")
    .agg(
        F.avg("delay_minutes").alias("avg_delay"),     # Photon ✅
        F.percentile_approx("delay_minutes", 0.95)     # Photon ✅
            .alias("p95_delay")
    ))

# Python UDF: falls BACK to JVM, Photon doesn't apply
@udf(returnType=FloatType())
def custom_fn(x):  # Photon ❌ - falls back to JVM Spark
    return x * 1.1

# Convert to built-in: Photon applies ✅
result = df.withColumn("adj_delay", F.col("delay_minutes") * 1.1)`,
tags:['Photon','Vectorized Execution','SIMD','C++','JVM GC','SQL Warehouse','Performance','Python UDF','Spark SQL','Tungsten']},
]},

// ── 5. STRUCTURED STREAMING ───────────────────────────────────────
{id:'streaming',icon:'🌊',label:'Structured Streaming',desc:'Micro-batch, watermarks, stateful ops, checkpointing',qs:[
{q:'Explain Spark Structured Streaming. What is the programming model and how does it handle exactly-once semantics?',diff:'pr',
simple:`Structured Streaming treats a live data stream as an unbounded table that keeps growing. You write a batch-style query (SELECT, JOIN, GROUP BY) on this "table," and Spark continuously executes it as new data arrives.

Exactly-once semantics: achieved by combining idempotent sinks + checkpoint-based offset tracking + transactional writes. The same data is never processed twice even on restart.`,
detailed:`**Programming model**:
- Input: streaming source (Kafka, Auto Loader, Delta CDF, socket)
- Process: same DataFrame transformations as batch (filter, join, agg, window)
- Output: streaming sink (Delta, Kafka, memory, console)
- Query: runs continuously — Spark checks for new data on each trigger

**Trigger modes**:
- Trigger.ProcessingTime("30 seconds"): Process new data every 30s (micro-batch)
- Trigger.Once(): Process all available data once, then stop (useful for scheduled streaming)
- Trigger.AvailableNow(): Like Once but processes multiple micro-batches (better throughput)
- Trigger.Continuous("1 second"): True sub-second continuous processing (experimental, limited operators)

**Exactly-once delivery guarantee**:
Three components working together:
1. **Offset tracking**: Checkpoint stores which offsets (Kafka offsets, file positions) have been processed — never process the same message twice
2. **Idempotent writes**: Delta Lake's transactional writes → retrying a failed micro-batch doesn't duplicate data (exactly-once writes)
3. **Transactional sources**: Kafka provides exactly-one read with committed offsets

**Output modes**:
- Append: Only new rows added to result. For stateless queries or event-time windowed aggregations. Most efficient.
- Complete: Entire updated result table written each trigger. For aggregations with stateful results. Expensive for large states.
- Update: Only changed rows written. For aggregations. More efficient than Complete.

**Fault tolerance**:
- Checkpoint: Stores offset + query state → restart resumes from last checkpoint
- WAL (Write-Ahead Log): Ensures source offsets recorded before processing begins
- Stateful stores: State (e.g., window aggregations) persisted to checkpoint

**Structured Streaming vs DLT**:
- Structured Streaming: Code-level streaming, maximum flexibility
- Delta Live Tables: Declarative streaming, built-in monitoring, auto-recovery, simpler`,
code:`# Structured Streaming: read from Kafka → process → write to Delta
from pyspark.sql import functions as F
from pyspark.sql.types import *

# Schema for Kafka message value
schema = StructType([
    StructField("flight_id", StringType()),
    StructField("carrier", StringType()),
    StructField("delay_min", IntegerType()),
    StructField("event_time", TimestampType())
])

# Read from Kafka
stream_df = (spark.readStream
    .format("kafka")
    .option("kafka.bootstrap.servers", "broker1:9092,broker2:9092")
    .option("subscribe", "flight-events")
    .option("startingOffsets", "latest")
    .option("maxOffsetsPerTrigger", 50000)  # Backpressure control
    .load()
    .select(F.from_json(F.col("value").cast("string"), schema).alias("data"))
    .select("data.*"))

# Process (stateless filter + transform)
processed = (stream_df
    .filter(F.col("delay_min") > 0)
    .withColumn("severity",
        F.when(F.col("delay_min") > 180, "MAJOR")
        .when(F.col("delay_min") > 45, "MODERATE")
        .otherwise("MINOR")))

# Write to Delta (exactly-once via transactional Delta writes)
query = (processed.writeStream
    .format("delta")
    .outputMode("append")
    .option("checkpointLocation", "abfss://datalake@storage.dfs.core.windows.net/checkpoints/flight-delays")
    .trigger(processingTime="30 seconds")
    .table("silver.flight_delays"))

query.awaitTermination()`,
tags:['Structured Streaming','Kafka','Exactly-Once','Checkpoint','Micro-batch','Trigger','Output Mode','Fault Tolerance','Watermark']},

{q:'What are watermarks in Structured Streaming? How do you handle late-arriving data?',diff:'pr',
simple:`A watermark tells Spark: "Don't wait forever for late data. After event_time X passes, I expect no more events from before X - threshold."

withWatermark("event_time", "10 minutes") means: Spark will wait up to 10 minutes past the max event time seen before finalizing a window's aggregation. Events arriving more than 10 minutes late are dropped.`,
detailed:`**Why watermarks are needed**:
- Event time ≠ Processing time: A flight event generated at 14:00 might arrive at Spark at 14:15 (network delay, retry, slow producer)
- Without watermark: Spark must keep state for ALL time windows forever (waiting for arbitrarily late data) → state grows unbounded → OOM
- With watermark: Spark knows after X time has passed, late data for closed windows is dropped → state bounded

**Watermark mechanics**:
- Spark tracks the maximum event_time seen so far across all partitions
- Current watermark = max_event_time_seen - watermark_delay
- Windows with end_time < current watermark → closed, results emitted, state cleaned up
- Events with event_time < current watermark → late, dropped (not processed)

**Watermark and output modes**:
- Append mode: Final result emitted ONLY after the watermark passes the window end (late data guarantee)
- Update mode: Results emitted every trigger, updated with late arrivals until watermark passes
- Complete mode: No watermark effect (all state kept forever)

**Choosing watermark threshold**:
- Too small (1 minute): Drops data that's only slightly late → data loss
- Too large (24 hours): State kept for 24 hours → memory pressure, high latency in results
- Match your actual late-arrival distribution: 95th percentile of observed lateness

**Handling different lateness requirements**:
- If you need ALL late events: Don't use event-time windows → use processing-time windows
- If you need MOST late events: Watermark + separate late-data path (CDF or separate stream)
- Reprocessing stale results: Delta Lake time travel + batch reprocessing of the watermarked window`,
code:`from pyspark.sql import functions as F

# Streaming with watermark + tumbling window aggregation
delay_stream = (spark.readStream
    .format("delta")
    .option("readChangeFeed", "true")
    .option("startingVersion", 0)
    .table("bronze.flight_events"))

windowed_agg = (delay_stream
    # Watermark: tolerate up to 10 minutes of lateness
    .withWatermark("event_time", "10 minutes")

    # 5-minute tumbling window aggregation
    .groupBy(
        F.window("event_time", "5 minutes"),  # Tumbling: non-overlapping 5-min windows
        "carrier_code"
    )
    .agg(
        F.avg("delay_minutes").alias("avg_delay"),
        F.count("*").alias("flight_count")
    ))

# Sliding window (overlapping): "5 minute window, every 1 minute"
sliding_agg = (delay_stream
    .withWatermark("event_time", "10 minutes")
    .groupBy(
        F.window("event_time", "5 minutes", "1 minute"),  # 5-min window, 1-min slide
        "carrier_code"
    )
    .agg(F.avg("delay_minutes")))

# Write with append mode (only emits after watermark passes window end)
(windowed_agg.writeStream
    .format("delta")
    .outputMode("append")
    .option("checkpointLocation", "/checkpoints/windowed-delays")
    .table("silver.windowed_carrier_delays"))`,
tags:['Watermark','Late Data','Event Time','Processing Time','Tumbling Window','Sliding Window','State Management','Stateful Streaming','Window Aggregation']},

{q:'What is stateful streaming in Spark? How does mapGroupsWithState and flatMapGroupsWithState work?',diff:'ar',
simple:`Stateful streaming maintains custom state across micro-batches for each key. Built-in stateful operations (groupBy + window aggregation) handle common cases. For custom state machines — like tracking a session, fraud pattern, or multi-step process across events — you use mapGroupsWithState or flatMapGroupsWithState.

These let you define: what state to keep per key, how to update it on new events, and when/how to emit output.`,
detailed:`**Built-in stateful operations**:
- Window aggregations (COUNT, SUM, AVG over event-time windows) — simple state
- dropDuplicates with watermark — deduplication state
- Stream-stream joins — join buffer state

**mapGroupsWithState** (one output row per key per trigger):
- Groups events by key
- For each key: calls your function with (key, new_events, current_state) → returns (output, new_state)
- Use for: Session tracking, running totals, per-entity state machines

**flatMapGroupsWithState** (zero or more output rows per key per trigger):
- Like mapGroupsWithState but can emit 0, 1, or multiple rows per key per trigger
- Use for: Alert generation (emit only when state crosses threshold), session completion events

**State timeout management**:
Critical for preventing unbounded state growth:
- GroupStateTimeout.ProcessingTimeTimeout: After no events for N processing-time seconds → timeout → clean up state
- GroupStateTimeout.EventTimeTimeout: After no events with event_time > watermark + N → timeout

**State store** (where state is kept):
- Default: RocksDB (on-disk key-value store per executor) — handles large state (millions of keys) without JVM OOM
- HDFS/S3 checkpoint: State committed to checkpoint directory for fault tolerance
- Databricks: RocksDB state store enabled by default (spark.sql.streaming.stateStore.providerClass = RocksDB)`,
code:`from pyspark.sql.streaming.state import GroupState, GroupStateTimeout
from typing import Iterator, Tuple

# State schema
class FlightSessionState:
    def __init__(self):
        self.start_time = None
        self.events = []
        self.total_delay = 0

# mapGroupsWithState: track per-flight session
def update_session(
    flight_id: str,
    events: Iterator[Row],
    state: GroupState
) -> Tuple[str, float, int]:
    """Maintain running session for each flight."""
    # Load current state
    if state.exists:
        session = state.get
    else:
        session = {"start_time": None, "total_delay": 0, "event_count": 0}

    # Process new events
    for event in events:
        if session["start_time"] is None:
            session["start_time"] = event.event_time
        session["total_delay"] += event.delay_minutes
        session["event_count"] += 1

    # Check timeout
    if state.hasTimedOut:
        state.remove()
        return (flight_id, session["total_delay"], session["event_count"])

    # Set new state and timeout (5 min of inactivity = session end)
    state.update(session)
    state.setTimeoutDuration("5 minutes")

    return (flight_id, session["total_delay"], session["event_count"])

# Apply stateful transformation
from pyspark.sql.streaming.state import applyInPandasWithState
# (Simplified - actual API uses applyInPandasWithState in PySpark 3.4+)
result = (stream_df
    .groupBy("flight_id")
    .applyInPandasWithState(
        update_session,
        outputStructType=StructType([...]),
        stateStructType=StructType([...]),
        outputMode="append",
        timeoutConf=GroupStateTimeout.ProcessingTimeTimeout
    ))`,
tags:['Stateful Streaming','mapGroupsWithState','flatMapGroupsWithState','Session Tracking','State Store','RocksDB','Timeout','Fault Tolerance']},

{q:'What is a stream-stream join in Structured Streaming? How do you handle the buffering challenge?',diff:'ar',
simple:`A stream-stream join joins two live data streams. Unlike stream-static joins (one live, one Delta table), both sides are continuously arriving. The challenge: a row from stream A might need to wait for its matching row from stream B — which may arrive much later.

Spark buffers unmatched rows in state (RocksDB). Watermarks on both streams are required to bound how long Spark waits for late matches — preventing unbounded state growth.`,
detailed:`**Types of streaming joins**:

**Stream-Static join** (simpler):
- One stream + one Delta table (the static side)
- Static side read fresh each micro-batch (picks up updates)
- No state buffering needed on static side
- Use for: Enriching events with slowly-changing dimension data (carrier lookup, airport codes)

**Stream-Stream join** (harder):
- Both sides are streaming
- Spark buffers rows from both streams waiting for matches
- Must watermark BOTH streams to bound buffer size

**Stream-stream join with watermarks**:
\`\`\`
flights.withWatermark("flight_time", "1 hour")
    .join(
        delays.withWatermark("event_time", "1 hour"),
        expr("""
            flight_id = event_flight_id AND
            event_time BETWEEN flight_time - INTERVAL 30 MINUTES
                           AND flight_time + INTERVAL 30 MINUTES
        """),
        "leftOuter"
    )
\`\`\`

**State buffer rules**:
- Spark keeps unmatched rows for (max watermark delay + time range in join condition)
- Once watermark passes this threshold for a row → it's evicted (either matched or dropped)
- Larger time ranges = more state = more memory needed on executors

**RocksDB state store** (required for stream-stream joins at scale):
- Default Java HashMap state store: limited to executor heap → OOM for large buffers
- RocksDB: on-disk key-value store → handles state larger than executor memory
- Enable: spark.sql.streaming.stateStore.providerClass = RocksDB
- Databricks: RocksDB enabled by default

**Output modes for stream-stream joins**:
- Inner join: Append mode (emit when match found)
- Left outer join: Update mode (emit left row immediately with NULL right; update when right arrives)
- Full outer join: Not supported with watermarks in Spark

**Production tip**: Prefer stream-static joins when possible — much simpler, no state management. Stream-stream join only when you genuinely need to join two live streams (fraud detection across two event streams, real-time correlation).`,
code:`from pyspark.sql import functions as F

# Stream-static join (simpler, preferred when possible)
flights_stream = spark.readStream.format("delta").table("bronze.live_flights")
carriers_static = spark.table("dim.carriers")  # Delta table, read each micro-batch

enriched = flights_stream.join(
    broadcast(carriers_static),  # Broadcast the small static dimension
    "carrier_code"
)

# Stream-stream join (both sides streaming)
flights_stream = (spark.readStream
    .format("kafka")
    .option("subscribe", "flight-events")
    .load()
    .withWatermark("flight_time", "2 hours"))   # Required: bound state

weather_stream = (spark.readStream
    .format("kafka")
    .option("subscribe", "weather-events")
    .load()
    .withWatermark("weather_time", "2 hours"))  # Required: both sides

# Join with time-range condition (essential for bounded state)
joined = flights_stream.join(
    weather_stream,
    expr("""
        flight_airport = weather_station AND
        weather_time BETWEEN flight_time - INTERVAL 1 HOUR
                         AND flight_time + INTERVAL 1 HOUR
    """),
    "leftOuter"
)

# Write with RocksDB state store
(joined.writeStream
    .format("delta")
    .outputMode("append")
    .option("checkpointLocation", "/checkpoints/flight-weather-join")
    .option("spark.sql.streaming.stateStore.providerClass",
            "com.databricks.sql.streaming.state.RocksDBStateStoreProvider")
    .table("silver.flight_weather_correlation"))`,
tags:['Stream-Stream Join','Stream-Static Join','Watermark','State Buffer','RocksDB','Structured Streaming','Stateful','Time Range Join','Outer Join']},

{q:'How does Structured Streaming checkpointing work? What breaks if you delete or change a checkpoint?',diff:'pr',
simple:`Checkpointing saves the streaming query's progress — source offsets processed, state store snapshots, schema — to durable storage (S3/ADLS). On restart, the query reads the checkpoint to resume exactly where it left off, ensuring exactly-once processing.

Deleting the checkpoint = full restart from scratch (reprocesses all data from startingOffsets). Changing certain query parameters (output schema, aggregation) with an existing checkpoint = exception at startup because the new query is incompatible with the saved state.`,
detailed:`**What the checkpoint stores**:
1. **Offset log**: which Kafka offsets / file positions have been committed (ensures no reprocessing)
2. **Commit log**: which batches have successfully written output (exactly-once guarantee)
3. **State store**: for stateful operations (aggregations, window functions, mapGroupsWithState) — the actual state data per key
4. **Schema**: the query's schema at creation time

**Checkpoint directory structure**:
\`\`\`
/checkpoint/my-query/
  offsets/          ← source offsets per batch
  commits/          ← which batches committed
  state/            ← stateful operator state (RocksDB files)
  metadata          ← query metadata (schema, configurations)
\`\`\`

**What happens on restart with valid checkpoint**:
1. Read latest committed offset from offsets/
2. Resume reading source from that offset + 1
3. Load state store from latest state checkpoint
4. Continue processing — no data reprocessed, no data skipped

**Breaking changes to a running query (incompatible with existing checkpoint)**:
- Adding/removing stateful aggregations
- Changing output schema (adding/removing columns)
- Changing the checkpoint location path
- Changing groupBy keys

**Safe changes** (checkpoint-compatible):
- Changing trigger interval (e.g., 30s → 1min)
- Updating filter conditions (stateless only)
- Adding new non-aggregation columns

**When to delete checkpoint (intentional)**:
- Full reprocessing needed (schema change, bug fix affecting all historical data)
- Starting fresh with new startingOffsets (e.g., "latest" after catching up)
- Checkpoint is corrupted (very rare with S3/ADLS durability)

**Checkpoint storage best practices**:
- Use durable cloud storage (S3/ADLS/GCS) — NOT DBFS local or ephemeral storage
- Separate checkpoint path per query (never share between two queries)
- Monitor checkpoint lag: if checkpoint writes take longer than trigger interval → backpressure
- Set WAL buffer: spark.sql.streaming.checkpointFileManagerClass for custom implementations`,
code:`# Correct checkpoint setup
query = (processed_stream
    .writeStream
    .format("delta")
    .outputMode("append")
    .option("checkpointLocation",
            "abfss://datalake@acct.dfs.core.windows.net/checkpoints/appr-silver")
    .trigger(processingTime="30 seconds")
    .table("silver.appr_events"))

# Monitor checkpoint health
print(f"Query status: {query.status}")
print(f"Last progress: {query.lastProgress}")
# key fields in lastProgress:
# 'numInputRows': rows processed in last batch
# 'inputRowsPerSecond': throughput
# 'durationMs': {'addBatch': X, 'getOffset': Y}  ← checkpoint write time

# Handle incompatible checkpoint after schema change:
# Option 1: delete checkpoint + restart from startingOffsets
# Option 2: use migration if only adding columns (mergeSchema)
(spark.readStream
    .format("delta")
    .option("readChangeFeed", "true")
    .option("startingVersion", 0)
    .table("bronze.events")
    .writeStream
    .format("delta")
    .option("checkpointLocation", "/new/checkpoint/path")  # Fresh checkpoint
    .option("mergeSchema", "true")                          # Handle schema change
    .table("silver.events"))

# Checkpoint on DBFS is NOT production-ready (ephemeral on cluster restart):
# BAD:
# .option("checkpointLocation", "dbfs:/checkpoints/my-query")

# GOOD: always use external durable storage
# .option("checkpointLocation", "abfss://container@account.dfs.core.windows.net/checkpoints/")`,
tags:['Checkpointing','Exactly-Once','Offset Log','State Store','RocksDB','Checkpoint Compatibility','Schema Change','Restart','Kafka Offsets','Durable Storage']},

{q:'How do you read from and write to Kafka in Spark Structured Streaming? What are the key configuration options?',diff:'sr',
simple:`Kafka is the most common Structured Streaming source. Spark reads Kafka messages as a DataFrame with columns: key, value, topic, partition, offset, timestamp. You deserialize the value (usually JSON/Avro) and process it. Writing back to Kafka uses writeStream with format("kafka") and a value column.`,
detailed:`**Reading from Kafka — key options**:

**Connection**:
- kafka.bootstrap.servers: broker list (required)
- subscribe: topic name(s) — comma-separated or regex
- assign: specific topic-partition assignments (advanced, for manual offset management)

**Offset management**:
- startingOffsets: "earliest" (reprocess all), "latest" (only new), or JSON of specific offsets
- endingOffsets: for batch reads — where to stop
- maxOffsetsPerTrigger: backpressure control — limit rows per micro-batch

**Schema (Kafka message fields)**:
- key: BINARY (often null or string key)
- value: BINARY (your actual data — deserialize with from_json or from_avro)
- topic: STRING
- partition: INT
- offset: LONG
- timestamp: TIMESTAMP
- timestampType: INT

**Deserialization**:
- JSON: F.from_json(F.col("value").cast("string"), schema)
- Avro: from_avro() with Confluent Schema Registry integration
- Protobuf: via external UDF or Databricks connector

**Security (Kafka SASL/SSL)**:
- kafka.security.protocol = SASL_SSL
- kafka.sasl.mechanism = PLAIN or SCRAM-SHA-512
- kafka.sasl.jaas.config = credentials (use dbutils.secrets!)

**Writing to Kafka**:
- Must produce a "value" column (BINARY or STRING)
- Optional: "key", "topic", "partition" columns
- topic in write: either in data column or as fixed option`,
code:`from pyspark.sql import functions as F
from pyspark.sql.types import *

# Define expected message schema
flight_schema = StructType([
    StructField("flight_id", StringType()),
    StructField("carrier_code", StringType()),
    StructField("delay_minutes", IntegerType()),
    StructField("event_timestamp", TimestampType()),
    StructField("origin_airport", StringType()),
    StructField("status", StringType())
])

# Read from Kafka (streaming)
kafka_stream = (spark.readStream
    .format("kafka")
    .option("kafka.bootstrap.servers",
            dbutils.secrets.get("kafka-scope", "brokers"))  # From secrets!
    .option("subscribe", "flight-events,delay-events")      # Multiple topics
    .option("startingOffsets", "latest")
    .option("maxOffsetsPerTrigger", 50_000)     # Backpressure: max rows/batch
    .option("kafka.security.protocol", "SASL_SSL")
    .option("kafka.sasl.mechanism", "PLAIN")
    .option("kafka.sasl.jaas.config",
            f"org.apache.kafka.common.security.plain.PlainLoginModule required "
            f"username='user' password='{dbutils.secrets.get(\"kafka-scope\",\"password\")}';")
    .load())

# Deserialize JSON value
parsed = (kafka_stream
    .select(
        F.col("topic"),
        F.col("partition"),
        F.col("offset"),
        F.col("timestamp").alias("kafka_ts"),
        F.from_json(F.col("value").cast("string"), flight_schema).alias("data")
    )
    .select("topic", "kafka_ts", "data.*"))

# Process and write to Delta (Silver)
silver_query = (parsed
    .filter(F.col("status").isin(["DELAYED", "CANCELLED"]))
    .writeStream
    .format("delta")
    .outputMode("append")
    .option("checkpointLocation",
            "abfss://datalake@acct.dfs.core.windows.net/checkpoints/kafka-silver")
    .trigger(processingTime="30 seconds")
    .table("silver.flight_events"))

# Write back to Kafka (e.g., downstream notifications)
notification_stream = (parsed
    .filter(F.col("delay_minutes") > 180)
    .select(
        F.col("flight_id").alias("key"),    # Message key
        F.to_json(F.struct("flight_id","delay_minutes","carrier_code"))
            .alias("value")                  # Message value (JSON string)
    )
    .writeStream
    .format("kafka")
    .option("kafka.bootstrap.servers",
            dbutils.secrets.get("kafka-scope","brokers"))
    .option("topic", "major-delay-alerts")
    .option("checkpointLocation", "/checkpoints/kafka-output")
    .start())`,
tags:['Kafka','Structured Streaming','from_json','SASL','startingOffsets','maxOffsetsPerTrigger','Schema Deserialization','Kafka Write','Backpressure','Secrets']},
]},


{id:'catalyst',icon:'🧠',label:'Spark SQL & Catalyst',desc:'Catalyst optimizer, query planning, predicate pushdown, join strategies',qs:[
{q:'Walk through the Catalyst optimizer\'s four phases. What happens to a query plan at each stage?',diff:'pr',
simple:`When you write a Spark SQL query, Catalyst transforms it through four phases before execution:

1. Parse → Abstract Syntax Tree (unresolved logical plan)
2. Analyze → Resolve column names/types against catalog (resolved logical plan)
3. Optimize → Apply logical optimizations (predicate pushdown, column pruning, constant folding)
4. Plan → Convert to physical plan, choose join strategies, generate code

You can inspect each phase with df.explain(extended=True).`,
detailed:`**Phase 1 — Parsing**:
- Input: SQL string or DataFrame transformation chain
- Output: Unresolved Logical Plan (AST)
- Column names and table names not yet validated against catalog
- Example: SELECT a.col FROM table_x WHERE x > 5 → parsed but "col" and "table_x" not yet validated

**Phase 2 — Analysis**:
- Resolves column names against catalog (Hive Metastore / Unity Catalog)
- Validates data types, resolves star expansions (SELECT *)
- Infers types for expressions
- Output: Resolved Logical Plan
- Fails here if column doesn't exist → AnalysisException

**Phase 3 — Logical Optimization** (the most important phase):
Catalyst applies rule-based transformations (batches of rules, iterated until convergence):

Key optimizations:
- **Predicate Pushdown**: Move WHERE filters as close to data source as possible → reduce data read early
- **Column Pruning**: Remove columns not needed in final output → Parquet reads only needed columns
- **Constant Folding**: Evaluate constants at compile time (WHERE 2+3 > 4 → WHERE 5 > 4 → true → remove filter)
- **Boolean Simplification**: (a AND true) → a
- **Join Reordering**: Reorder joins to reduce intermediate sizes (AQE does this at runtime too)
- **Subquery Decoration**: Unnest correlated subqueries when possible

**Phase 4 — Physical Planning**:
- Converts logical operators to physical operators
- Chooses JOIN implementation: BroadcastHashJoin, SortMergeJoin, ShuffleHashJoin
- Chooses aggregation strategy: HashAggregate, SortAggregate
- AQE applies runtime re-optimization at this phase
- Code generation (Whole-Stage CodeGen or Photon vectorized)

**df.explain() flags**:
- explain() → physical plan only
- explain(True) or explain("extended") → all 4 plans
- explain("codegen") → generated Java bytecode
- explain("cost") → estimated cost statistics`,
code:`from pyspark.sql import functions as F

# Query to analyze
df = (spark.table("silver.flights")
    .filter(F.col("delay_min") > 30)              # Predicate
    .filter(F.col("carrier") == "AC")             # Second predicate
    .select("flight_id","delay_min","carrier")    # Column pruning
    .join(spark.table("dim.airports"), "origin")  # Join
    .groupBy("carrier").agg(F.avg("delay_min")))

# View all four Catalyst phases
df.explain("extended")
# Output:
# == Parsed Logical Plan ==       (unresolved)
# == Analyzed Logical Plan ==     (columns/types resolved)
# == Optimized Logical Plan ==    (predicates pushed down, columns pruned)
# == Physical Plan ==             (join strategy chosen, AQE applied)

# Physical plan output to understand:
# BroadcastHashJoin               ← small table broadcast (fast)
# SortMergeJoin                   ← large table join (shuffle)
# HashAggregate                   ← hash-based groupBy
# Exchange hashpartitioning        ← shuffle boundary
# Project [flight_id, delay_min]  ← column pruning applied
# Filter (delay_min > 30)         ← predicate pushed to scan

# Check optimizer rules applied
spark.sql("SET spark.sql.optimizer.excludedRules=''")  # Don't exclude any rules (default)
spark.sql("EXPLAIN EXTENDED SELECT ...")               # Also works for SQL`,
tags:['Catalyst Optimizer','Predicate Pushdown','Column Pruning','Query Plan','Physical Plan','Logical Plan','Parsing','Analysis','Optimization','explain()']},

{q:'What are the Spark join strategies? How does the optimizer choose between BroadcastHashJoin, SortMergeJoin, and ShuffleHashJoin?',diff:'pr',
simple:`Three main join strategies:
• BroadcastHashJoin (BHJ): Small table broadcast to all executors — no shuffle. Fastest. Requires one side < broadcast threshold (default 10MB).
• SortMergeJoin (SMJ): Both sides shuffled + sorted by join key, then merged. Works for any size. Default for large tables.
• ShuffleHashJoin (SHJ): Shuffle both sides, build hash table from smaller. No sorting needed. Used when one side fits in hash table but not broadcast threshold.`,
detailed:`**BroadcastHashJoin (BHJ)**:
- Condition: one side ≤ spark.sql.autoBroadcastJoinThreshold (default 10MB)
- Mechanism: broadcast entire small table to every executor → each executor hashes it locally → probe with large table rows (no shuffle of large side)
- No network transfer of large table rows for join purpose
- Fastest join possible when one side is small
- Force: broadcast(df) hint
- Disable: spark.sql.autoBroadcastJoinThreshold = -1
- Photon: BHJ is Photon-native, very fast

**SortMergeJoin (SMJ)**:
- Default for large-large joins
- Mechanism: shuffle both sides by join key → sort each partition → merge-walk sorted partitions
- Both sides partitioned identically → matching keys on same executor → no further shuffle
- Sort adds overhead vs hash-based but is memory-stable (no hash table OOM risk)
- Required for: full outer joins, non-equi joins on ranges
- Photon: SMJ is Photon-native

**ShuffleHashJoin (SHJ)**:
- One side shuffled + built into in-memory hash table; other side probes
- No sorting needed (faster than SMJ when data fits in hash table)
- Risk: if hash table side underestimated → OOM
- Chosen when: join key not sortable, or one side significantly smaller but still > broadcast threshold
- Less common than BHJ and SMJ

**Optimizer selection logic**:
1. If either side ≤ broadcast threshold → BHJ (one side)
2. If both sides large AND sort-based join preferred → SMJ
3. If one side small enough for hash table but not broadcast → SHJ
4. AQE overrides: at runtime, if one side turns out small → convert SMJ → BHJ dynamically

**Join hints** (override optimizer):
\`\`\`sql
SELECT /*+ BROADCAST(small_table) */ * FROM large_table JOIN small_table ON ...
SELECT /*+ SHUFFLE_MERGE(t1) */ * FROM t1 JOIN t2 ON ...
SELECT /*+ SHUFFLE_HASH(t1) */ * FROM t1 JOIN t2 ON ...
\`\`\`

**Anti-join and semi-join**:
- NOT EXISTS, NOT IN → physical plan: BroadcastHashJoin in anti mode
- EXISTS → physical plan: BroadcastHashJoin in semi mode
- More efficient than regular join because rows deduped early`,
code:`from pyspark.sql import functions as F
from pyspark.sql.functions import broadcast

# BHJ: force broadcast on known-small table
result = large_flights.join(
    broadcast(small_airports),   # Hint: broadcast this table
    "airport_code"
)
result.explain()
# Shows: BroadcastHashJoin [airport_code], [airport_code], Inner, BuildRight

# SMJ: default for large-large joins
result = flights.join(passengers, "booking_id")
result.explain()
# Shows: SortMergeJoin [booking_id], [booking_id], Inner

# Force SMJ even for small tables (e.g., when broadcast causes driver OOM)
from pyspark.sql.functions import expr
result = flights.hint("SHUFFLE_MERGE").join(passengers, "booking_id")

# AQE dynamic broadcast conversion (runtime - no code change needed)
spark.conf.set("spark.sql.adaptive.enabled", "true")
# AQE checks actual size at runtime → converts SMJ to BHJ if one side small

# Tune broadcast threshold (raise to 50MB for large dimension tables)
spark.conf.set("spark.sql.autoBroadcastJoinThreshold", str(50 * 1024 * 1024))

# Disable broadcast for memory-constrained driver
spark.conf.set("spark.sql.autoBroadcastJoinThreshold", "-1")`,
tags:['Join Strategies','BroadcastHashJoin','SortMergeJoin','ShuffleHashJoin','Join Hints','broadcast()','AQE','Join Optimization','Photon','Anti-join']},

{q:'What is Dynamic Partition Pruning (DPP)? How does it accelerate star schema queries?',diff:'pr',
simple:`Dynamic Partition Pruning (DPP) pushes a filter from a dimension table scan at runtime into the fact table partition scan — drastically reducing data read from the fact table.

Classic star schema query: WHERE dim_date.year = 2024. Without DPP: Spark reads all fact table partitions then filters. With DPP: Spark first scans dim_date, gets matching partition values, then reads ONLY 2024 partitions from the fact table.`,
detailed:`**Why DPP matters**:
Fact tables are huge (billions of rows) but partitioned by date/region. Dimension tables are small. A filter on dim_date.year flows through a join to prune fact table partitions — if Spark can push this filter down.

**How DPP works**:
1. Query: SELECT * FROM fact_flights JOIN dim_date ON fact.date_key = dim.date_key WHERE dim.year = 2024
2. Spark scans dim_date WHERE year = 2024 → gets set of matching date_key values: {20240101, 20240102, ...}
3. Injects this set as a runtime filter on fact_flights: WHERE fact.date_key IN (20240101, 20240102, ...)
4. Delta/Parquet partition pruning: only partitions with those date_key values read
5. Result: fact table scan reduced from full scan → only 2024 partitions

**Requirements for DPP**:
- Fact table must be PARTITIONED BY the join key column
- Dimension table filter must be pushed through the join (not an outer join on the dimension side)
- Join type: inner join or left-semi join (not left outer)
- spark.sql.optimizer.dynamicPartitionPruning.enabled = true (on by default)

**DPP in Databricks**:
- Works automatically with Delta Lake + Unity Catalog
- Enhanced in Databricks Runtime with additional rules
- Visible in EXPLAIN: look for "DynamicPruningExpression" in physical plan

**Without DPP (before Spark 3.0)**:
- Full fact table scan → 500GB scanned
- Post-scan filter removes 95% of rows → wasted I/O

**With DPP (Spark 3.0+)**:
- dim_date scan: tiny (365 rows matching year=2024)
- Fact table: only 2024 partitions read → 40GB instead of 500GB
- 12.5× less data scanned`,
code:`# Star schema: DPP accelerates this query automatically
dim_date = spark.table("dim.date")           # Small: 3,650 rows
fact_flights = spark.table("fact.flights")   # Large: 5B rows, partitioned by date_key

# DPP kicks in automatically for this pattern:
result = (fact_flights
    .join(dim_date, "date_key")               # Join on partition key
    .filter(dim_date["year"] == 2024)         # Filter on dimension
    .groupBy("carrier_code")
    .agg(F.sum("revenue")))

result.explain()
# Physical plan shows:
# Project ...
# +- HashAggregate ...
#    +- Exchange hashpartitioning(carrier_code)
#       +- HashAggregate ...
#          +- BroadcastHashJoin [date_key], [date_key]
#             :- Scan delta[fact.flights]  ← WITH DynamicPruningExpression(date_key IN ...)
#             +- BroadcastExchange (dim_date WHERE year = 2024)

# Verify DPP is enabled
print(spark.conf.get("spark.sql.optimizer.dynamicPartitionPruning.enabled"))  # "true"

# Force DPP reuse optimization (reuse broadcast for DPP + join)
spark.conf.set("spark.sql.optimizer.dynamicPartitionPruning.reuseBroadcastOnly", "true")

# Delta Lake data skipping complements DPP:
# DPP: prunes partitions → reduces files scanned to 2024 partitions only
# Delta skipping: within those partitions, skips files where min(date_key) > max query range`,
tags:['Dynamic Partition Pruning','DPP','Star Schema','Partition Pruning','Fact Table','Dimension Table','Spark 3.0','Physical Plan','Delta Lake','Data Skipping']},

{q:'Explain broadcast variables and accumulators. When do you use each?',diff:'sr',
simple:`Broadcast variables: efficiently share a read-only dataset to every executor (sent once, cached locally). Avoids sending the same data with every task.

Accumulators: distributed counters/aggregators that tasks write to, driver reads from. Used for metrics, counting bad records, debugging.

Key rule: broadcast = read-only shared data; accumulators = write-only from tasks, read by driver.`,
detailed:`**Broadcast Variables**:
- Purpose: share a large read-only lookup object with all executors without resending per task
- Without broadcast: each task that needs a lookup dict fetches it from driver → network overhead × number of tasks
- With broadcast: one transfer per executor (not per task) → cached in executor memory
- Size limit: fits in executor memory (several GB practical max)
- Immutable: cannot be modified after broadcast
- Cleanup: bc.destroy() when done (frees executor memory)

**Use cases for broadcast variables**:
- Configuration dictionaries sent to UDFs
- ML model artifacts shared across tasks for batch inference
- Large lookup tables that can't use BroadcastHashJoin (non-tabular data)
- Feature encoders, tokenizers, RegEx patterns

**Accumulators**:
- Purpose: aggregate metrics from across many tasks back to driver
- Tasks can add to accumulator (+=) but not read from it
- Driver reads final value after action completes
- Fault tolerance: if task retried, accumulator value may be double-counted (not idempotent by default)
- Built-in: LongAccumulator, DoubleAccumulator, CollectionAccumulator
- Custom: extend AccumulatorV2

**Use cases for accumulators**:
- Count malformed/rejected records in ETL
- Track data quality issues (rows with null IDs, out-of-range values)
- Debugging: count records hitting specific code paths
- Progress monitoring on long-running jobs

**Accumulator double-count caveat**:
If a task is retried (due to speculation or node failure), the accumulator is incremented again. For exact counts: only use for approximate monitoring, not business-critical metrics. Use write-through to Delta instead for exact counts.`,
code:`# Broadcast variable: share carrier lookup with all tasks
carrier_lookup = spark.sparkContext.broadcast({
    "AC": "Air Canada",
    "WS": "WestJet",
    "WR": "WestJet Encore",
    "TS": "Air Transat"
})

# Use in UDF (broadcast available to all executors, not re-sent per task)
from pyspark.sql.functions import udf
@udf(returnType=StringType())
def resolve_carrier(code):
    return carrier_lookup.value.get(code, "Unknown")

df = flights_df.withColumn("carrier_name", resolve_carrier("carrier_code"))

# Alternative: DataFrame broadcast join (preferred over UDF broadcast)
carrier_df = spark.createDataFrame(list(carrier_lookup.value.items()),
                                    ["carrier_code", "carrier_name"])
result = flights_df.join(broadcast(carrier_df), "carrier_code")

# Free broadcast variable memory when done
carrier_lookup.destroy()

# Accumulator: count rejected records in ETL
bad_records = spark.sparkContext.LongAccumulator("bad_records")
null_delays  = spark.sparkContext.LongAccumulator("null_delays")

def validate_flight(row):
    if row["flight_id"] is None:
        bad_records.add(1)
        return False
    if row["delay_min"] is None:
        null_delays.add(1)
    return True

valid_rdd = flights_df.rdd.filter(validate_flight)
valid_df = spark.createDataFrame(valid_rdd, flights_df.schema)
valid_df.write.format("delta").saveAsTable("silver.flights")

# Read accumulator values on driver (after action completes)
print(f"Bad records rejected: {bad_records.value}")
print(f"Records with null delay: {null_delays.value}")`,

{q:'What is Whole-Stage Code Generation (WSCG)? How does Tungsten improve Spark performance?',diff:'pr',
simple:`Project Tungsten was Databricks/Apache Spark's major internal performance overhaul (Spark 1.5+). It addresses two bottlenecks: CPU efficiency and memory efficiency. Key improvements: off-heap binary memory format (no Java object overhead/GC), and Whole-Stage Code Generation (generating JVM bytecode at runtime instead of interpreted row-at-a-time processing).`,
detailed:`**The two Tungsten innovations**:

**1. Binary/Off-Heap Memory Format**:
- Spark stores data in compact binary rows instead of Java objects
- Java object overhead: every object has 16-byte header + 8-byte pointer → a 4-byte integer takes 28 bytes as a Java object
- Tungsten binary row: 4-byte integer takes exactly 4 bytes
- CPU cache-friendly: binary data packed tightly → more rows fit in L1/L2 cache
- No GC pressure: data in off-heap binary format is not managed by JVM garbage collector
- Comparison: can compare 8 bytes at once with a single CPU instruction (vs Java string comparison byte-by-byte)

**2. Whole-Stage Code Generation (WSCG)**:
- Traditional Spark (pre-Tungsten): Volcano iterator model — each operator processes one row at a time, calls next() from the operator above it → many virtual function calls
- WSCG: Combines multiple operators (filter + project + hash aggregate) into one compiled Java function
- Generated code: tight inner loop with no virtual dispatch → JIT-compiled by JVM → native CPU performance
- Visible in EXPLAIN: look for "*" prefix (asterisk) on operator → means WSCG enabled for that operator

**Photon vs WSCG**:
- WSCG: JVM-based, still subject to GC pauses
- Photon: C++ native, vectorized batch processing (1000s of rows at once), no JVM/GC
- Photon is the next generation beyond WSCG — processes columnar batches instead of row-by-row

**Kryo serialization** (complementary Tungsten optimization):
- Java default serialization: slow, verbose
- Kryo: 10× faster, 2-5× smaller serialized size
- Used for: shuffle data, RDD persistence, broadcast variables
- Configure: spark.serializer = org.apache.spark.serializer.KryoSerializer
- Register classes: spark.kryo.registrationRequired = true (forces explicit registration)`,
code:`# Verify WSCG and Tungsten in query plan
df = (spark.table("silver.flights")
    .filter(F.col("delay_min") > 30)
    .groupBy("carrier_code")
    .agg(F.sum("delay_min"), F.count("*")))

df.explain()
# Output with WSCG:
# *(3) HashAggregate(keys=[carrier_code], functions=[sum(delay_min), count(1)])
# +- Exchange hashpartitioning(carrier_code, 200)
#    +- *(2) HashAggregate(keys=[carrier_code], functions=[partial_sum(delay_min), partial_count(1)])
#       +- *(1) Filter (delay_min > 30)
#          +- *(1) ColumnarToRow
#             +- FileScan parquet [carrier_code, delay_min]
# ↑ Asterisk (*) means WSCG enabled — operators fused into compiled function

# Kryo serialization (for RDD-heavy workloads)
from pyspark import SparkConf
conf = SparkConf()
conf.set("spark.serializer", "org.apache.spark.serializer.KryoSerializer")
conf.set("spark.kryo.registrationRequired", "false")  # Recommended for Databricks

# Databricks: Photon replaces WSCG for SQL operators
# Check if Photon is active (SQL Warehouse or Photon-enabled cluster)
spark.sql("EXPLAIN SELECT COUNT(*) FROM silver.flights WHERE delay_min > 30")
# Look for PhotonGroupingAgg vs HashAggregate → Photon operator used`,

{q:'Explain Spark SQL window functions. How do they differ from SQL GROUP BY and how are they implemented?',diff:'sr',
simple:`Window functions compute values across a "window" of related rows without collapsing the result like GROUP BY does. Every input row produces one output row — the window function value for that row's window context.

Implementation: Spark sorts data by the PARTITION BY + ORDER BY columns, then applies the function across the frame. This requires a shuffle (to colocate partitions) + sort — similar cost to a GROUP BY.`,
detailed:`**Window function anatomy in Spark**:
\`\`\`python
func().over(Window.partitionBy("col1").orderBy("col2").rowsBetween(start, end))
\`\`\`

**Window spec components**:
- partitionBy: Logical partition (PARTITION BY). Data shuffled so same partition key on same executor.
- orderBy: Row ordering within partition (ORDER BY). Sort applied per partition.
- rowsBetween / rangeBetween: Frame specification — which rows are included in the window for each row.

**Frame specifications**:
- Window.unboundedPreceding: from the start of partition
- Window.currentRow: current row
- Window.unboundedFollowing: to the end of partition
- -N: N rows before current
- +N: N rows after current

**Four categories of window functions**:

1. **Ranking**: row_number, rank, dense_rank, ntile, percent_rank
2. **Navigation**: lag, lead, first_value, last_value, nth_value
3. **Aggregation**: sum, avg, count, min, max with OVER clause (running totals, moving averages)
4. **Cume_dist**: cumulative distribution

**Implementation cost**:
- Window with PARTITION BY → shuffle (all rows for same partition on same executor)
- Window with ORDER BY → sort per partition
- Multiple window functions with same partition/order → one shuffle + sort (optimizer shares)
- Unbounded window (no ORDER BY) → no sort needed

**Performance tips**:
- Multiple window functions over the same window spec → put in one SELECT (shared sort)
- Unbounded windows (running totals without ORDER BY) → no sort overhead
- Avoid very large partitions with complex windows → memory pressure on executor holding that partition`,
code:`from pyspark.sql import functions as F, Window

# Window spec definitions (reusable)
carrier_window = Window.partitionBy("carrier_code")
carrier_time_window = Window.partitionBy("carrier_code").orderBy("flight_date")

# Running total of delay within carrier, ordered by date
running_total_spec = carrier_time_window \
    .rowsBetween(Window.unboundedPreceding, Window.currentRow)

# 7-day moving average per carrier
rolling_7d_spec = carrier_time_window \
    .rowsBetween(-6, Window.currentRow)    # -6 = 6 rows before current

result = (spark.table("silver.flights")
    .withColumn("rn",           F.row_number().over(carrier_time_window))
    .withColumn("rank",         F.rank().over(carrier_window.orderBy(F.desc("delay_min"))))
    .withColumn("dense_rank",   F.dense_rank().over(carrier_window.orderBy(F.desc("delay_min"))))
    .withColumn("prev_delay",   F.lag("delay_min", 1).over(carrier_time_window))
    .withColumn("next_delay",   F.lead("delay_min", 1).over(carrier_time_window))
    .withColumn("running_total",F.sum("delay_min").over(running_total_spec))
    .withColumn("ma7_delay",    F.avg("delay_min").over(rolling_7d_spec))
    .withColumn("pct_of_total", F.col("delay_min") /
                F.sum("delay_min").over(carrier_window)))

# Best practice: all same-window functions in one select (single sort pass)
# BAD: multiple .withColumn() calls with same window → separate sort for each
# GOOD: define all in one pass with selectExpr or combined withColumn calls

# Check plan: look for "WindowExec" node (one per unique window spec)
result.explain()`,
tags:['Window Functions','PARTITION BY','Frame Specification','rowsBetween','rangeBetween','Running Total','Moving Average','LAG','LEAD','WindowExec','Shuffle']},

{q:'What are Pandas UDFs (Vectorized UDFs)? How do they differ from scalar Python UDFs and when should you use each?',diff:'pr',
simple:`Pandas UDFs (vectorized UDFs) operate on batches of rows using Apache Arrow for data transfer between JVM and Python — no per-row serialization. Much faster than scalar UDFs which cross the JVM-Python boundary once per row.

Three types:
• Scalar: function(pd.Series) → pd.Series. Column-level vectorized operations.
• Iterator of Series: streams input in batches. Better memory for large data.
• Scalar Iterator: batch-level init (load ML model once per batch, not per row).`,
detailed:`**Why regular Python UDFs are slow**:
1. Per-row serialization: Python object serialized → sent to Python process → processed → result serialized back → returned to JVM
2. Python overhead: Python interpreter invoked per row
3. No Catalyst optimization: UDF is a black box to the optimizer

**Why Pandas UDFs (vectorized) are faster**:
1. Arrow batch transfer: entire column (or batch) transferred at once via Apache Arrow (columnar binary format)
2. Vectorized processing: Python processes a batch of rows (pd.Series) at once
3. Much fewer JVM-Python boundary crossings (one per batch, not one per row)
4. Still slower than built-in Spark functions (which stay in JVM/Photon)

**Pandas UDF types** (by function signature):

**Scalar** (Series → Series):
\`\`\`python
@pandas_udf(returnType=DoubleType())
def normalize_delay(delay: pd.Series) -> pd.Series:
    return (delay - delay.mean()) / delay.std()
\`\`\`
Each batch: receives one pd.Series, returns one pd.Series. Independent batches.

**Iterator of Series** (Iterator[Series] → Iterator[Series]):
\`\`\`python
@pandas_udf(returnType=DoubleType())
def stateful_transform(iterator: Iterator[pd.Series]) -> Iterator[pd.Series]:
    # Load model ONCE for all batches (vs once per row with scalar UDF)
    model = load_expensive_model()
    for batch in iterator:
        yield model.predict(batch)
\`\`\`
Key advantage: load expensive objects (ML models, tokenizers) once per partition, not per row.

**Grouped Map** (DataFrame → DataFrame):
- Receives grouped DataFrame, returns transformed DataFrame
- Use for: apply arbitrary pandas operations per group (ARIMA per carrier, etc.)
- spark.applyInPandas()

**Group Aggregate** (Series → Scalar):
- Custom aggregate function over a group
- More flexible than built-in agg functions

**Performance hierarchy** (fastest → slowest):
Built-in Spark functions (Catalyst-native) >> Pandas UDFs >> Scalar Python UDFs`,
code:`import pandas as pd
from pyspark.sql.functions import pandas_udf
from pyspark.sql.types import *
from typing import Iterator

# Type 1: Scalar Pandas UDF (column-level vectorized)
@pandas_udf(returnType=StringType())
def categorize_delay(delay_min: pd.Series) -> pd.Series:
    return pd.cut(delay_min,
                  bins=[-float('inf'), 0, 15, 45, 180, float('inf')],
                  labels=['EARLY','MINOR','MODERATE','MAJOR','SEVERE'])

df = flights.withColumn("delay_category", categorize_delay("delay_min"))

# Type 2: Iterator Scalar — load model once per partition (not per row!)
@pandas_udf(returnType=DoubleType())
def predict_compensation(iterator: Iterator[pd.Series]) -> Iterator[pd.Series]:
    import mlflow
    # Load model ONCE for all batches in this partition (major performance win)
    model = mlflow.pyfunc.load_model("models:/appr-model@champion")
    for batch in iterator:
        features = batch.values.reshape(-1, 1)
        yield pd.Series(model.predict(features).flatten())

# Type 3: applyInPandas — arbitrary pandas transform per group
def fit_carrier_model(carrier_df: pd.DataFrame) -> pd.DataFrame:
    """Fit per-carrier delay model using pandas/statsmodels."""
    from statsmodels.tsa.holtwinters import ExponentialSmoothing
    model = ExponentialSmoothing(carrier_df["delay_min"]).fit()
    carrier_df["forecast"] = model.fittedvalues
    return carrier_df

# Apply per carrier (one Python process handles all rows for each carrier)
schema = flights.schema.add(StructField("forecast", DoubleType()))
result = (flights
    .groupBy("carrier_code")
    .applyInPandas(fit_carrier_model, schema=schema))`,
tags:['Pandas UDF','Vectorized UDF','Apache Arrow','Iterator UDF','applyInPandas','Group Map','Scalar UDF','Performance','ML Batch Inference','Type Annotations']},

{q:'What is the groupByKey vs reduceByKey performance difference? Why should you avoid groupByKey?',diff:'sr',
simple:`groupByKey: Shuffles ALL values for each key across the network, then groups them. Memory-dangerous for skewed keys.

reduceByKey: Applies the combine function LOCALLY on each partition first (combiner), then shuffles only the partially-reduced results. Much less data over the network.

Rule: Always prefer reduceByKey, aggregateByKey, or combineByKey over groupByKey for any associative/commutative aggregation.`,
detailed:`**groupByKey mechanics**:
1. All key-value pairs shuffled: every value for key K must go to same reducer
2. All values for K collected into an Iterable on one executor
3. Aggregation happens AFTER shuffle on full data
4. Risk: if one key has 1M values → one executor holds 1M values → OOM

**reduceByKey mechanics**:
1. Local combine phase: on each executor, partially aggregate values for same key LOCALLY
2. Only partially aggregated (k, partial_result) shuffled — much smaller
3. Final reduce across partial results at receiving executor
4. Works for: any associative + commutative function (sum, max, min, count, multiply)

**The combiner concept** (from Hadoop MapReduce):
reduceByKey is effectively a combiner-enabled reduce. Same function runs locally (combiner) and remotely (reducer).

**RDD API alternatives to groupByKey**:
- reduceByKey: associative+commutative ops (sum, max)
- aggregateByKey(zero)(seqOp, combOp): different combine and merge functions
- combineByKey: most general — different types for input, combine, merge
- foldByKey(zero)(func): like reduceByKey but with zero value

**DataFrame API** (almost always better than RDD):
In 2024, groupBy().agg() in DataFrame API does NOT have the groupByKey problem. DataFrame groupBy + HashAggregate has its own partial-aggregate-then-shuffle implementation. Only use RDD reduceByKey if you genuinely need RDD API (rare).`,
code:`# The groupByKey vs reduceByKey difference (RDD API)
from pyspark import SparkContext

rdd = sc.parallelize([("AC", 30), ("WS", 15), ("AC", 45), ("WS", 60), ("AC", 20)])

# BAD: groupByKey — shuffles ALL values, then sums on reducer
result_bad = (rdd
    .groupByKey()                           # Sends all values across network
    .map(lambda kv: (kv[0], sum(kv[1]))))  # Sum only after all values received

# GOOD: reduceByKey — partial sum locally, then shuffle only partial results
result_good = rdd.reduceByKey(lambda a, b: a + b)  # Local combine first!

# aggregateByKey: different input type vs output type (e.g., average)
zero_value = (0, 0)  # (sum, count)
result_avg = rdd.aggregateByKey(
    zero_value,
    lambda acc, val: (acc[0] + val, acc[1] + 1),   # seqOp: combine locally
    lambda a, b: (a[0] + b[0], a[1] + b[1])         # combOp: merge partitions
).map(lambda kv: (kv[0], kv[1][0] / kv[1][1]))    # Compute final average

# DataFrame API (better — Catalyst handles optimization):
# groupBy().agg() internally uses partial aggregation (no groupByKey problem)
result_df = (spark.createDataFrame(rdd, ["carrier", "delay"])
    .groupBy("carrier")
    .agg(F.avg("delay").alias("avg_delay"),
         F.sum("delay").alias("total_delay")))

# When to use RDD vs DataFrame:
# RDD: complex custom logic, non-tabular data, specific serialization control
# DataFrame: everything else (better performance, Catalyst optimization)`,
tags:['groupByKey','reduceByKey','combiner','aggregateByKey','Shuffle Optimization','RDD','OOM Risk','Partial Aggregation','DataFrame vs RDD','Performance']},
]},

{q:'Explain the Spark memory model. How is executor memory divided and what happens when each region overflows?',diff:'pr',
simple:`Executor memory is divided into three regions:

• Execution memory: shuffle buffers, sort/hash operations, join hash tables
• Storage memory: cached DataFrames/RDDs
• User memory: Python UDF objects, broadcast variables, user data structures

Execution and storage share a unified pool (spark.memory.fraction of heap). They borrow from each other — storage evicts to let execution proceed (but not vice versa without OOM).`,
detailed:`**Executor memory breakdown** (with defaults):

Total executor memory = spark.executor.memory (e.g., 16g)
+ spark.executor.memoryOverhead (e.g., 4g) → Off-heap (OS, JVM metaspace, native code)

Within the JVM heap (spark.executor.memory = 16g):
- Reserved memory: 300MB (hardcoded for Spark internal objects)
- User memory: (1 - spark.memory.fraction) × (heap - reserved) = 40% × 15.7g ≈ 6.3g
  → Python UDFs, user data structures, broadcast variable metadata
- Unified memory pool: spark.memory.fraction × (heap - reserved) = 60% × 15.7g ≈ 9.4g
  - Storage fraction (cache): spark.memory.storageFraction × 9.4g = 50% = 4.7g (soft limit)
  - Execution fraction: remaining 4.7g (soft limit)

**Unified memory pool dynamics** (Spark 1.6+ unified model):
- Execution and storage CAN borrow from each other
- Execution can evict storage cache if it needs more memory (storage blocks evicted to disk or dropped)
- Storage CANNOT evict execution memory (would cause failures in running tasks)
- Result: execution memory is prioritized; cached DataFrames evicted when tasks need memory

**Off-heap memory** (spark.executor.memoryOverhead):
- JVM overhead: JVM itself, metaspace, thread stacks
- Native libraries: Arrow buffer for Pandas UDFs, Photon native memory
- Netty network buffers: for shuffle and broadcast

**Overflow behaviors by region**:
- Execution overflow: spill to local disk (shuffle spill) → slower but not OOM
- Storage overflow: evict cache blocks to disk (if MEMORY_AND_DISK) → slower fetches
- User memory overflow: java.lang.OutOfMemoryError: Java heap space → task fails → retry

**Photon memory**:
- Photon allocates off-heap native memory (separate from JVM heap)
- No GC impact from Photon's memory usage
- Configure: spark.databricks.photon.allotedMemoryMB`,
code:`# Memory configuration for different workload types

# Configuration: shuffle-heavy ETL (needs more execution memory)
spark.conf.set("spark.executor.memory",         "16g")
spark.conf.set("spark.executor.memoryOverhead",  "4g")  # Off-heap (Arrow, Netty)
spark.conf.set("spark.memory.fraction",          "0.7") # 70% for execution+storage
spark.conf.set("spark.memory.storageFraction",   "0.3") # 30% of pool for cache

# Configuration: ML training with large cached DataFrames
spark.conf.set("spark.memory.fraction",          "0.8")
spark.conf.set("spark.memory.storageFraction",   "0.6") # More cache for repeated reads

# Configuration: Pandas UDF heavy (needs more off-heap for Arrow)
spark.conf.set("spark.executor.memoryOverhead",  "8g")  # Extra for Arrow buffers
spark.conf.set("spark.memory.offHeap.enabled",   "true")
spark.conf.set("spark.memory.offHeap.size",      "4g")

# Diagnose memory usage via Spark UI metrics
# Storage tab: shows size of cached DataFrames + eviction count
# Executor tab: GC time %, heap used, off-heap used
# Stage task metrics: "Shuffle Spill (Disk)", "Peak Execution Memory"

# Monitor executor memory programmatically
def get_executor_memory_stats(sc):
    """Get memory stats from all executors."""
    return sc._jvm.org.apache.spark.ui.exec \
        .ExecutorSummary  # Access via Spark REST API

# REST API alternative:
import requests
resp = requests.get(
    f"{spark.sparkContext.uiWebUrl}/api/v1/applications/"
    f"{spark.sparkContext.applicationId}/executors"
)
for exe in resp.json():
    print(f"Executor {exe['id']}: "
          f"heap={exe['memoryUsed']/(1024**3):.1f}GB, "
          f"maxHeap={exe['maxMemory']/(1024**3):.1f}GB")`,
