<script>
const CATS=[

// ── 1. LAKEHOUSE PLATFORM ──────────────────────────────────────────
{id:'platform',icon:'🏠',label:'Lakehouse Platform',desc:'Databricks architecture, workspace, control/data plane',qs:[
{q:'What is the Databricks Lakehouse Platform? How does it differ from a traditional data lake or data warehouse?',diff:'sr',
simple:`The Databricks Lakehouse combines the best of data lakes and data warehouses into one open platform:

• Data Lake: Cheap, flexible, open-format storage (S3/ADLS) — but no ACID, poor BI performance, no governance.
• Data Warehouse: ACID, fast BI queries, governance — but expensive, closed, can't run ML directly on it.
• Lakehouse: Open table formats (Delta Lake) on cloud storage with ACID + BI-grade performance + ML — all from one platform.

Databricks is the leading commercial lakehouse — Spark + Delta Lake + MLflow + Unity Catalog on one platform.`,
detailed:`**Lakehouse key properties** (coined by Databricks/Berkeley):
1. Transaction support (ACID via Delta Lake)
2. Schema enforcement and governance (Unity Catalog)
3. BI support (Databricks SQL, Photon engine)
4. Storage is open and direct (Parquet/Delta on S3 — not vendor-proprietary format)
5. End-to-end streaming (Structured Streaming + DLT)
6. Diverse workloads: ETL + SQL + ML + streaming — ONE platform
7. Decoupled storage and compute (scale independently)

**Architecture layers**:
- **Storage**: Customer-owned cloud storage (S3/ADLS/GCS) — open Delta/Iceberg/Parquet format
- **Delta Engine / Photon**: Vectorized query engine on top of storage
- **Runtime**: Databricks Runtime (DBR) — Spark + optimizations + libraries
- **Platform services**: Unity Catalog, MLflow, Workflows, Delta Live Tables
- **Control Plane**: Databricks-managed — web UI, job scheduling, metadata, cluster management
- **Data Plane**: Customer VPC/VNET — actual compute (EC2/VMs) and storage access

**Key differentiation vs Snowflake**:
- Databricks: Open formats (Delta/Iceberg), general-purpose (ETL + ML + SQL), Python-first
- Snowflake: Proprietary format, SQL-first, easier for pure BI/analytics, stronger data sharing
- Neither is universally better — choice depends on workload mix and team skills`,
code:`# Databricks architecture summary (conceptual)
# 
# ┌─────────────────────────────────────────────┐
# │           DATABRICKS CONTROL PLANE          │  ← Databricks-managed
# │  Web UI · REST API · Job Scheduler          │
# │  Cluster Manager · Unity Catalog Metastore  │
# └────────────────┬────────────────────────────┘
#                  │ Cluster spin-up instructions
# ┌────────────────▼────────────────────────────┐
# │         CUSTOMER DATA PLANE (your VPC)      │  ← Your cloud account
# │  EC2/VMs (Spark clusters)                   │
# │  DBFS / S3 / ADLS / GCS (Delta Lake files)  │
# │  Secrets (customer-managed)                 │
# └─────────────────────────────────────────────┘
#
# Key: Your DATA never leaves your cloud account (data plane)
# Databricks only manages metadata and orchestration (control plane)`,
tags:['Lakehouse','Databricks Architecture','Control Plane','Data Plane','Delta Lake','vs Snowflake','Unity Catalog']},

{q:'What is Databricks Runtime (DBR)? What are the different runtime variants and when do you choose each?',diff:'sr',
simple:`Databricks Runtime (DBR) is a versioned bundle of Apache Spark + optimized libraries + Databricks-specific optimizations pre-installed on clusters. Choose the right runtime for your workload:

• Standard DBR: General ETL, SQL, Python/Scala/R workloads
• DBR ML: Adds ML libraries (TensorFlow, PyTorch, XGBoost, scikit-learn, MLflow)
• DBR GPU: ML runtime + CUDA drivers for GPU-accelerated training
• Photon Runtime: Databricks' vectorized C++ query engine for SQL/BI workloads`,
detailed:`**DBR versioning matters**:
- DBR versions pin Spark + Python + library versions
- LTS (Long-Term Support) versions: DBR 12.2 LTS, 13.3 LTS — stable, security-patched for 2 years
- Always pin LTS for production; use latest for experimentation
- Key APIs change between major versions — migration guides needed

**DBR variants**:

**Standard DBR**:
- Apache Spark + Delta Lake + MLflow + common Python/Scala/R libraries
- Best for: ETL pipelines, batch processing, Data Engineering workloads
- Cheaper than ML runtime (no large ML library overhead)

**DBR ML**:
- Everything in Standard + curated ML libraries (sklearn, XGBoost, LightGBM, TensorFlow, PyTorch, Hugging Face, MLflow)
- Libraries pre-tested together (no version conflicts)
- Best for: Feature engineering, model training, ML pipelines
- Required for: Databricks AutoML, Feature Store, Model Serving prep

**DBR GPU**:
- ML Runtime + CUDA + NCCL for multi-GPU training
- GPU instance types (p3, p4d on AWS; NC series on Azure)
- Best for: Deep learning training, LLM fine-tuning, computer vision

**Photon Runtime**:
- Replaces Spark SQL execution engine with Photon (C++ vectorized)
- 2-10× faster for SQL queries, aggregations, joins on wide datasets
- Drop-in compatible — no code changes needed
- Best for: Databricks SQL Warehouses, BI queries, large-scale SQL ELT
- Not available on GPU instances

**Single Node clusters**: One driver, no workers. Best for small datasets, debugging, notebook exploration. Much cheaper than multi-node for dev work.

**Principal-level insight**: Always specify runtime version in cluster policies and job configs. Unversioned "latest" clusters cause reproducibility failures in production pipelines.`,
code:`# Cluster config (JSON / Terraform)
{
  "cluster_name": "etl-prod",
  "spark_version": "13.3.x-scala2.12",        # Pin LTS version
  "node_type_id": "i3.xlarge",
  "num_workers": 4,
  "autoscale": {
    "min_workers": 2,
    "max_workers": 8
  },
  "spark_conf": {
    "spark.sql.shuffle.partitions": "400",
    "spark.databricks.delta.optimizeWrite.enabled": "true",
    "spark.databricks.delta.autoCompact.enabled": "true"
  },
  "custom_tags": {
    "team": "data-engineering",
    "cost_center": "analytics"
  }
}

# ML cluster: GPU + ML Runtime
{
  "spark_version": "13.3.x-gpu-ml-scala2.12",  # GPU ML runtime
  "node_type_id": "p3.2xlarge",                 # AWS GPU instance
  "num_workers": 0,                             # Single node for training
  "driver_node_type_id": "p3.8xlarge"
}`,
tags:['Databricks Runtime','DBR','Photon','DBR ML','GPU Runtime','LTS','Cluster Config','Versioning']},

{q:'What is the difference between interactive clusters, job clusters, and SQL warehouses? How do you choose?',diff:'sr',
simple:`Three compute types in Databricks, each for different purposes:

• Interactive/All-Purpose Cluster: Long-running, shared for notebook development. Stays up between runs. Expensive if left idle.
• Job Cluster: Spun up for one specific job run, terminates when done. Cheaper — pay only for run time. Best for production pipelines.
• SQL Warehouse (formerly SQL Endpoint): Specialized for SQL queries only. Serverless option available. Best for BI tools and Databricks SQL.`,
detailed:`**All-Purpose (Interactive) Clusters**:
- Manual start/stop (with auto-termination after idle period)
- Shared across notebooks and users (can cause resource contention)
- Persistent libraries and state between runs
- Best for: Development, exploration, debugging, iterative notebooks
- Cost concern: Must set auto-termination (e.g., 30 min idle → terminate)
- Cluster policies: Enforce auto-termination, instance types, max DBUs to prevent runaway costs

**Job Clusters**:
- Created fresh for each job run, terminated automatically on completion
- Isolated: one job = one cluster = no interference
- No startup state — all dependencies must be installed in job config
- Best for: Production ETL, scheduled pipelines, DLT pipelines, ML training runs
- Significantly cheaper: no idle cost between scheduled runs
- Warm pools: Pre-warmed instances reduce startup time (~2 min → ~30 sec)

**SQL Warehouses**:
- Purpose-built for SQL only (no Python/Scala notebooks)
- Three types:
  - Classic: Traditional cluster, customer VPC
  - Pro: Classic + additional features (query federation, Unity Catalog)
  - Serverless: Fully managed compute in Databricks cloud, instant start (< 5 sec), auto-scale per query
- Photon engine always enabled on SQL warehouses
- Shared across all SQL users (query isolation by warehouse, not cluster)
- Best for: BI tools (Tableau, Power BI, Looker), SQL analysts, Databricks SQL dashboards

**Cost optimization rule**:
- DEV: All-purpose clusters with 30-min auto-termination
- PROD jobs: Always job clusters (ephemeral, no idle cost)
- PROD SQL/BI: SQL Warehouses — Serverless for variable load, Classic/Pro for predictable load`,
code:`# Job cluster config (best practice for production)
{
  "name": "daily-etl-flight-data",
  "tasks": [{
    "task_key": "ingest",
    "new_cluster": {                          # Job cluster: ephemeral
      "spark_version": "13.3.x-scala2.12",
      "node_type_id": "i3.2xlarge",
      "num_workers": 4,
      "cluster_log_conf": {
        "dbfs": {"destination": "dbfs:/logs/daily-etl"}
      }
    },
    "notebook_task": {
      "notebook_path": "/Pipelines/ingest_flights"
    }
  }],
  "schedule": {
    "quartz_cron_expression": "0 30 6 * * ?",   # 6:30 AM daily
    "timezone_id": "America/Toronto"
  },
  "max_retries": 2,
  "retry_on_timeout": true
}

# Cluster policy (enforce cost controls)
{
  "name": "dev-policy",
  "definition": {
    "autotermination_minutes": {"type": "fixed", "value": 30},
    "node_type_id": {"type": "allowlist", "values": ["i3.xlarge","i3.2xlarge"]},
    "num_workers": {"type": "range", "maxValue": 4}
  }
}`,
tags:['Interactive Cluster','Job Cluster','SQL Warehouse','Serverless','Photon','Cost Optimization','Cluster Policy','Auto-termination']},

{q:'What is Databricks Connect? How does it enable local development against a remote Databricks cluster?',diff:'sr',
simple:`Databricks Connect (DBConnect v2 for DBR 13+) lets you write PySpark code in your local IDE (VS Code, PyCharm) and execute it on a remote Databricks cluster — while keeping the cluster running remotely.

You get: local IDE features (autocomplete, debugging, linting) + full Databricks cluster power (Spark, Delta, Unity Catalog) without running Spark locally. No local Spark installation needed.`,
detailed:`**How Databricks Connect works**:
1. Install databricks-connect Python package locally
2. Configure cluster ID + workspace URL + token
3. SparkSession points to remote cluster via gRPC connection
4. When you call spark.read.table("...") → runs on remote cluster
5. Results streamed back to local Python process

**DBConnect v1 vs v2**:
- v1 (DBR < 13): Legacy, limited features, Py4J bridge — slow and unreliable
- v2 (DBR 13+): Complete rewrite, gRPC-based, Spark Connect protocol — much more reliable and featureful

**What works / doesn't work locally**:
✅ Works: DataFrames, SQL, Delta reads/writes, MLflow tracking, Unity Catalog access
❌ Doesn't work: SparkContext directly, RDD operations (use DataFrame API), cluster-level Spark UI

**Development workflow**:
\`\`\`
Local IDE → DBConnect → Remote Databricks Cluster → Delta Lake / Unity Catalog
\`\`\`

**When to use Databricks Connect**:
- Unit testing Spark code locally before deploying
- Debugging complex transformations with IDE breakpoints
- CI/CD: run tests against real Databricks cluster in pipeline
- Engineers who prefer local IDE over Databricks notebooks

**Alternative: Databricks Notebooks** (most Databricks-native teams use notebooks for data exploration + production Workflows for deployment)

**pytest with DBConnect**:
\`\`\`python
@pytest.fixture(scope="session")
def spark():
    return DatabricksSession.builder.remote(
        host="https://adb-xxx.azuredatabricks.net",
        token=os.environ["DATABRICKS_TOKEN"],
        cluster_id="0101-123456-xxxx"
    ).getOrCreate()
\`\`\``,
code:`# pip install databricks-connect

# Configure (CLI or environment)
# databricks configure --token
# or set environment variables:
# DATABRICKS_HOST, DATABRICKS_TOKEN, DATABRICKS_CLUSTER_ID

from databricks.connect import DatabricksSession
from pyspark.sql import functions as F

# Connect to remote cluster
spark = DatabricksSession.builder.remote(
    host="https://adb-xxx.azuredatabricks.net",
    token=os.environ["DATABRICKS_TOKEN"],
    cluster_id="0101-123456-xxxx"   # Must be running
).getOrCreate()

# All Spark operations run on remote cluster
df = spark.table("prod.silver.flights")        # Reads Delta on remote cluster
result = df.filter(F.col("carrier") == "AC") \
           .groupBy("flight_date") \
           .agg(F.avg("delay_min"))

result.show()  # Results streamed back to local process

# Unit test with DBConnect
import pytest
from databricks.connect import DatabricksSession

def test_silver_flight_transform(spark):
    test_data = spark.createDataFrame([
        ("AC101", "2024-01-15", 45, "DELAYED"),
    ], ["flight_id","flight_date","delay_min","status"])

    from pipelines.silver import transform_flights
    result = transform_flights(test_data)
    assert result.count() == 1
    assert "delay_category" in result.columns`,
tags:['Databricks Connect','DBConnect v2','Local Development','Remote Spark','Unit Testing','Spark Connect','gRPC','IDE Integration','pytest']},

{q:'What is the Databricks secret management system? How do you avoid hardcoded credentials in notebooks?',diff:'sr',
simple:`Databricks Secrets let you store sensitive values (API keys, passwords, connection strings) in an encrypted secret store, then reference them in notebooks/jobs as variable references — never as plaintext strings.

Secrets are organized into scopes (groups). You use dbutils.secrets.get("scope-name", "key-name") to retrieve them. The value is redacted in notebook outputs automatically.`,
detailed:`**Databricks Secret Scopes**:

**Databricks-backed scope**: Secrets stored in Databricks internal encrypted store
- Create: databricks secrets create-scope --scope my-scope
- Add secret: databricks secrets put --scope my-scope --key snowflake-password
- Access: dbutils.secrets.get("my-scope", "snowflake-password")

**Azure Key Vault-backed scope** (Azure only):
- Databricks scope maps to an Azure Key Vault
- Secrets managed in Azure Key Vault → Databricks reads them transparently
- Best for: Organizations already using Azure Key Vault for all secrets
- No duplicate management: one secret store for all Azure services

**AWS Secrets Manager** (via Databricks-backed scope or direct SDK):
- Alternative: Use boto3 inside notebook with instance profile auth (no credentials needed if cluster has IAM role)

**Secret ACLs** (Unity Catalog workspaces):
- Control which users/groups can read which scopes
- databricks secrets put-acl --scope my-scope --principal data-engineers --permission READ

**Best practices**:
1. Never hardcode secrets in notebooks: spark.read.format("jdbc").option("password", "mypassword") ← NEVER
2. Use dbutils.secrets: .option("password", dbutils.secrets.get("scope", "db-password"))
3. Store in version control: Only secret scope names and key names (not values)
4. Rotate regularly: Update secret value without changing notebooks (they always read current value)
5. Separate scopes by environment: prod-secrets, dev-secrets
6. Service principals + OAuth (recommended for production): Replace PAT tokens with OAuth M2M for Databricks API access`,

// ── 2. DELTA LAKE ──────────────────────────────────────────────────
{id:'delta',icon:'△',label:'Delta Lake',desc:'Transaction log, ACID, time travel, optimization',qs:[
{q:'Explain Delta Lake\'s architecture. How does the transaction log achieve ACID guarantees?',diff:'pr',
simple:`Delta Lake adds ACID transactions to plain Parquet files on cloud storage. The secret is the Delta transaction log (_delta_log/) — a write-ahead log that records every operation on the table.

Every commit creates a numbered JSON file (0000001.json, 0000002.json...). To see a table's current state, Delta reads these commit files to know which Parquet files are "current." This log makes ACID possible on what would otherwise be unmanaged files.`,
detailed:`**Delta Lake architecture components**:
- **Data files**: Regular Parquet files — readable by any Parquet reader
- **Delta log** (_delta_log/): JSON commit files recording every operation
- **Checkpoint files**: Periodic Parquet snapshots (every 10 commits by default) — prevents reading thousands of JSON files
- **Last checkpoint** (_delta_log/_last_checkpoint): Pointer to latest checkpoint

**How each ACID property is achieved**:

**Atomicity**: A commit = one atomic file write to object storage. Either the JSON file exists (committed) or it doesn't (never happened). Partial writes = incomplete commit = automatically ignored.

**Consistency**: Schema validated against table schema before write accepted. Incompatible schema → write rejected with clear error. Constraints (CHECK constraints in Delta 2.0+) validated before commit.

**Isolation**: Optimistic concurrency control:
- Writer 1 reads table at version N, begins writing
- Writer 2 also reads at version N, commits first (version N+1)
- Writer 1 tries to commit — detects conflict (version N+1 exists) → retries or fails based on conflict resolution
- Delta determines if the two operations conflict on the same data (concurrent appends to different partitions = no conflict, both succeed)

**Durability**: Commit files stored in object storage (S3/ADLS) which provides 99.999999999% (11 nines) durability.

**Transaction log entry structure** (each JSON file contains):
- add: New Parquet files added in this transaction
- remove: Files logically deleted (tombstoned) in this transaction
- metaData: Schema, partition columns, table properties
- commitInfo: Who committed, when, what operation, isolation level
- protocol: Minimum reader/writer versions required

**Checkpoint files**: Created every 10 commits by default. A Parquet file consolidating all log entries up to that point. When reading table state: load latest checkpoint + apply JSON files since checkpoint. Prevents linear growth in log reading cost.`,
code:`# Delta Lake: read transaction log directly
from delta.tables import DeltaTable
import json

# Show table history (each commit in the log)
dt = DeltaTable.forName(spark, "silver.flights")
dt.history(10).select(
    "version", "timestamp", "operation",
    "operationParameters", "operationMetrics"
).show(truncate=False)

# Read the raw transaction log
log_df = spark.read.json(
    "abfss://datalake@storage.dfs.core.windows.net/silver/flights/_delta_log/*.json"
)
log_df.select("add.path", "remove.path", "commitInfo.operation").show()

# Time travel: read table at previous version
# Version-based
df_v5 = spark.read.format("delta").option("versionAsOf", 5) \
    .load("abfss://datalake@storage.dfs.core.windows.net/silver/flights")

# Timestamp-based
df_jan = spark.read.format("delta") \
    .option("timestampAsOf", "2024-01-15 12:00:00") \
    .table("silver.flights")

# Show files in current snapshot
dt.detail().select("numFiles","sizeInBytes","partitionColumns").show()`,
tags:['Delta Lake','Transaction Log','ACID','Atomicity','Optimistic Concurrency','Checkpoint','Parquet','Time Travel','Commit Info']},

{q:'Explain Delta Lake OPTIMIZE and Z-ordering. What problem do they solve and when do you use them?',diff:'pr',
simple:`OPTIMIZE: Compacts many small Parquet files into fewer, larger files. Solves the "small file problem" — hundreds of tiny files = slow reads due to per-file overhead.

Z-ordering: A multi-dimensional clustering technique that colocates related data in the same files. After Z-ordering on (customer_id, date), queries filtering by those columns read far fewer files because matching rows are physically close together.`,
detailed:`**The small file problem**:
- Streaming pipelines write micro-batches every few minutes → hundreds of tiny 1-10 MB Parquet files per day
- Each file = a separate S3 GET request when reading
- 10,000 files × 5ms per GET = 50 seconds just in I/O overhead before reading any data
- OPTIMIZE: Coalesces small files into target size of ~1 GB each (configurable)

**OPTIMIZE mechanics**:
- Scans a partition (or the whole table if no partition filter)
- Identifies files below a size threshold (default 1 GB)
- Reads and rewrites them as fewer, larger files
- Updates Delta log to point to new files (old files tombstoned)
- Non-blocking: table remains readable during OPTIMIZE
- Cost: Compute to read + write files; not free — schedule during off-peak

**Z-ordering**:
- A space-filling curve that maps multi-dimensional data to one dimension while preserving locality
- Files that share similar values on Z-order columns are colocated on disk
- Result: queries filtering on Z-order columns need to read far fewer files (better data skipping)
- Syntax: OPTIMIZE table ZORDER BY (col1, col2)

**Z-order vs partitioning**:
| | Partitioning | Z-ordering |
|---|---|---|
| Column cardinality | Low (< 10K distinct) | High (millions) |
| Effect | Separate directories | Data colocated in fewer files |
| Query | WHERE part_col = X → reads only that dir | WHERE zo_col = X → skips most files |
| Works with | Any column | Columns that DON'T work well for partitioning |

**When to Z-order**:
- Columns frequently used in WHERE or JOIN that have too high cardinality for partitioning (user_id, order_id, flight_number)
- Up to 3-4 columns (beyond that: diminishing returns)
- After running OPTIMIZE — Z-ordering is done as part of OPTIMIZE

**Auto Optimize** (Databricks-specific):
- optimizeWrite: Automatically adjusts file sizes during writes (reduces need for manual OPTIMIZE)
- autoCompact: Automatically runs lightweight compaction after writes
- Enable in cluster conf or table properties`,
code:`-- Run OPTIMIZE with Z-ordering (SQL)
OPTIMIZE silver.flight_events
ZORDER BY (flight_date, carrier_code, flight_number);

-- Partition-aware OPTIMIZE (only optimize yesterday's partition)
OPTIMIZE silver.flight_events
WHERE flight_date = current_date() - 1
ZORDER BY (carrier_code, flight_number);

-- Python
from delta.tables import DeltaTable
dt = DeltaTable.forName(spark, "silver.flight_events")
dt.optimize().executeZOrderBy("flight_date", "carrier_code")

-- Check if Z-ordering is working (query profile should show data skipping)
-- Look for: "Number of files after skipping" << "Total files"
DESCRIBE DETAIL silver.flight_events;
-- Shows: numFiles, sizeInBytes, partitionColumns, clusteringColumns

-- Table properties: enable auto-optimization
ALTER TABLE silver.flight_events
SET TBLPROPERTIES (
  'delta.autoOptimize.optimizeWrite' = 'true',
  'delta.autoOptimize.autoCompact'   = 'true'
);`,
tags:['OPTIMIZE','Z-ordering','Small File Problem','Data Skipping','Compaction','Auto Optimize','Partitioning','Performance']},

{q:'What is Delta Lake VACUUM? What is the retention period and what are the risks of running it too aggressively?',diff:'sr',
simple:`VACUUM deletes old Parquet files that are no longer referenced by any current or time-travel snapshot in the Delta log. Without VACUUM, old files accumulate forever — your storage bill grows even though the "current" table is small.

The default retention period is 7 days (168 hours). Files newer than this threshold are NOT deleted even if they're no longer in the current snapshot — this protects time travel queries.`,
detailed:`**Why old files accumulate**:
- Every UPDATE, DELETE, or MERGE creates new Parquet files (Delta is copy-on-write by default)
- Old files are "tombstoned" in the Delta log (marked remove) but NOT deleted from storage
- Each OPTIMIZE also creates new files and tombstones old ones
- Without VACUUM: 6 months of daily updates = 180× the storage of just the current data

**VACUUM mechanics**:
1. Lists all files in the table directory
2. Identifies files NOT referenced by any Delta log entry within the retention window
3. Deletes those files from storage
4. Logs the VACUUM operation in the Delta log

**Retention period trade-offs**:
- Default 7 days: Allows time travel to any point in last week
- Shorter (e.g., 1 day): Saves storage, but time travel limited to 24 hours
- Longer (e.g., 30 days): More time travel flexibility, more storage cost
- Zero retention risk: Running VACUUM with RETAIN 0 HOURS deletes ALL old files immediately — breaks time travel completely, and could break concurrent readers

**Risk: Concurrent reads during VACUUM**:
- If a Spark job reads a snapshot that references files currently being VACUUMed → read fails with FileNotFoundException
- Mitigation: The retention window protects against this for queries started recently
- For very long-running jobs: Ensure retention period > longest expected job duration

**VACUUM and shallow clones**:
- VACUUM on source table CAN delete files that shallow clone references
- Shallow clone: Only creates Delta log entries, doesn't copy Parquet files
- Mitigation: Run VACUUM on clones first, or use deep clones for durability

**Best practice**:
- Production schedule: Run VACUUM daily or weekly (not after every write)
- Retention: Keep default 7 days for most use cases; use 30 days for compliance-sensitive tables
- VACUUM DRY RUN: Preview what would be deleted before running`,
code:`-- VACUUM with default retention (7 days)
VACUUM silver.flight_events;

-- Custom retention (30 days for compliance)
VACUUM silver.flight_events RETAIN 720 HOURS;

-- DRY RUN: preview what would be deleted (no actual deletion)
VACUUM silver.flight_events DRY RUN;
-- Returns list of files that WOULD be deleted

-- Override safety check for testing (not for production!)
-- spark.databricks.delta.retentionDurationCheck.enabled = false
-- VACUUM silver.flight_events RETAIN 0 HOURS; -- DANGEROUS

-- Python scheduled VACUUM job
from delta.tables import DeltaTable

def vacuum_table(table_name: str, retention_hours: int = 168):
    dt = DeltaTable.forName(spark, table_name)
    dt.vacuum(retention_hours)
    print(f"Vacuumed {table_name} with {retention_hours}h retention")

# Run on all silver tables
tables = ["silver.flights","silver.passengers","silver.bookings"]
for t in tables:
    vacuum_table(t, retention_hours=168)`,
tags:['VACUUM','Retention Period','Time Travel','Storage Cost','Shallow Clone','Concurrent Reads','Copy-on-Write','File Management']},

{q:'What is Delta Lake Change Data Feed (CDF)? How does it power incremental pipelines?',diff:'pr',
simple:`Change Data Feed (CDF) tracks row-level changes (insert, update, delete, update_preimage) made to a Delta table. Instead of reprocessing the entire table, downstream consumers read only the CHANGES since their last read — dramatically reducing compute for incremental pipelines.

Think of it as CDC for Delta tables — without needing Debezium or a separate CDC tool.`,
detailed:`**Enabling CDF**:
- Table property: delta.enableChangeDataFeed = true
- New tables: CREATE TABLE ... TBLPROPERTIES ('delta.enableChangeDataFeed' = 'true')
- Existing tables: ALTER TABLE SET TBLPROPERTIES (...)

**CDF change types** (the _change_type column):
- insert: New rows added
- update_preimage: The row BEFORE an update (the old values)
- update_postimage: The row AFTER an update (the new values)
- delete: Rows removed

**CDF reading options**:
- startingVersion: Read changes from a specific Delta version
- startingTimestamp: Read changes since a specific time
- Stream mode: Structured Streaming source that continuously emits new changes

**CDF use cases**:

1. **Incremental Silver → Gold**: Gold aggregations only process changed records since last run (not full table scan)
2. **Cache invalidation**: Read CDF to know which Redis/application cache keys to invalidate
3. **Downstream sync**: Sync Delta table changes to Elasticsearch, Cassandra, DynamoDB
4. **Audit trail**: Human-readable record of every change to the table
5. **GDPR erasure verification**: Track that deleted rows are actually gone

**CDF vs full table scan comparison**:
Without CDF: Silver table has 10B rows. Update 100K rows. Gold reprocessing reads all 10B rows.
With CDF: Gold reads only the 100K changed rows from CDF. 100,000× less data scanned.

**CDF storage overhead**: CDF data is stored in _change_data/ directory alongside Delta log. Overhead is proportional to change volume, not table size. Enable for tables with frequent point updates.

**Streaming CDF** — continuous pipeline:
\`\`\`python
spark.readStream.format("delta") \
    .option("readChangeFeed", "true") \
    .option("startingVersion", 0) \
    .table("silver.customers") \
    # → processes each new change event as it arrives
\`\`\``,
code:`# Enable CDF on existing table
spark.sql("""
    ALTER TABLE silver.customers
    SET TBLPROPERTIES ('delta.enableChangeDataFeed' = 'true')
""")

# Read CDF batch: all changes since version 10
cdf_df = (spark.read.format("delta")
    .option("readChangeFeed", "true")
    .option("startingVersion", 10)
    .table("silver.customers"))

cdf_df.select(
    "_commit_version",
    "_commit_timestamp",
    "_change_type",           # insert / update_preimage / update_postimage / delete
    "customer_id", "tier", "region"
).show()

# Incremental aggregation: only process changed customers
changes = cdf_df.filter("_change_type IN ('update_postimage','insert')")

# Merge changes into gold table
from delta.tables import DeltaTable
gold = DeltaTable.forName(spark, "gold.customer_metrics")
(gold.alias("t")
  .merge(changes.alias("s"), "t.customer_id = s.customer_id")
  .whenMatchedUpdateAll()
  .whenNotMatchedInsertAll()
  .execute())

# Streaming CDF (continuous pipeline)
(spark.readStream.format("delta")
    .option("readChangeFeed", "true")
    .option("startingTimestamp", "2024-01-01")
    .table("silver.customers")
    .writeStream
    .format("delta")
    .outputMode("append")
    .option("checkpointLocation", "/checkpoints/cdf-pipeline")
    .table("gold.customer_metrics"))`,
tags:['Change Data Feed','CDF','Incremental Pipeline','CDC','_change_type','update_preimage','Streaming CDF','GDPR','Audit Trail']},

{q:'Compare Delta Lake, Apache Iceberg, and Apache Hudi. When does Databricks support or prefer each?',diff:'ar',
simple:`All three are open table formats that bring ACID and time travel to data lakes. Key differences:

• Delta Lake: Databricks-native. Best Spark/Databricks integration. Richest feature set on Databricks. JSON transaction log.
• Apache Iceberg: Engine-agnostic (Spark, Flink, Trino, Athena, BigQuery). Hidden partitioning. Becoming the "universal" standard.
• Apache Hudi: Optimized for streaming upserts with record-level indexing. Copy-on-Write vs Merge-on-Read table types.

Databricks supports all three via UniForm (Universal Format) — Delta tables readable as Iceberg by external engines.`,
detailed:`**Delta Lake** (Databricks native):
- Transaction log: JSON commit files (human-readable, easy to debug)
- Deepest Databricks feature support: DLT, CDF, Photon, Unity Catalog, Auto Optimize all work natively
- Multi-engine: Spark (native), Flink (connector), Trino (connector), Power BI (connector)
- Governance: Unity Catalog, column-level masking, row-level filtering
- **UniForm** (Universal Format): Delta table simultaneously readable as Iceberg or Hudi — enables multi-engine access without format conversion

**Apache Iceberg**:
- Transaction log: Avro-based manifest files (more complex but highly optimized for metadata operations)
- Engine-agnostic from the ground up: Spark, Flink, Trino, Presto, Hive, Athena, BigQuery all natively read Iceberg
- Hidden partitioning: Partition spec is decoupled from table definition — queries don't need to specify partition filter, optimizer handles pruning
- Partition evolution: Change partitioning scheme without rewriting existing data
- Growing fast: AWS Glue default, Snowflake external Iceberg, Google BigQuery
- **When to choose**: Multi-engine shops using Trino/Athena + Spark; AWS-heavy environments

**Apache Hudi**:
- Record-level index: Bloom filter or HBase index → efficient point lookups/updates
- Two table types:
  - Copy-on-Write (COW): Full file rewrite on update. Read-optimized, slower writes.
  - Merge-on-Read (MOR): Write delta log, merge at read time. Write-fast, slower reads.
- Best for: Streaming CDC ingestion (Kafka → Hudi), near-real-time (sub-5-min latency), many small updates
- Used by: Uber, Twitter (originally)
- **When to choose**: High-frequency streaming upserts, record-level CDC targets, sub-minute data freshness requirements

**Databricks positioning**:
- Databricks recommends Delta Lake for its platform (deepest integration)
- Supports Iceberg via native Iceberg support + UniForm (Delta as Iceberg)
- Supports Hudi via connectors
- Multi-format lakehouse: one Delta table, readable as Iceberg externally — no format silos`,
code:`-- Delta Lake UniForm: Delta table readable as Iceberg
CREATE TABLE delta_iceberg_table (id BIGINT, name STRING, ts TIMESTAMP)
TBLPROPERTIES (
  'delta.universalFormat.enabledFormats' = 'iceberg'
);
-- Now readable by Trino/Athena/BigQuery as Iceberg!

-- Iceberg table in Databricks (native support)
CREATE TABLE iceberg_flights (
  flight_id BIGINT, carrier STRING, flight_date DATE
)
USING iceberg
PARTITIONED BY (days(flight_date));  -- Hidden partitioning: partition by day of date

-- Hudi table in Databricks
df.write.format("hudi") \
    .options(**{
        "hoodie.table.name": "flight_events",
        "hoodie.datasource.write.recordkey.field": "flight_id",
        "hoodie.datasource.write.precombine.field": "updated_at",
        "hoodie.datasource.write.operation": "upsert",
        "hoodie.datasource.write.table.type": "COPY_ON_WRITE"
    }) \
    .mode("append") \
    .save("s3://bucket/hudi/flight_events")`,
tags:['Delta Lake','Apache Iceberg','Apache Hudi','UniForm','Universal Format','Hidden Partitioning','COW','MOR','Multi-engine','Open Table Format']},

{q:'What are Delta Lake generated columns and table constraints? How do you use them for data quality at the storage layer?',diff:'pr',
simple:`Generated columns: Columns whose value is automatically computed from other columns (like a virtual computed column that's also physically stored and can be indexed/used for partition pruning).

Table constraints: SQL CHECK constraints and NOT NULL constraints enforced at write time on Delta tables — reject rows that violate the rule before they're written.`,
detailed:`**Generated Columns**:
- Defined at table creation: flight_month DATE GENERATED ALWAYS AS (DATE_TRUNC('MONTH', departure_time))
- Physically stored in Parquet (not virtual) — can be partitioned, indexed, Z-ordered
- Automatically populated on INSERT (you don't specify them in INSERT)
- Key use: Partition by a derived value without requiring the writer to compute it
- Example: Partition by flight_month derived from departure_timestamp — writers don't need to know the partition key

**Generated column for partitioning**:
\`\`\`sql
CREATE TABLE flights (
    flight_id BIGINT,
    departure_time TIMESTAMP,
    flight_date DATE GENERATED ALWAYS AS (CAST(departure_time AS DATE)),
    flight_month STRING GENERATED ALWAYS AS (DATE_FORMAT(departure_time, 'yyyyMM'))
)
PARTITIONED BY (flight_month);
-- Partition pruning works automatically on flight_month queries
\`\`\`

**Delta Table Constraints**:

NOT NULL constraint:
ALTER TABLE flights ALTER COLUMN flight_id SET NOT NULL;
→ Rejects any INSERT with NULL flight_id

CHECK constraint:
ALTER TABLE flights ADD CONSTRAINT valid_delay CHECK (delay_minutes >= -60 AND delay_minutes <= 1440);
→ Rejects any INSERT/UPDATE where delay is out of range

Foreign key (declared, not enforced):
ALTER TABLE fact_flights ADD CONSTRAINT fk_carrier FOREIGN KEY (carrier_code) REFERENCES dim_carrier(code);
→ Informational only in Delta — optimizer can use for query planning, not enforced at write time

**Constraints vs DLT Expectations**:
- Delta constraints: enforced at write time for ALL writes (direct INSERT, MERGE, streaming write)
- DLT Expectations: enforced only within DLT pipelines, more configurable (drop vs fail vs warn)
- Use both: Delta constraints for hard invariants (never null FK), DLT Expectations for quality monitoring`,
code:`-- Generated columns + partitioning
CREATE TABLE IF NOT EXISTS silver.flights (
    flight_id     BIGINT NOT NULL,
    departure_time TIMESTAMP,
    carrier_code  STRING,
    delay_minutes INT,
    -- Generated column: partition key derived automatically
    flight_date   DATE     GENERATED ALWAYS AS (CAST(departure_time AS DATE)),
    flight_month  STRING   GENERATED ALWAYS AS (DATE_FORMAT(departure_time, 'yyyyMM'))
)
USING DELTA
PARTITIONED BY (flight_month)  -- Partition on generated column!
TBLPROPERTIES (
    'delta.enableChangeDataFeed' = 'true',
    'delta.autoOptimize.optimizeWrite' = 'true'
);

-- Insert doesn't need to specify generated columns
INSERT INTO silver.flights (flight_id, departure_time, carrier_code, delay_minutes)
VALUES (1, '2024-06-11 14:30:00', 'AC', 45);
-- flight_date and flight_month auto-populated

-- Table constraints: hard data quality at storage layer
ALTER TABLE silver.flights
ADD CONSTRAINT valid_carrier CHECK (carrier_code RLIKE '^[A-Z0-9]{2}$');

ALTER TABLE silver.flights
ADD CONSTRAINT valid_delay CHECK (delay_minutes BETWEEN -60 AND 1440);

ALTER TABLE silver.flights
ALTER COLUMN carrier_code SET NOT NULL;

-- View all constraints
DESCRIBE DETAIL silver.flights;
-- or:
SHOW CREATE TABLE silver.flights;`,
tags:['Generated Columns','Table Constraints','CHECK Constraint','NOT NULL','Partition Pruning','Delta Lake','Data Quality','DLT Expectations','Foreign Key']},

{q:'What is Delta Lake CLONE? Explain shallow vs deep clone and their use cases.',diff:'sr',
simple:`CLONE creates a copy of a Delta table. Two types:

• Shallow clone: Creates new Delta log entries pointing to the SAME underlying Parquet files as the source — instant, zero storage overhead. Modifications to the clone write NEW files; source table unchanged.
• Deep clone: Full copy of both Delta log AND all Parquet data files. Completely independent — changes to source don't affect clone and vice versa.`,
detailed:`**Shallow Clone**:
- Instant: Only copies Delta log metadata (JSON commit files), no Parquet file copying
- Storage: Zero additional storage initially; new storage consumed only on writes to clone
- Dependency: Clone still references source table's Parquet files
- Risk: If source runs VACUUM and deletes files the clone still references → clone breaks
- Use cases:
  - Dev/test environments: instant DEV replica of production table
  - Pre-migration testing: clone table, test schema migration on clone, verify, then apply to production
  - Zero-copy branching: experiment with different transformations without extra storage cost
  - Blue/green deployment: clone Silver → transform → swap pointer

**Deep Clone**:
- Full copy: Both Delta log + all Parquet data files are copied
- Time: Takes same time as a full table read + write
- Storage: Full duplication (2× storage cost)
- Independent: No dependency on source; VACUUM on source doesn't affect clone
- Preserves: Table history, constraints, properties, TBLPROPERTIES, column metadata
- Use cases:
  - Disaster recovery / backup: true independent copy
  - Cross-region replication: clone table to DR region
  - Long-lived dev environments: dev env that won't break when prod VACUUM runs
  - Archiving: deep clone before major restructuring

**Incremental deep clone**:
- Run CREATE TABLE deep_clone CLONE source LOCATION 'path' repeatedly
- On second run: only copies NEW files added since last clone (incremental copy)
- Efficient ongoing replication without full re-copy each run`,
code:`-- Shallow clone: instant, zero-copy
CREATE TABLE dev.silver.flights_dev
SHALLOW CLONE prod.silver.flights;
-- Done in milliseconds regardless of table size

-- Deep clone: full independent copy
CREATE TABLE dr.silver.flights_backup
DEEP CLONE prod.silver.flights
LOCATION 'abfss://dr-storage@account.dfs.core.windows.net/silver/flights';

-- Incremental deep clone (run regularly for ongoing sync)
CREATE OR REPLACE TABLE dr.silver.flights_backup
DEEP CLONE prod.silver.flights;
-- Only copies new/changed Parquet files since last clone

-- Clone for pre-migration testing workflow
-- 1. Shallow clone production
CREATE TABLE dev.silver.flights_test
SHALLOW CLONE prod.silver.flights;

-- 2. Test schema migration on clone
ALTER TABLE dev.silver.flights_test ADD COLUMN new_feature_flag BOOLEAN;
UPDATE dev.silver.flights_test SET new_feature_flag = (delay_minutes > 180);

-- 3. Validate results
SELECT * FROM dev.silver.flights_test WHERE new_feature_flag = TRUE LIMIT 10;

-- 4. Apply to production (confident migration)
ALTER TABLE prod.silver.flights ADD COLUMN new_feature_flag BOOLEAN;

-- Python: clone via DeltaTable API
from delta.tables import DeltaTable
DeltaTable.forName(spark, "prod.silver.flights") \
    .clone("abfss://dev@storage.dfs.core.windows.net/silver/flights_test",
           isShallow=True, replace=False)`,

{id:'spark',icon:'⚡',label:'Spark Core',desc:'RDDs, DataFrames, DAG, lazy evaluation, actions',qs:[
{q:'Explain Spark\'s core abstractions: RDD, DataFrame, Dataset. What are the trade-offs between them?',diff:'sr',
simple:`Three generations of Spark's data abstractions:

• RDD (Resilient Distributed Dataset): The original Spark abstraction. Distributed collection of objects. Full control but no optimizations. Strongly typed in Scala.
• DataFrame: Distributed table with named columns and schema. SQL-like API. Optimizer (Catalyst) can optimize queries. Python/Scala/Java/R.
• Dataset: Type-safe DataFrame (Scala/Java only). Compile-time type checking + Catalyst optimizations. Best of both worlds — but only in JVM languages.`,
detailed:`**RDD (Resilient Distributed Dataset)**:
- Low-level: distributed collection of any JVM objects
- Type-safe (Scala): RDD[Flight] gives compile-time type checking
- No schema: optimizer can't reason about structure
- No Catalyst optimization: what you write is literally what Spark executes
- Use cases: Complex custom transformations, ML algorithm implementations, working with unstructured data
- Avoid in 2024: Almost never the right choice for new code (DataFrame/Dataset are better)

**DataFrame**:
- Distributed table: named columns + schema (Row objects internally)
- Catalyst optimizer: automatically optimizes query plan (predicate pushdown, join reordering, projection pruning)
- Tungsten: Binary memory format + code generation = no JVM garbage collection overhead
- Language-agnostic: same API in Python (PySpark), Scala, Java, R
- Python pitfall: Python UDFs break Catalyst optimization (data crosses JVM→Python bridge)
- Use for: 95% of data engineering work

**Dataset** (Scala/Java only):
- Type-safe DataFrame: Dataset[Flight] vs DataFrame (untyped Row)
- Compile-time error catching: df.select("flighdt_numbr") → runtime error; ds.map(_.flightNumber) → compile error
- Full Catalyst + Tungsten optimization (unlike RDD)
- Python doesn't have Dataset — Python DataFrames are equivalent to Java/Scala DataFrames
- Use for: Production Scala ETL pipelines where type safety reduces runtime errors

**Performance comparison**:
DataFrame ≈ Dataset (both use Catalyst) >> RDD (no optimization)
PySpark DataFrame with Python UDFs < Scala DataFrame (JVM bridge overhead)
PySpark DataFrame with built-in functions ≈ Scala DataFrame (Catalyst handles both)

**2024 best practices**:
- Use DataFrame (PySpark) for all data engineering
- Use Scala Dataset for type-critical production pipelines
- Use RDD only for custom ML algorithms or when schema is truly unknown
- Avoid Python UDFs → use built-in Spark functions or Pandas UDFs (vectorized)`,
code:`from pyspark.sql import functions as F
from pyspark.sql.types import *

# DataFrame: most common, Catalyst-optimized
df = spark.table("bronze.flights")
result = (df
    .filter(F.col("status") == "DELAYED")
    .groupBy("carrier_code")
    .agg(
        F.avg("delay_minutes").alias("avg_delay"),
        F.count("*").alias("flight_count")
    )
    .orderBy(F.desc("avg_delay")))

# Python UDF: AVOID for performance (breaks optimization)
# BAD:
from pyspark.sql.functions import udf
@udf(returnType=StringType())
def slow_udf(val):
    return val.upper()  # Data crosses JVM->Python border per row

# GOOD: Built-in Spark function (stays in JVM, Catalyst-optimized)
result = df.withColumn("carrier_upper", F.upper(F.col("carrier_code")))

# GOOD: Pandas UDF (vectorized, uses Apache Arrow, much faster than scalar UDF)
from pyspark.sql.functions import pandas_udf
import pandas as pd

@pandas_udf(StringType())
def fast_pandas_udf(s: pd.Series) -> pd.Series:
    return s.str.upper()  # Vectorized over batch of rows`,
tags:['RDD','DataFrame','Dataset','Catalyst Optimizer','Tungsten','Python UDF','Pandas UDF','PySpark','Scala','Lazy Evaluation']},

{q:'Explain Spark\'s lazy evaluation and the DAG. What are transformations vs actions?',diff:'sr',
simple:`Lazy evaluation: Spark doesn't execute anything when you call transformation functions (filter, select, join, groupBy). Instead, it builds a logical plan (DAG). Execution only happens when you call an ACTION (show, collect, write, count).

This allows Spark's Catalyst optimizer to see the FULL computation plan before executing and optimize it (reorder operations, push filters, eliminate unnecessary steps).`,
detailed:`**Transformations** (lazy — build the plan, don't execute):
- Narrow transformations: Each partition in output depends on exactly one partition in input. No data movement. Fast.
  - filter, map, select, withColumn, union
- Wide transformations (shuffles): Each output partition may depend on ALL input partitions. Requires network data transfer across nodes. Expensive.
  - groupBy, join, distinct, repartition, orderBy, pivot

**Actions** (eager — trigger execution, return result):
- collect(), show(), count(), take(n)
- write.save(), write.format("delta").saveAsTable()
- foreach(), foreachPartition()

**DAG (Directed Acyclic Graph)**:
- Spark builds a DAG of transformations
- DAG has Stages (separated by shuffle boundaries)
- Each Stage has Tasks (one per partition)
- Tasks = the actual work units executed on executors

**Why lazy evaluation matters**:
1. **Predicate pushdown**: Spark sees the filter BEFORE reading files. Pushes filter to the file scan — reads only matching rows (or skips entire files with Delta data skipping)
2. **Projection pruning**: Spark sees which columns are needed. Reads only those columns from Parquet (columnar benefit)
3. **Join optimization**: AQE can reorder joins based on actual runtime statistics
4. **Pipelining**: Multiple narrow transformations in the same stage — no unnecessary materializations

**Common mistake**: Calling collect() inside a loop — triggers a separate Spark job per iteration, killing performance. Cache the result first or restructure the logic.

**Spark UI** — understanding the DAG in production:
- Stages view: identifies where shuffles happen
- Task metrics: shows skew (one task much slower than others)
- SQL plan: visual DAG with estimated rows at each step`,
code:`# Transformations (LAZY - nothing runs yet)
df = spark.table("bronze.flights")           # Lazy: just creates logical plan
filtered = df.filter(df.delay_min > 0)       # Lazy: adds filter to plan
grouped = filtered.groupBy("carrier")        # Lazy: adds groupBy (shuffle boundary)
result = grouped.agg({"delay_min": "avg"})   # Lazy: adds aggregation

# Nothing has run yet! Catalyst has seen the full plan and optimized it.

# ACTION: triggers actual execution
result.show()    # NOW the Spark job runs
# or
result.write.format("delta").saveAsTable("gold.carrier_delays")

# Catalyst optimization in action:
# You write:  df.select("a","b").filter("a > 5").select("a")
# Catalyst executes: filter("a > 5").select("a")  → pushed filter first, pruned "b"

# Check the logical and physical plan
result.explain(extended=True)
# Shows: Parsed → Analyzed → Optimized → Physical Plan

# View DAG in Spark UI
# spark.sparkContext.uiWebUrl → open in browser
# Jobs → Stages → DAG visualization`,
tags:['Lazy Evaluation','DAG','Transformations','Actions','Narrow Transformation','Wide Transformation','Shuffle','Catalyst','Predicate Pushdown','Spark UI']},

{q:'What is a Spark shuffle? Why is it expensive and how do you minimize it?',diff:'pr',
simple:`A shuffle redistributes all data across the network between Spark stages. Every row must be sent from where it currently lives to where it needs to be based on a key (e.g., for a groupBy or join).

Shuffles are expensive because: they require writing data to disk, transferring over the network, and reading again on the other side — often the biggest bottleneck in Spark jobs.`,
detailed:`**When shuffles happen**:
- groupBy / agg: All rows with the same key must go to the same partition
- join: All rows with the same join key must be co-located
- distinct: All rows must be checked globally for duplicates
- repartition: Data explicitly redistributed
- orderBy: Global sort requires all data in one reducer (use sortWithinPartitions for local sort)

**Shuffle mechanics**:
1. Map phase: Each task reads its partition, applies transformation, writes output grouped by target partition key to local disk (shuffle write)
2. Network transfer: Each subsequent stage task fetches its partition from all previous stage tasks (shuffle read)
3. Reduce phase: Task processes the received data

**Why shuffles kill performance**:
- Disk I/O: Shuffle writes to disk (not memory) — I/O bottleneck
- Network transfer: Can be GBs of data moving across nodes
- Memory pressure: Shuffle buffers compete with task memory
- Skew: If one key has 10M rows and others have 100 — one task takes 100× longer

**Strategies to minimize shuffles**:

1. **Broadcast join** (most impactful): If one table < broadcast threshold (default 10 MB), Databricks sends it to all executors — no shuffle needed. Turns a Sort Merge Join into a Broadcast Hash Join. Huge speedup.

2. **Filter before join/groupBy**: Reduce data volume entering the shuffle — push filters as early as possible.

3. **Reduce partition count**: spark.sql.shuffle.partitions (default 200) — too many small partitions = overhead; too few = OOM. AQE tunes this automatically.

4. **Pre-partitioned data**: If data is already partitioned by the join/group key (Delta Z-ordered), reduce shuffle volume.

5. **Salting for skewed joins**: Add random prefix to skewed keys to distribute load across more tasks.

6. **Avoid unnecessary distinct**: Use COUNT(DISTINCT) alternatives (approx_count_distinct or HyperLogLog) when exactness not needed.`,
code:`from pyspark.sql import functions as F

# SHUFFLE-HEAVY: Large join without broadcast
flights_df.join(airports_df, "airport_code")  # Sort merge join if airports is large

# SHUFFLE-FREE: Broadcast join (airports < 10MB)
from pyspark.sql.functions import broadcast
flights_df.join(broadcast(airports_df), "airport_code")  # No shuffle!

# Force broadcast threshold
spark.conf.set("spark.sql.autoBroadcastJoinThreshold", "50m")  # 50MB threshold

# Check join strategy in query plan
flights_df.join(broadcast(airports_df), "airport_code").explain()
# Look for: BroadcastHashJoin vs SortMergeJoin

# Fix skewed join (salting)
# Problem: carrier_code "WS" has 80% of all flights
salt_count = 10
flights_salted = flights_df.withColumn("salt", (F.rand() * salt_count).cast("int")) \
    .withColumn("carrier_salt", F.concat("carrier_code", F.lit("_"), "salt"))

delays_salted = delays_df.crossJoin(
    spark.range(salt_count).withColumnRenamed("id","salt")
).withColumn("carrier_salt", F.concat("carrier_code", F.lit("_"), "salt"))

result = flights_salted.join(delays_salted, "carrier_salt")

# AQE: Adaptive Query Execution (auto-tune shuffle partitions)
spark.conf.set("spark.sql.adaptive.enabled", "true")
spark.conf.set("spark.sql.adaptive.coalescePartitions.enabled", "true")`,
tags:['Shuffle','Broadcast Join','Skew','Salting','AQE','spark.sql.shuffle.partitions','Sort Merge Join','Broadcast Hash Join','Performance']},

{q:'What is Adaptive Query Execution (AQE)? What problems does it solve in Databricks?',diff:'pr',
simple:`AQE is a Spark 3.0+ feature (always on in Databricks) that re-optimizes query plans at RUNTIME based on actual data statistics collected during execution — rather than relying only on pre-execution estimates.

It solves three main problems:
1. Automatically coalesces too-many small shuffle partitions
2. Converts Sort Merge Joins to Broadcast Joins when one side turns out small
3. Handles skewed partitions by splitting large ones`,
detailed:`**Why static optimization falls short**:
- Catalyst optimizer builds a physical plan BEFORE any data is read
- Estimates based on table statistics (which may be stale or missing)
- Result: planned for 1M rows, actual is 100M → wrong join strategy, wrong partition count

**AQE optimization features**:

**1. Coalescing shuffle partitions**:
- Default: 200 shuffle partitions (or spark.sql.shuffle.partitions value)
- After shuffle: AQE measures actual partition sizes and merges small ones
- Example: 200 partitions, most are 1MB each → AQE merges into 20 partitions of 10MB → fewer tasks, less overhead

**2. Dynamic Join Conversion (Join Strategy Switch)**:
- At join time: AQE checks actual size of build side
- If smaller than broadcastThreshold → converts Sort Merge Join to Broadcast Hash Join at runtime
- Even if the optimizer initially chose SMJ due to missing statistics

**3. Skew Join Optimization**:
- Detects skewed partitions at runtime (one partition much larger than median)
- Automatically splits skewed partitions + replicates the matching side
- Handles data skew without manual salting

**AQE configuration** (Databricks defaults: all enabled):
- spark.sql.adaptive.enabled = true
- spark.sql.adaptive.coalescePartitions.enabled = true
- spark.sql.adaptive.skewJoin.enabled = true
- spark.sql.adaptive.skewJoin.skewedPartitionFactor = 5 (5× median = skewed)

**Databricks-specific AQE extensions**:
Databricks adds additional runtime optimizations beyond open-source Spark AQE:
- Bloom filter joins: Runtime bloom filter for semi-join conditions
- Dynamic file pruning: Propagate filter from dimension table to fact table scan at runtime (like DPP)
- Predictive I/O: Pre-fetch data into cache based on query patterns`,
code:`# AQE is on by default in Databricks -- verify
print(spark.conf.get("spark.sql.adaptive.enabled"))  # "true"

# Fine-tune AQE settings for your workload
spark.conf.set("spark.sql.adaptive.coalescePartitions.minPartitionSize", "64m")
spark.conf.set("spark.sql.adaptive.skewJoin.skewedPartitionFactor", "5")
spark.conf.set("spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes", "256m")

# Verify AQE is working in EXPLAIN output
(spark.table("fact_flights")
    .join(spark.table("dim_carrier"), "carrier_code")
    .groupBy("carrier_name")
    .agg(F.avg("delay_minutes"))
    .explain())
# Look for: AdaptiveSparkPlan isFinalPlan=false → plan will adapt at runtime

# Observe AQE in Spark UI:
# SQL tab → click a query → "AQE" badge shows runtime plan vs original plan
# Stage details show "Skew" tasks being split

# For extreme skew AQE can't handle: manual salting still needed
# But try AQE first before manual salting`,
tags:['AQE','Adaptive Query Execution','Skew Join','Coalesce Partitions','Dynamic Join Strategy','Spark 3.0','Broadcast Join','Runtime Optimization']},

{q:'Explain Spark caching and persistence. What storage levels exist and when do you cache?',diff:'sr',
simple:`Spark caching stores a DataFrame/RDD in memory (or disk) across multiple actions on the same data — avoiding re-reading and re-computing from scratch each time.

cache() = persist(StorageLevel.MEMORY_AND_DISK)
persist() = explicitly choose the storage level

Cache when: the same DataFrame is used 2+ times, re-computation is expensive (complex transformations, large joins), and it fits in executor memory.`,
detailed:`**Storage levels** (persist options):
- MEMORY_ONLY: Store deserialized JVM objects. Fastest access, highest memory use. Evicts if doesn't fit.
- MEMORY_AND_DISK: Overflows to disk when memory full. Default for cache().
- MEMORY_ONLY_SER: Serialized (compact). Lower memory use, slower access (deserialize each read).
- MEMORY_AND_DISK_SER: Serialized + disk overflow. Good balance.
- DISK_ONLY: Never in memory. Slow but guaranteed to not OOM.
- MEMORY_ONLY_2, MEMORY_AND_DISK_2: Replicates cached data to 2 nodes — faster recovery from node failure.

**When to cache**:
✅ Iterative ML algorithms: Same DataFrame read 50+ times during gradient descent
✅ Multiple aggregations on same filtered DataFrame
✅ Complex join result used in 2+ downstream steps
✅ Debugging/exploration: cache intermediate result to explore without recomputing

**When NOT to cache**:
❌ Data too large for executor memory → eviction overhead worse than recomputation
❌ Data used only once — cache overhead with no benefit
❌ Streaming DataFrames — automatically managed by checkpointing
❌ Data read from Delta on Databricks — often cheaper to re-scan from Delta with file caching

**Databricks disk caching** (separate from Spark cache):
- Databricks Runtime caches Delta Parquet files on local SSD of executors
- Transparent: no code change needed — enabled by default on supported instance types
- Different from Spark cache(): this caches the RAW files, not computed DataFrames
- Significantly faster re-reads (SSD vs S3 latency)

**Cache invalidation**:
- df.unpersist() — explicitly remove from cache
- Spark auto-evicts when cache is full (LRU)
- Cluster restart: all cache lost
- Databricks disk cache: persists across Spark jobs but not cluster restarts`,
code:`from pyspark import StorageLevel

# Cache (MEMORY_AND_DISK)
flight_df = (spark.table("bronze.flights")
    .filter(F.col("year") == 2024)
    .join(spark.table("dim_airport"), "airport_code"))

flight_df.cache()       # Lazy: cached on first action
flight_df.count()       # First action: materializes and stores in cache

# Now multiple operations reuse the cache (no recomputation)
flight_df.groupBy("carrier").agg(F.avg("delay_min")).show()
flight_df.filter(F.col("status") == "CANCELLED").count()

# Explicit storage level for large data
flight_df.persist(StorageLevel.MEMORY_AND_DISK_SER)  # Serialized saves memory

# Always unpersist when done
flight_df.unpersist()

# Check what's cached
spark.catalog.isCached("bronze.flights")
# Or in Spark UI: Storage tab shows all cached DataFrames

# Databricks disk caching (transparent, no code needed)
# Enable in cluster config:
# spark.databricks.io.cache.enabled = true
# spark.databricks.io.cache.maxDiskUsage = 200g`,
tags:['Caching','persist()','cache()','StorageLevel','Databricks Disk Cache','Memory Management','Unpersist','Iterative ML']},

{q:'What are Spark executors, tasks, stages, and jobs? Walk through how a simple query executes.',diff:'sr',
simple:`When you run a Spark action (like .count()), Spark creates a Job. The job is divided into Stages (separated by shuffles). Each stage has Tasks (one per input partition). Tasks run on Executors (JVM processes on worker nodes).

A cluster with 4 workers × 4 cores = 16 parallel tasks at once. More partitions than cores = tasks queue up; fewer partitions = some cores idle.`,
detailed:`**Execution hierarchy**:
- **Application**: Your Spark program (one SparkSession)
- **Job**: Triggered by each action (count, show, write). One query = one job.
- **Stage**: A set of transformations with no shuffle between them. Stage boundary = shuffle required.
- **Task**: One unit of parallel work = one stage processing one partition. Tasks are assigned to executor cores.
- **Executor**: JVM process on a worker node. Has N cores (configurable). Runs N tasks in parallel.
- **Driver**: Orchestrates everything — creates DAG, schedules stages/tasks, collects results.

**Example: groupBy → count** (two stages):

Stage 1 (Map):
- Each task reads one input partition
- Applies filter + partial groupBy
- Writes shuffle output to local disk (partitioned by group key)

Shuffle: Network transfer — each Stage 2 task reads its group from ALL Stage 1 outputs

Stage 2 (Reduce):
- Each task reads one shuffle partition (all rows for its keys)
- Computes final aggregate (count, sum, etc.)
- Returns to driver on collect() or writes to storage on write()

**Executor memory layout**:
- spark.executor.memory (e.g., 16g): JVM heap
  - Execution memory (60% × 60%): shuffle buffers, sort/hash operations
  - Storage memory (60% × 40%): cached DataFrames
  - User memory (40%): UDF objects, Python data, broadcast vars
- spark.executor.memoryOverhead (e.g., 4g): Off-heap (JVM overhead, native code)

**Core-to-task relationship**:
- spark.executor.cores: How many tasks one executor can run in parallel
- Default: 4 cores per executor
- CPU-bound work: match cores to physical CPU cores
- I/O-bound work: can over-provision (more tasks than cores) for I/O parallelism

**Speculative execution**: If a task runs 1.5× longer than median → Spark launches a duplicate task on another executor. First to finish wins. Disabled by default, enable for long-running production jobs.`,
code:`# Understand job execution via Spark UI
# 1. Run a query
result = (spark.table("silver.flights")
    .filter(F.col("carrier") == "AC")      # Stage 1: filter (narrow)
    .groupBy("flight_date")                  # Stage boundary: shuffle
    .agg(F.avg("delay_min").alias("avg")))   # Stage 2: aggregate

result.explain()  # Shows physical plan with stages

# 2. Check execution
# Spark UI → Jobs → click job → Stages tab
# Stage 1: N tasks = N input partitions
# Stage 2: M tasks = spark.sql.shuffle.partitions (default 200)

# Tune executor resources
spark.conf.set("spark.executor.cores", "4")
spark.conf.set("spark.executor.memory", "16g")
spark.conf.set("spark.executor.memoryOverhead", "4g")

# Enable speculative execution (for production jobs with skew risk)
spark.conf.set("spark.speculation", "true")
spark.conf.set("spark.speculation.multiplier", "1.5")   # 1.5× median = slow task
spark.conf.set("spark.speculation.quantile", "0.9")     # 90% tasks done before speculating

# Visualize DAG
# In notebook: display the query plan
result.explain(extended=True)
# Or: open Spark UI at spark.sparkContext.uiWebUrl`,
tags:['Spark Execution Model','Executors','Tasks','Stages','Jobs','Driver','Shuffle','Memory Layout','Speculative Execution','Spark UI','Cores']},

{q:'What is shuffle spill in Spark? How do you detect and prevent it?',diff:'pr',
simple:`Shuffle spill happens when Spark doesn't have enough executor memory to hold all the shuffle data in memory — it writes the overflow to disk (spill to disk). This dramatically slows performance because disk I/O is 100-1000× slower than memory.

You'll see it in Spark UI under "Shuffle Spill (Memory)" and "Shuffle Spill (Disk)" in the stage metrics.`,
detailed:`**Why spill happens**:
- Each shuffle task needs memory to sort/hash its output partition before sending
- spark.executor.memory is divided: execution memory (shuffle buffers) + storage memory (cache) + user memory
- When execution memory fills: Spark serializes and writes sorted shuffle data to local disk (spill)
- After spilling: reads it back from disk to merge with remaining data

**Spill phases**:
1. Map spill: During shuffle write — partial sort outputs spilled
2. Merge spill: During shuffle read — merging multiple spilled runs

**Detection in Spark UI**:
Stage details → Tasks → "Shuffle Spill (Memory)" column: amount of data that triggered spill
"Shuffle Spill (Disk)" column: amount written to disk

Large values = memory insufficient for your shuffle size

**Causes and fixes**:

**Cause 1: Too few shuffle partitions (large partitions)**:
- Default 200 shuffle partitions for a 100GB shuffle = 500MB per partition = likely spill
- Fix: Increase spark.sql.shuffle.partitions; let AQE auto-tune

**Cause 2: Data skew (one partition huge)**:
- One task gets 10GB while others get 10MB
- Fix: AQE skew join handling; manual salting for extreme skew

**Cause 3: Insufficient executor memory**:
- Fix: Increase spark.executor.memory; reduce tasks per executor (fewer concurrent shuffles)

**Cause 4: Large cached DataFrames eating execution memory**:
- Cache taking space → execution memory reduced → shuffle spills
- Fix: Unpersist unused caches; use MEMORY_AND_DISK_SER to compress cache

**Photon advantage**: Photon's shuffle implementation is more memory-efficient — less spill at the same memory allocation. SQL queries on Photon nodes experience less spill.`,
code:`# Detect spill: check stage metrics programmatically
# (or view in Spark UI: Stages tab → Task Metrics columns)

# Python: access SparkContext metrics
sc = spark.sparkContext
status = sc.statusTracker()
for job_id in status.getJobIdsForGroup():
    for stage_id in status.getJobInfo(job_id).stageIds:
        info = status.getStageInfo(stage_id)
        if info:
            print(f"Stage {stage_id}: "
                  f"spill_mem={info.memoryBytesSpilled/(1024**3):.2f}GB "
                  f"spill_disk={info.diskBytesSpilled/(1024**3):.2f}GB")

# Fix 1: Increase shuffle partitions (more, smaller partitions)
spark.conf.set("spark.sql.shuffle.partitions", "800")   # For large data

# Fix 2: Increase execution memory fraction
spark.conf.set("spark.memory.fraction", "0.8")           # 80% for execution+storage
spark.conf.set("spark.memory.storageFraction", "0.3")    # Less for storage, more for execution

# Fix 3: Reduce concurrent tasks per executor (less competition for memory)
spark.conf.set("spark.executor.cores", "2")   # 2 cores = 2 concurrent tasks = more memory each

# Fix 4: Enable off-heap memory for shuffle
spark.conf.set("spark.memory.offHeap.enabled", "true")
spark.conf.set("spark.memory.offHeap.size", "4g")    # Additional off-heap buffer

# Fix 5: Repartition to reduce per-partition size before shuffle
df_balanced = df.repartition(400, "carrier_code")  # Even distribution before groupBy`,
tags:['Shuffle Spill','Memory Spill','Disk Spill','Execution Memory','Spark UI','AQE','Data Skew','shuffle.partitions','Off-heap','Photon']},

{q:'What is data skew in Spark and what are all the strategies to fix it?',diff:'pr',
simple:`Data skew: when data is unevenly distributed across partitions — one partition has 10M rows while others have 1K. The skewed task becomes a bottleneck: all other tasks finish and the cluster sits idle waiting for the one giant task.

Detection: Spark UI → Stages → Tasks → sort by "Duration" descending — one task far slower than median = skew.`,
detailed:`**Root causes of skew**:
- Join on a high-frequency key (e.g., carrier_code = "AC" appears in 80% of rows)
- groupBy on low-cardinality column with imbalanced groups
- Null keys: all NULLs hash to the same partition (hash(null) = 0)
- Hot date partition: today's data always in one partition during ingestion

**Strategy 1 — AQE Skew Join (easiest, automatic)**:
- Enable: spark.sql.adaptive.skewJoin.enabled = true (on by default in Databricks)
- AQE detects skewed partitions at runtime: any partition 5× larger than median AND > 256MB
- Automatically splits the skewed partition into sub-partitions + replicates matching side
- No code change needed — always try this first

**Strategy 2 — Salting (manual, for extreme skew)**:
- Add a random "salt" integer (0-N) to the skewed key
- Explode the other side by cross-joining with salt values 0-N
- Join on (key + salt) instead of just (key)
- Distributes one hot key across N tasks
- Cost: N× data on the smaller side; more total tasks

**Strategy 3 — Broadcast join (if one side < threshold)**:
- If the skewed side can be broadcast → no shuffle needed → no skew possible
- Raise spark.sql.autoBroadcastJoinThreshold for slightly larger tables

**Strategy 4 — Isolation of hot keys**:
- Process hot keys separately (e.g., carrier "AC") with a broadcast join
- Process non-hot keys with a regular sort-merge join
- Union results
- More complex but most targeted

**Strategy 5 — Null-key handling**:
- Filter out NULL join keys before joining (they'll never match anyway)
- Or: add a random suffix to NULLs before join to distribute them`,
code:`from pyspark.sql import functions as F

# STRATEGY 1: AQE Skew Join (automatic, no code change)
spark.conf.set("spark.sql.adaptive.skewJoin.enabled", "true")
spark.conf.set("spark.sql.adaptive.skewJoin.skewedPartitionFactor", "5")
spark.conf.set("spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes", "256m")

# STRATEGY 2: Salting for extreme skew
SALT_FACTOR = 20   # Spread across 20 sub-partitions

# Salt the large (skewed) side
large_salted = (large_df
    .withColumn("salt", (F.rand() * SALT_FACTOR).cast("int"))
    .withColumn("join_key_salted",
                F.concat(F.col("carrier_code"), F.lit("_"), F.col("salt"))))

# Explode the small side to match all salt values
small_exploded = (small_df
    .crossJoin(spark.range(SALT_FACTOR).withColumnRenamed("id", "salt"))
    .withColumn("join_key_salted",
                F.concat(F.col("carrier_code"), F.lit("_"), F.col("salt"))))

# Join on salted key
result = large_salted.join(small_exploded, "join_key_salted")

# STRATEGY 3: Isolate hot keys
hot_keys = ["AC", "WS"]  # Known skewed keys

hot_df    = large_df.filter(F.col("carrier_code").isin(hot_keys))
normal_df = large_df.filter(~F.col("carrier_code").isin(hot_keys))

hot_result    = hot_df.join(broadcast(lookup_df), "carrier_code")  # Broadcast for hot
normal_result = normal_df.join(lookup_df, "carrier_code")          # Regular for others
result = hot_result.union(normal_result)

# DETECT skew: check partition size distribution
df.groupBy(F.spark_partition_id().alias("partition_id")).count() \
    .orderBy(F.desc("count")).show(20)`,
