{q:'What is Delta Sharing? How do you share data between organizations without copying it?',diff:'pr',
simple:`Delta Sharing is an open protocol for sharing live Delta tables with external recipients — without copying the data. The recipient reads directly from the data source's cloud storage (with time-limited signed URLs). No ETL, no data movement, no proprietary format needed.

Use cases: Share airline disruption data with Transport Canada regulators; share loyalty data with partner airlines; expose data products to customers.`,
detailed:`**Delta Sharing architecture**:
- Share server: Databricks workspace hosts a sharing endpoint
- Provider: Creates a "share" (named collection of tables) + grants to recipients
- Recipient: Downloads a profile file (JSON with access token) → reads data directly from provider's S3/ADLS
- No data copying: Signed URLs generated per-request for Parquet files in provider's storage
- Open protocol: Any Delta Sharing-compatible client can read (not Databricks-only)

**Provider setup**:
\`\`\`sql
-- Create a share
CREATE SHARE airline_partner_share;
-- Add tables to share
ALTER SHARE airline_partner_share ADD TABLE prod.gold.flight_status;
ALTER SHARE airline_partner_share ADD TABLE prod.gold.delay_statistics;
-- Create recipient
CREATE RECIPIENT air_canada_partner COMMENT 'WestJet code-share partner';
-- Grant share to recipient
GRANT SELECT ON SHARE airline_partner_share TO RECIPIENT air_canada_partner;
\`\`\`

**Recipient consumption**:
\`\`\`python
# Recipient: reads shared data via Delta Sharing open-source client
import delta_sharing
client = delta_sharing.SharingClient("profile.share")
tables = client.list_all_tables()
df = delta_sharing.load_as_pandas("profile.share#airline_partner_share.flight_status")
\`\`\`

**Databricks-to-Databricks sharing** (easiest):
- Recipient uses their own Databricks workspace
- Create RECIPIENT with metastore_id of recipient workspace
- Recipient sees shared tables in their Unity Catalog (read-only)
- Live access: always sees current data, no scheduled sync

**Security controls**:
- Table-level access (whole table or specific columns)
- Row-level filters on shared tables (share only rows where region = 'CA')
- Partition-level: share only specific partitions
- Token rotation: revoke and re-issue recipient tokens

**vs. traditional data sharing**:
| Method | Data Movement | Freshness | Format | Governance |
|---|---|---|---|---|
| Email CSV | Full copy | Stale | CSV | None |
| S3 bucket share | Full copy | Stale | Any | Minimal |
| Delta Sharing | Zero copy | Live | Open | Full UC |`,
code:`-- Provider: Share flight disruption data with Transport Canada (regulator)
-- Step 1: Create share
CREATE SHARE transport_canada_regulatory_share;

-- Step 2: Add tables with column-level filtering (hide PII)
ALTER SHARE transport_canada_regulatory_share
ADD TABLE prod.gold.appr_disruption_summary
  PARTITION (flight_date >= '2024-01-01')         -- Only 2024+ data
  COMMENT 'APPR-reportable flight disruptions for regulatory compliance';

-- Step 3: Add with column partitioning (exclude passenger PII)
ALTER SHARE transport_canada_regulatory_share
ADD TABLE prod.gold.flight_delay_stats
  COMMENT 'Aggregate delay statistics by carrier and route';

-- Step 4: Create recipient
CREATE RECIPIENT transport_canada
COMMENT 'Transport Canada APPR regulatory oversight';
-- Download activation link for recipient

-- Step 5: Grant
GRANT SELECT ON SHARE transport_canada_regulatory_share TO RECIPIENT transport_canada;

-- Monitor sharing activity
SELECT * FROM information_schema.shared_data_access_history
WHERE share_name = 'transport_canada_regulatory_share'
ORDER BY access_time DESC;

-- Recipient (Databricks workspace): access shared tables
-- After accepting the share in their UC:
SELECT * FROM transport_canada_metastore.transport_canada_regulatory_share.flight_delay_stats
WHERE flight_date >= '2024-06-01';`,
tags:['Delta Sharing','Data Sharing','Open Protocol','Zero Copy','Provider','Recipient','Cross-organization','Unity Catalog','Signed URLs','Regulatory Compliance']},

{q:'What are Unity Catalog system tables? How do you use them for governance and cost attribution?',diff:'pr',
simple:`Unity Catalog system tables are read-only Delta tables in the system catalog that Databricks automatically populates with audit logs, billing usage, compute metrics, and lineage data. Query them with SQL like any Delta table — no external tools needed.

Key tables: system.access.audit (who accessed what), system.billing.usage (DBU consumption), system.compute.clusters (cluster metadata), system.information_schema (table metadata).`,
detailed:`**System table categories**:

**Access audit** (system.access.audit):
- Every data access event: SELECT, INSERT, table create/drop, permission changes
- Fields: user_identity, action_name, service_name, request_params, event_time, source_ip
- Use for: GDPR/HIPAA compliance audits, security anomaly detection, access pattern analysis

**Billing & usage** (system.billing.usage):
- DBU consumption by SKU, cluster, workspace, tag
- Join with system.billing.list_prices for cost estimation
- Use for: cost attribution by team/project, budget forecasting, idle cluster detection

**Compute metadata** (system.compute.clusters):
- Cluster configurations, tags, owner, runtime version, instance types
- Use for: inventory of all clusters, policy compliance checking, cost tag validation

**Information schema** (system.information_schema):
- Standard SQL information_schema tables: columns, tables, views, routines
- Use for: programmatic schema discovery, data cataloguing, impact analysis

**Lineage** (system.access.table_lineage, system.access.column_lineage):
- Upstream/downstream table relationships captured from query execution
- Use for: impact analysis, GDPR data flow mapping

**Practical governance queries**:

1. Who accessed PII tables this week?
2. Which jobs are consuming the most DBUs?
3. Which clusters have no cost tags (compliance violation)?
4. Which tables have no owners assigned?
5. What tables did user X access before an incident?`,
code:`-- 1. PII access audit: who queried passenger data this week?
SELECT
    user_identity['email'] AS user_email,
    action_name,
    request_params['full_name_arg'] AS table_accessed,
    event_time,
    source_ip_address
FROM system.access.audit
WHERE service_name = 'unityCatalog'
  AND action_name IN ('getTable', 'runQuery')
  AND request_params['full_name_arg'] LIKE '%passengers%'
  AND event_time >= DATEADD(WEEK, -1, CURRENT_TIMESTAMP())
ORDER BY event_time DESC;

-- 2. Cost attribution by team tag (this month)
SELECT
    c.custom_tags['team']          AS team,
    c.custom_tags['project']       AS project,
    u.sku_name,
    SUM(u.usage_quantity)          AS total_dbus,
    SUM(u.usage_quantity * lp.default_unit_price) AS est_cost_usd
FROM system.billing.usage u
JOIN system.billing.list_prices lp ON u.sku_name = lp.sku_name
    AND lp.price_start_time = (
        SELECT MAX(price_start_time) FROM system.billing.list_prices
        WHERE sku_name = u.sku_name)
LEFT JOIN system.compute.clusters c ON u.cluster_id = c.cluster_id
WHERE u.usage_date >= DATE_TRUNC('MONTH', CURRENT_DATE())
GROUP BY 1, 2, 3
ORDER BY est_cost_usd DESC;

-- 3. Governance: find clusters missing required cost tags
SELECT cluster_id, cluster_name, creator_user_name, create_time
FROM system.compute.clusters
WHERE custom_tags['team'] IS NULL
   OR custom_tags['cost_center'] IS NULL
ORDER BY create_time DESC;

-- 4. Tables without owners (data stewardship gap)
SELECT table_catalog, table_schema, table_name, created_by
FROM system.information_schema.tables
WHERE table_schema NOT IN ('information_schema')
  AND table_catalog = 'prod'
ORDER BY table_schema, table_name;`,
tags:['System Tables','Unity Catalog','Audit Log','Billing Usage','Cost Attribution','GDPR','Compliance','Information Schema','Cluster Metadata','Governance Reporting']},

{q:'How do you implement data quality SLAs across a multi-team Databricks environment?',diff:'ar',
simple:`Data quality SLAs require: defined quality rules per table (expectations), automated testing (DLT Expectations + dbt tests), metric tracking over time (Lakehouse Monitoring), alerting on violations (Databricks alerts + PagerDuty), and accountability (data owners per table in Unity Catalog).

The key shift: move from reactive fire-fighting to proactive quality monitoring with SLO dashboards per data product.`,
detailed:`**Data quality SLA framework on Databricks**:

**Layer 1 — Define quality rules per table**:
DLT Expectations (for pipeline data):
- expect_or_drop: structural validity (no null IDs, valid carrier codes)
- expect: business metrics (delay within range, not-null soft constraints)
- expect_or_fail: critical invariants (duplicate primary keys)

dbt tests (for Gold/reporting layer):
- not_null, unique, accepted_values, relationships
- Custom tests: statistical bounds (revenue not > 3σ from rolling avg)
- dbt-expectations: additional test library

Great Expectations (for standalone validation):
- Checkpoint runs against any Delta table
- Result stored back to Delta for trending

**Layer 2 — Track quality metrics over time**:
- Lakehouse Monitoring: attach to every Silver/Gold table → automatically profiles distributions
- Custom quality Delta table: write expectation pass/fail rates per run per table
- KPIs: completeness %, validity %, freshness (minutes since last successful load)

**Layer 3 — Alerting**:
- Databricks SQL alerts: query quality Delta table → alert if pass_rate < threshold
- PagerDuty/Slack integration: critical table quality failure → page on-call engineer
- Freshness alerts: if table not updated in > 2× expected interval → alert data producer

**Layer 4 — Accountability (data contracts)**:
- Unity Catalog: assign table_owner tag per table → one team owns each data product
- Data contracts: document expected schema, freshness, quality rules → version-controlled
- Review cadence: monthly quality review per data product

**Layer 5 — SLO dashboard**:
- Databricks SQL dashboard showing per-table: completeness %, validity %, freshness %, trend
- Traffic-light: Green (>99%), Yellow (95-99%), Red (<95%) per SLA tier`,
code:`# Data quality SLA tracking: custom metrics table
import dlt
from pyspark.sql import functions as F

# DLT: expectations with metrics logging
@dlt.table(name="silver.flight_events")
@dlt.expect("valid_delay",   "delay_minutes BETWEEN -30 AND 1440")
@dlt.expect_or_drop("has_flight_id", "flight_id IS NOT NULL")
def silver_flights(): ...

# Query DLT event log for quality trend
quality_trend = spark.sql("""
    SELECT
        DATE_TRUNC('day', timestamp)              AS check_date,
        details:flow_name::STRING                 AS table_name,
        details:expectations[0].name::STRING      AS rule_name,
        SUM(details:expectations[0].passed::LONG) AS passed,
        SUM(details:expectations[0].failed::LONG) AS failed,
        ROUND(100.0 * SUM(details:expectations[0].passed::LONG) /
            NULLIF(SUM(details:expectations[0].passed::LONG +
                       details:expectations[0].failed::LONG), 0), 2) AS pass_rate_pct
    FROM event_log('/pipelines/appr-pipeline/system/events')
    WHERE event_type = 'flow_progress'
      AND timestamp >= DATEADD(DAY, -30, CURRENT_TIMESTAMP())
    GROUP BY 1, 2, 3
    ORDER BY 1 DESC, 2, 3
""")

quality_trend.write.format("delta").mode("overwrite") \
    .saveAsTable("prod.monitoring.data_quality_sla")

-- Databricks SQL Alert: trigger if quality drops
-- Alert query (runs on schedule):
SELECT table_name, rule_name, pass_rate_pct,
       CASE WHEN pass_rate_pct >= 99 THEN 'GREEN'
            WHEN pass_rate_pct >= 95 THEN 'YELLOW'
            ELSE 'RED' END AS sla_status
FROM prod.monitoring.data_quality_sla
WHERE check_date = CURRENT_DATE()
  AND pass_rate_pct < 99   -- Alert threshold
ORDER BY pass_rate_pct ASC;
-- Alert: if COUNT(*) > 0 → send to #data-quality-alerts Slack channel`,
tags:['Data Quality SLA','DLT Expectations','dbt Tests','Lakehouse Monitoring','Data Contracts','Unity Catalog','SLO Dashboard','Freshness','Alerting','Data Ownership']},
]},

{id:'autoloader',icon:'📥',label:'Auto Loader',desc:'cloudFiles, schema inference, schema evolution, file notification',qs:[
{q:'What is Databricks Auto Loader? How does it differ from spark.read.format("json")? What are its key options?',diff:'sr',
simple:`Auto Loader (cloudFiles) is Databricks' incremental file ingestion framework. It continuously monitors cloud storage for new files and processes them exactly-once — without reading files already processed.

vs. spark.read.format("json"): Regular read processes ALL files every time (batch). Auto Loader tracks which files were processed (using checkpoint + file notification or directory listing) and only processes NEW files.`,
detailed:`**Auto Loader advantages over manual file ingestion**:

1. **Incremental processing**: Checkpoint tracks processed files — never re-process old files, never miss new files
2. **Exactly-once semantics**: Even on failure/restart, each file processed exactly once
3. **Schema inference + evolution**: Automatically infers schema from sample files; evolves schema as new columns appear
4. **Scale**: Handles millions of files efficiently (uses cloud file notification events, not directory listing)
5. **DLT integration**: Auto Loader is the native Bronze ingestion pattern in DLT pipelines

**Two file discovery modes**:

**Directory listing** (default for small file counts):
- Databricks lists all files in the directory each trigger
- Compares against previously processed files
- Simple, no extra infrastructure
- Slow for millions of files (listing overhead)

**File notification mode** (recommended for production at scale):
- Uses cloud storage event notifications (S3 EventBridge, Azure Event Grid)
- New file event pushed to queue (SQS/Azure Service Bus) → Auto Loader reads queue
- Near-real-time file pickup (< 1 second vs minutes for listing)
- Requires cloud infrastructure setup (queues + notifications)

**Key options**:
- cloudFiles.format: json, csv, parquet, avro, text, binaryFile
- cloudFiles.schemaLocation: Where to persist inferred schema
- cloudFiles.inferColumnTypes: Infer specific types vs. all-string
- cloudFiles.maxFilesPerTrigger: Limit files per micro-batch (backpressure)
- cloudFiles.useNotifications: Enable file notification mode

**Schema inference and evolution**:
- First run: Infers schema from sample of files, saves to schemaLocation
- Subsequent runs: Uses saved schema (no re-inference overhead)
- New column added to incoming files: cloudFiles.schemaEvolutionMode = addNewColumns (adds column, existing rows get NULL)`,
code:`# Auto Loader: Bronze ingestion pattern (standard)
def create_bronze_stream(source_path: str, schema_location: str, table_name: str):
    return (spark.readStream
        .format("cloudFiles")
        .option("cloudFiles.format", "json")
        .option("cloudFiles.schemaLocation", schema_location)
        .option("cloudFiles.inferColumnTypes", "true")
        .option("cloudFiles.schemaEvolutionMode", "addNewColumns")
        .option("cloudFiles.maxFilesPerTrigger", 1000)   # Backpressure control
        # File notification mode (S3/Azure Event Grid):
        .option("cloudFiles.useNotifications", "true")
        .option("cloudFiles.notificationQueueUrl", "https://sqs.ca-central-1.amazonaws.com/.../flights-queue")
        .load(source_path)
        # Add ingestion metadata
        .withColumn("_ingestion_time", F.current_timestamp())
        .withColumn("_source_file", F.input_file_name())
        .writeStream
        .format("delta")
        .outputMode("append")
        .option("checkpointLocation", f"/checkpoints/{table_name}")
        .option("mergeSchema", "true")           # Handle schema evolution
        .trigger(processingTime="2 minutes")
        .table(table_name))

# Use in DLT (cleanest pattern)
@dlt.table(name="bronze_flight_events")
def bronze_flights():
    return (spark.readStream
        .format("cloudFiles")
        .option("cloudFiles.format", "parquet")
        .option("cloudFiles.schemaLocation",
                "/Volumes/main/schemas/bronze_flights")
        .load("abfss://landing@storage.dfs.core.windows.net/flights/"))

# Rescue data: route malformed records to _rescued_data column
spark.readStream.format("cloudFiles") \
    .option("cloudFiles.format", "json") \
    .option("rescuedDataColumn", "_rescued_data")  # Bad rows stored here
    .load(path)`,
tags:['Auto Loader','cloudFiles','Schema Inference','Schema Evolution','File Notification','Directory Listing','Bronze Layer','Incremental Ingestion','Exactly-Once','DLT']},

{q:'What are Databricks Repos? How do you build a CI/CD pipeline for Databricks notebooks and jobs?',diff:'sr',
simple:`Databricks Repos integrate Git repositories directly into the Databricks workspace — notebooks sync with GitHub/GitLab/Azure DevOps in real time. You can pull, push, branch, and merge without leaving Databricks.

For CI/CD: use Databricks Asset Bundles (DABs) to define jobs/pipelines as code, then deploy with GitHub Actions or Azure DevOps pipelines — promoting from dev → staging → prod with automated testing at each stage.`,
detailed:`**Databricks Repos (Git Integration)**:
- Connect a Git repo to a Databricks folder
- Notebooks stored as source files (.py, .sql, .ipynb) in Git — version-controlled
- Branch workflow: feature branch → PR → review → merge → auto-deploy
- Supports: GitHub, GitLab, Azure DevOps, Bitbucket
- Webhooks: repo updates can trigger Databricks Workflows automatically

**Databricks Asset Bundles (DABs)**:
- YAML-based IaC for Databricks resources: jobs, pipelines (DLT), clusters, permissions, dashboards
- Define once → deploy to multiple targets (dev, staging, prod)
- databricks bundle deploy --target dev → deploys to dev workspace
- databricks bundle run job_name → triggers a job run in target workspace

**CI/CD pipeline structure**:

1. **Develop**: Feature branch → code in Databricks Repos → unit tests with pytest + DBConnect
2. **PR**: Pull request triggers CI pipeline
   - Lint (pylint, flake8)
   - Unit tests (pytest with DBConnect against dev cluster)
   - YAML validation (DAB bundle validate)
3. **Merge to main**: Auto-deploy to staging
   - databricks bundle deploy --target staging
   - Integration tests against staging data
4. **Release**: Tag → deploy to production
   - databricks bundle deploy --target prod
   - Smoke tests on prod data subset
   - Monitoring alert baseline update

**Testing strategies**:
- Unit tests: pytest + pyspark.sql.SparkSession.builder.master("local[2]") — no cluster needed for pure logic
- Integration tests: pytest + DBConnect against real cluster with test data
- Data quality tests: dbt test or DLT expectations in staging pipeline run

**Nutter (Databricks notebook testing library)**:
- Run notebook tests as part of CI pipeline
- databricks/nutter: execute test notebooks and check assertions`,
code:`# databricks.yml: Asset Bundle definition (IaC)
bundle:
  name: appr-claims-pipeline

variables:
  catalog: {default: dev}
  env:     {default: dev}

targets:
  dev:
    mode: development
    workspace:
      host: https://dev.azuredatabricks.net
    variables: {catalog: dev, env: dev}

  staging:
    workspace:
      host: https://staging.azuredatabricks.net
    variables: {catalog: staging, env: staging}

  prod:
    mode: production
    workspace:
      host: https://prod.azuredatabricks.net
    variables: {catalog: prod, env: prod}

resources:
  pipelines:
    appr_dlt:
      name: "APPR Claims DLT [\${var.env}]"
      catalog: \${var.catalog}
      schema: silver
      photon: true
      libraries:
        - notebook: {path: ./pipelines/bronze_ingest}
        - notebook: {path: ./pipelines/silver_transform}

  jobs:
    appr_daily_gold:
      name: "APPR Daily Gold Refresh [\${var.env}]"
      tasks:
        - task_key: run_dlt
          pipeline_task:
            pipeline_id: \${resources.pipelines.appr_dlt.id}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/Toronto"

# GitHub Actions CI/CD workflow
# .github/workflows/deploy.yml:
# on: push to main
# jobs:
#   deploy:
#     steps:
#       - uses: actions/checkout@v3
#       - run: pip install databricks-cli
#       - run: databricks bundle validate
#       - run: databricks bundle deploy --target staging
#       - run: pytest tests/integration/ --cluster-id \${{ secrets.CLUSTER_ID }}
#       - if: github.ref == 'refs/tags/*'
#         run: databricks bundle deploy --target prod`,

{q:'What is the Databricks Partner Connect ecosystem? How does it integrate with tools like dbt, Fivetran, Tableau?',diff:'sr',
simple:`Partner Connect is Databricks' one-click integration marketplace for third-party tools. Partners connect to Databricks SQL Warehouse or cluster via JDBC/ODBC or native connectors, with OAuth or PAT authentication — pre-configured with Unity Catalog access.

Key categories: Ingestion (Fivetran, Airbyte), Transformation (dbt Cloud), BI (Tableau, Power BI, Looker), Data Quality (Monte Carlo, Soda), ML (MLflow partners).`,
detailed:`**dbt + Databricks** (most important integration):
- dbt Core: open-source SQL transformation framework — define models as .sql files
- dbt Cloud: managed dbt with scheduler, lineage UI, CI/CD
- Databricks Adapter (dbt-databricks): native integration, uses Photon-enabled SQL Warehouse
- dbt models → Databricks Delta tables (materialized as table, view, or incremental)
- dbt tests → validate Silver/Gold layer data quality
- dbt lineage → Unity Catalog lineage graph (automatic with dbt-databricks)

**dbt incremental models**:
\`\`\`sql
-- models/silver/silver_flights.sql
{{ config(materialized='incremental', unique_key='flight_id',
          incremental_strategy='merge') }}

SELECT flight_id, carrier_code, delay_min, flight_date
FROM {{ source('bronze', 'raw_flights') }}
{% if is_incremental() %}
WHERE flight_date > (SELECT MAX(flight_date) FROM {{ this }})
{% endif %}
\`\`\`

**Fivetran + Databricks**:
- Managed ELT: Fivetran replicates source systems (Salesforce, Postgres, SAP) → Databricks Delta (HVR)
- Fivetran writes to Bronze schema → dbt transforms to Silver/Gold
- Unity Catalog: Fivetran creates tables in specified catalog.schema

**Tableau / Power BI + Databricks SQL**:
- Native connector: Tableau Databricks connector (JDBC under the hood, optimized)
- Connect to SQL Warehouse via server hostname + HTTP path
- Tableau: publishes to Tableau Server/Cloud; extracts or live queries
- Power BI: DirectQuery mode (live SQL Warehouse queries) or Import (extract to Power BI dataset)
- Semantic layer: define Unity Catalog table relationships → BI tools pick up automatically

**Monte Carlo / Soda (Data Observability)**:
- Connect to Unity Catalog + Delta tables
- Automatically discover tables, profile data, detect anomalies
- Alert on freshness, volume, schema, and distribution changes
- Complement to DLT Expectations and Lakehouse Monitoring`,
code:`# dbt + Databricks: profiles.yml configuration
my_project:
  target: dev
  outputs:
    dev:
      type: databricks
      host: adb-xxxxx.azuredatabricks.net
      http_path: /sql/1.0/warehouses/abc123def456  # SQL Warehouse HTTP path
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: dev                                   # Unity Catalog catalog
      schema: silver                                 # Default schema
      threads: 8

    prod:
      type: databricks
      host: adb-prod.azuredatabricks.net
      http_path: /sql/1.0/warehouses/prod-warehouse
      token: "{{ env_var('DATABRICKS_TOKEN_PROD') }}"

{id:'dbsql',icon:'📊',label:'Databricks SQL',desc:'SQL Warehouses, Photon, query federation, BI integration',qs:[
{q:'How does Databricks SQL differ from running SQL on a Databricks cluster? What is a SQL Warehouse?',diff:'sr',
simple:`Databricks SQL is a separate product optimized for SQL analytics and BI use cases. SQL Warehouses are dedicated compute endpoints for SQL only — they run Photon (vectorized C++ engine), have instant start-up (Serverless), auto-scale per query concurrency, and are shared across many SQL users without notebook overhead.

vs. cluster SQL: Clusters are general-purpose (Python + SQL). SQL Warehouses are SQL-only, faster for analytics queries, and more cost-efficient for BI tools.`,
detailed:`**SQL Warehouse types**:

**Serverless SQL Warehouse** (recommended):
- Compute managed by Databricks (not in your cloud account)
- Start in < 5 seconds (vs 3-5 min for classic warehouses)
- Per-query auto-scaling — each query gets what it needs, instantly
- No cluster management: no instance types, no node counts to configure
- Price: higher per-DBU, but lower total cost (no idle cost, instant scale-down)
- Best for: BI tools with unpredictable concurrency, dashboards, ad-hoc SQL

**Classic/Pro SQL Warehouse**:
- Runs in your cloud account (your VPC)
- Slower start (3-5 min first start; ~30s with warm pools)
- Fixed or auto-scale based on cluster size/count
- Pro: additional features (query federation, Unity Catalog row filtering)
- Best for: Predictable, high-volume SQL workloads; data sovereignty requirements

**Photon on SQL Warehouses** (always on):
- All SQL Warehouse queries run on Photon automatically
- Vectorized columnar processing: 2-10× faster than JVM Spark SQL
- No code changes needed — transparent speedup

**Query federation** (Pro/Serverless Warehouses):
- Run SQL queries against external data sources: Snowflake, BigQuery, MySQL, PostgreSQL, S3, Azure SQL
- Results joined with Databricks tables in one SQL query
- No data movement needed: federation runs queries natively on source

**BI Tool integration**:
- Direct JDBC/ODBC connector for: Tableau, Power BI, Looker, Qlik, Excel
- Databricks SQL also has native dashboards (DBSQL Dashboards)
- Databricks as Semantic Layer: define metrics and dimensions in UC, expose to all BI tools`,
code:`-- Databricks SQL: full analytics query (runs on Photon in SQL Warehouse)
-- No PySpark needed -- just SQL

-- Window function analytics: running total + moving average
WITH flight_delays AS (
    SELECT
        flight_date,
        carrier_code,
        AVG(delay_minutes) AS avg_delay,
        COUNT(*) AS total_flights
    FROM prod.silver.flights
    WHERE flight_date >= DATEADD(MONTH, -3, CURRENT_DATE())
    GROUP BY flight_date, carrier_code
)
SELECT
    carrier_code,
    flight_date,
    avg_delay,
    SUM(avg_delay) OVER (PARTITION BY carrier_code ORDER BY flight_date
                         ROWS UNBOUNDED PRECEDING) AS cumulative_delay,
    AVG(avg_delay) OVER (PARTITION BY carrier_code ORDER BY flight_date
                         ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) AS ma7_delay
FROM flight_delays
ORDER BY carrier_code, flight_date;

-- Query federation: join Databricks table with Snowflake data
SELECT d.carrier_name, f.avg_delay, s.quarterly_revenue
FROM prod.gold.carrier_performance f
JOIN snowflake_connection.analytics.carrier_revenue s
    ON f.carrier_code = s.carrier_code         -- Federated join!
JOIN prod.dim.dim_carrier d ON f.carrier_code = d.code
WHERE f.flight_date >= '2024-01-01';

-- DBSQL Alert (monitoring)
-- Create alert on: avg_delay > 60 minutes → notify Slack`,
tags:['Databricks SQL','SQL Warehouse','Serverless','Photon','Query Federation','BI Integration','Tableau','Power BI','JDBC','ODBC']},

{q:'What is Databricks Lakehouse Monitoring? How do you detect data drift and model degradation?',diff:'pr',
simple:`Lakehouse Monitoring automatically profiles Delta tables over time and detects drift — schema drift (new/dropped columns), distribution drift (value distributions changing), and model quality drift (prediction accuracy degrading).

You attach a monitor to any Delta table; it runs analysis jobs and stores metrics in a separate Delta table you can query/visualize.`,
detailed:`**Lakehouse Monitoring types**:

**InferenceLog Monitor** (ML models):
- Monitors: prediction distributions, label drift, model accuracy (when labels arrive)
- Input: inference table (logged by Model Serving) + optional ground truth joins
- Detects: input feature drift, output distribution shift, model degradation
- Use for: Production model health monitoring

**TimeSeries Monitor**:
- For time-ordered data (events, metrics, logs)
- Detects: value drift over time windows (7-day rolling)
- Use for: Business metric tables (revenue, signups), operational metrics

**Snapshot Monitor**:
- For non-time-ordered tables
- Compares current snapshot to a baseline
- Use for: Reference/dimension tables, slowly-changing data

**Profile metrics computed**:
- For numeric columns: mean, stddev, min, max, percentiles, null%, cardinality
- For string columns: distinct counts, top values, null%
- Statistical tests: KS-test for numeric drift, chi-squared for categorical drift
- Custom metrics: define your own SQL-based business metrics

**Drift thresholds and alerts**:
- Configure drift thresholds per column
- Alert via email, Slack webhook, or PagerDuty when drift detected
- Dashboard: built-in Databricks SQL dashboard auto-generated for each monitor

**Integration with Model Serving payload logging**:
1. Enable auto_capture_config on Model Serving endpoint → predictions logged to Delta table
2. Attach InferenceLog Monitor to that Delta table
3. Monitor detects: input drift (feature distributions changing), prediction drift

**For APPR chatbot**:
- Monitor input questions for topic drift (new types of APPR queries emerging)
- Monitor prediction confidence distribution for quality degradation
- Alert when faithfulness scores drop below threshold`,
code:`from databricks.sdk import WorkspaceClient
from databricks.sdk.service.catalog import MonitorInferenceLog, MonitorTimeSeries

w = WorkspaceClient()

# InferenceLog Monitor for APPR chatbot
w.quality_monitors.create(
    table_name="main.model_monitoring.appr_chatbot_predictions",  # Payload log table
    inference_log=MonitorInferenceLog(
        problem_type="PROBLEM_TYPE_QUESTION_ANSWERING",
        prediction_col="answer",              # Model output
        timestamp_col="timestamp",
        model_id_col="model_name",
        label_col="ground_truth"              # Joined ground truth (if available)
    ),
    output_schema_name="main.monitoring_metrics",
    schedule={"quartz_cron_expression": "0 0 * * * ?"}  # Hourly
)

# TimeSeries Monitor for Silver flight data
w.quality_monitors.create(
    table_name="prod.silver.flights",
    time_series=MonitorTimeSeries(
        timestamp_col="flight_date",
        granularities=["1 day", "7 days"]      # Daily + weekly profiles
    ),
    output_schema_name="prod.monitoring",
    baseline_table_name="prod.silver.flights_baseline",  # Reference period
    schedule={"quartz_cron_expression": "0 0 8 * * ?"}   # Daily at 8am
)

-- Query drift metrics
SELECT column_name, drift_type, drift_score, alert_threshold,
       is_alert, window_start_time
FROM prod.monitoring.silver_flights_drift_metrics
WHERE window_start_time >= DATEADD(DAY, -7, CURRENT_DATE())
  AND is_alert = TRUE
ORDER BY drift_score DESC;

-- Custom metric: track APPR claim eligibility rate over time
SELECT DATE_TRUNC('day', timestamp) AS day,
       COUNT(*) AS total_predictions,
       AVG(delay_probability) AS avg_predicted_prob,
       COUNT(CASE WHEN delay_probability > 0.8 THEN 1 END) AS high_confidence_count
FROM main.model_monitoring.appr_chatbot_predictions
GROUP BY 1 ORDER BY 1;`,

{id:'arch',icon:'🏗️',label:'Architecture Patterns',desc:'Medallion, data mesh, lakehouse design decisions',qs:[
{q:'Explain the Medallion Architecture on Databricks. How do you implement Bronze, Silver, Gold on the platform?',diff:'sr',
simple:`Medallion Architecture organizes data into three quality layers:
• Bronze: Raw data exactly as ingested. Never modified.
• Silver: Cleaned, validated, conformed. Business-ready.
• Gold: Aggregated KPIs and ML features for consumption.

On Databricks: Bronze via Auto Loader → Silver via DLT or Structured Streaming → Gold via DLT Materialized Views or SQL Warehouse. All stored as Delta tables in Unity Catalog.`,
detailed:`**Bronze layer on Databricks**:
- Ingest: Auto Loader (cloudFiles) for files; Kafka connector for events; Delta Sharing for partner data
- Format: Delta (retain full history + time travel)
- Schema: Preserve source schema + add metadata (_ingestion_time, _source_file, _source_system)
- Unity Catalog: raw.{source_system}.{entity} naming
- No transformations: even bad records ingested (track issues without data loss)
- DLT pattern: @dlt.table with Auto Loader source

**Silver layer on Databricks**:
- Transformations: dedup (ROW_NUMBER or MERGE), type casting, null handling, standardize formats
- Validation: DLT Expectations (expect_or_drop for dirty records, expect_or_fail for critical invariants)
- SCD Type 2 for dimensions: DLT APPLY CHANGES INTO for managed SCD2
- CDC absorption: DLT APPLY CHANGES for Kafka CDC events (handles late arriving events)
- Partitioning: by high-cardinality date column (flight_date, event_date)
- Z-ordering: by high-cardinality filter columns (carrier_code, customer_id)
- Unity Catalog: prod.silver.{entity}

**DLT APPLY CHANGES** (SCD2 in DLT):
\`\`\`python
dlt.apply_changes(
    target="silver_customers",
    source="bronze_customer_changes",
    keys=["customer_id"],
    sequence_by="updated_at",
    stored_as_scd_type=2
)
\`\`\`

**Gold layer on Databricks**:
- DLT Materialized Views or SQL Warehouse queries
- Pre-aggregated business KPIs, ML feature tables
- Served via: SQL Warehouse (for BI), Model Serving (for ML), REST API (for applications)
- Optimized: OPTIMIZE + ZORDER by BI query patterns
- Unity Catalog: prod.gold.{domain}_{entity}

**Orchestration on Databricks**:
- DLT handles Bronze → Silver → Gold dependency within a pipeline
- Databricks Workflows orchestrates across DLT pipelines, Jobs, and notebooks
- Trigger patterns: file arrival (Auto Loader), schedule (cron), upstream job completion (pipeline trigger)`,
code:`# Complete Medallion pipeline in DLT
import dlt
from pyspark.sql import functions as F

# BRONZE: Auto Loader ingestion
@dlt.table(
    name="bronze_appr_claims",
    table_properties={"quality": "bronze", "delta.enableChangeDataFeed": "true"}
)
def bronze_appr_claims():
    return (spark.readStream
        .format("cloudFiles")
        .option("cloudFiles.format", "json")
        .option("cloudFiles.schemaLocation", "/Volumes/main/schemas/appr_claims")
        .load("abfss://landing@storage.dfs.core.windows.net/appr/")
        .withColumn("_ingestion_ts", F.current_timestamp())
        .withColumn("_source_file", F.input_file_name()))

# SILVER: SCD Type 2 via APPLY CHANGES
dlt.apply_changes(
    target="silver_claims",
    source="bronze_appr_claims",
    keys=["claim_id"],
    sequence_by="updated_at",
    stored_as_scd_type=2,
    track_history_column_list=["status", "compensation_amount", "ruling"]
)

# SILVER: Validated streaming table
@dlt.table(name="silver_flight_disruptions", partition_cols=["disruption_date"])
@dlt.expect_or_drop("valid_delay", "delay_minutes >= 0 AND delay_minutes <= 1440")
@dlt.expect_or_fail("has_flight_id", "flight_id IS NOT NULL")
def silver_disruptions():
    return (dlt.read_stream("bronze_appr_claims")
        .withColumn("disruption_date", F.to_date("event_timestamp"))
        .withColumn("eligibility_tier",
            F.when(F.col("delay_minutes") >= 180, "MAJOR")
            .otherwise("MINOR")))

# GOLD: Materialized view aggregation
@dlt.table(name="gold_appr_metrics")
def gold_appr_metrics():
    return (dlt.read("silver_flight_disruptions")
        .groupBy("carrier_code", "disruption_date")
        .agg(
            F.count("*").alias("total_disruptions"),
            F.sum("compensation_amount").alias("total_compensation"),
            F.avg("delay_minutes").alias("avg_delay")
        ))`,
tags:['Medallion Architecture','Bronze','Silver','Gold','DLT','Auto Loader','APPLY CHANGES','SCD Type 2','Unity Catalog','Data Quality']},

{q:'When would you choose Databricks over Snowflake? How do you make this architecture decision?',diff:'ar',
simple:`Choose Databricks when: your workload is Python-heavy, includes ML/AI, requires streaming, needs open formats (Delta/Iceberg), or you have complex ETL pipelines mixing code and SQL. Choose Snowflake when: your workload is primarily SQL analytics/BI, your team is SQL-first, you need better data sharing, or you want simpler operations with less infrastructure concern.`,
detailed:`**Databricks strengths**:
- ML/AI native: MLflow, Feature Store, Model Serving, AutoML — fully integrated
- Python/Scala first: Spark DataFrame API, full programming language power
- Streaming: Structured Streaming + DLT for real-time pipelines
- Open formats: Delta/Iceberg — no vendor lock-in on storage format
- Complex ETL: Multi-step Python transformations, custom logic, UDFs
- Cost for compute-heavy workloads: Spot instances, autoscaling — can be cheaper for large batch
- LLM/GenAI: DBRX, Llama 2 on GPU, Foundation Model APIs, Vector Search

**Snowflake strengths**:
- SQL pure play: Best-in-class SQL analytics, most SQL-standard compliant
- Simplicity: No Spark concepts, no cluster management, easier for SQL analysts
- Concurrency: Better isolation between concurrent SQL queries
- Data sharing: Snowflake Data Marketplace, direct data sharing across accounts
- Semi-structured: VARIANT type for JSON — easier than Spark JSON handling
- Cost for SQL analytics: No idle compute (serverless warehouses), simpler pricing

**Decision framework**:
1. What's your PRIMARY workload?
   - SQL analytics → Snowflake
   - ETL + ML + Streaming → Databricks
   
2. What's your team's skill set?
   - SQL-heavy analytics team → Snowflake
   - Data engineering + Python + ML → Databricks

3. What's your data volume and compute pattern?
   - Predictable SQL queries → Snowflake
   - Large-scale batch transformations → Databricks (Spark cost advantage)

4. Open format requirement?
   - Need Parquet/Delta on your own S3 → Databricks
   - OK with proprietary format → Snowflake (or UniForm bridge)

**The honest answer for interviews**:
"In practice, many enterprises use BOTH. Databricks for ETL and ML; Snowflake for SQL analytics and BI. Delta Sharing allows Databricks Delta tables to be consumed by Snowflake as external tables. The platforms are complementary, not mutually exclusive — and the decision depends on workload mix, team skills, and organizational maturity."`,
code:`# Common real-world architecture: Databricks ETL → Snowflake BI
#
# Source Systems → Auto Loader → Bronze (Databricks Delta)
#                             → Silver (Databricks Delta, DLT)
#                             → Gold (Databricks Delta, optimized)
#                             → Snowflake External Tables (via Delta Sharing)
#                             → Power BI / Tableau dashboards
#
# ML path:
# Gold Delta Tables → Databricks Feature Store
#                  → MLflow Training → Model Registry
#                  → Model Serving API
#                  → Application / Chatbot

# Delta Sharing: expose Databricks table to Snowflake
# (in Databricks)
from delta.sharing import SharingClient
client = SharingClient("profile.share")
client.share_table(
    share="analytics-share",
    schema="gold",
    table="carrier_performance"
)

-- In Snowflake: consume shared Databricks Delta table
CREATE DATABASE partner_data
  FROM SHARE databricks_provider.analytics_share;

SELECT * FROM partner_data.gold.carrier_performance;  -- Reads Delta directly!`,
tags:['Databricks vs Snowflake','Architecture Decision','Delta Sharing','Data Mesh','ML Platform','Open Format','TCO','Data Engineering','Analytics']},

{q:'How does the Databricks Feature Store work? When and why do you use it?',diff:'pr',
simple:`The Databricks Feature Store is a centralized repository for ML features — pre-computed, versioned, and reusable across multiple models. It solves: training-serving skew (train and serve with identical feature computation), feature discoverability, and feature reuse across teams.

Training reads from Feature Store offline store (Delta table). Serving reads from Feature Store online store (low-latency lookup).`,
detailed:`**Feature Store components**:

**Feature Table** (offline store):
- Delta table with a primary key column
- Features computed once → reused by many models
- Time-series aware: pointInTime lookups for training data backfill
- Unity Catalog Feature Store: features registered as Unity Catalog tables (catalog.schema.table)

**Online Store** (low-latency serving):
- Published from offline Feature Table
- Backed by low-latency key-value store (DynamoDB, Redis, Azure Cosmos DB, MySQL)
- Model serving reads from online store (< 5ms lookup vs seconds for Delta)
- Sync: Databricks keeps online store in sync with offline store

**Training-Serving Skew prevention** (the core problem solved):
- Without Feature Store: training code computes features differently than serving code → model performance degrades in production
- With Feature Store: same feature table, same feature functions used for training AND serving → mathematical identity guaranteed

**Lookup patterns**:
- Training: FeatureStoreClient.create_training_set() — joins label data with features using pointInTime join (prevents data leakage)
- Batch inference: FeatureStoreClient.score_batch() — computes predictions from feature lookups
- Online inference: Model serving automatically fetches from online store

**When to use Feature Store**:
✅ Same features needed for 2+ models
✅ Avoiding training-serving skew is critical (fraud detection, recommendations)
✅ Features have expensive computation (lag features, aggregations over sliding windows)
✅ Regulatory requirement: prove what features were used when a model made a decision

**When Feature Store adds overhead without benefit**:
❌ One-off model, features won't be reused
❌ Real-time features that must be computed fresh each request (can't be pre-computed)
❌ Simple pipeline where training = serving code already`,
code:`from databricks.feature_engineering import FeatureEngineeringClient
from pyspark.sql import functions as F

fe = FeatureEngineeringClient()

# 1. Compute and register features
carrier_features = (spark.table("silver.flights")
    .groupBy("carrier_code")
    .agg(
        F.avg("delay_minutes").alias("avg_delay_30d"),
        F.count("*").alias("flight_volume_30d"),
        F.sum(F.when(F.col("status")=="CANCELLED",1).otherwise(0))
            .alias("cancellation_count_30d")
    ))

# Create feature table (Unity Catalog)
fe.create_table(
    name="main.feature_store.carrier_delay_features",
    primary_keys=["carrier_code"],
    df=carrier_features,
    description="30-day aggregated delay features per carrier"
)

# 2. Create training set with point-in-time lookup
label_df = spark.table("gold.appr_claims_labels")  # Has: carrier_code, flight_date, outcome

training_set = fe.create_training_set(
    df=label_df,
    feature_lookups=[
        FeatureLookup(
            table_name="main.feature_store.carrier_delay_features",
            feature_names=["avg_delay_30d", "flight_volume_30d", "cancellation_count_30d"],
            lookup_key="carrier_code"
        )
    ],
    label="outcome"
)

training_df = training_set.load_df()

# 3. Train and log model WITH feature store linkage
import mlflow
with mlflow.start_run():
    model = train_model(training_df)
    fe.log_model(
        model=model,
        artifact_path="model",
        flavor=mlflow.sklearn,
        training_set=training_set  # Links model to feature table!
    )`,
tags:['Feature Store','Training-Serving Skew','Online Store','Offline Store','FeatureLookup','Point-in-Time','Feature Engineering','MLflow','Unity Catalog']},

{q:'How do you optimize Databricks costs in production? What are the biggest cost levers?',diff:'pr',
simple:`The five biggest cost levers (in order of impact):
1. Spot/Preemptible instances for workers — 60-80% cheaper than on-demand
2. Auto-termination on all interactive clusters — stop idle cluster drain
3. Job clusters instead of all-purpose for production — no idle cost between runs
4. Serverless SQL Warehouses — scale-to-zero, no idle warehouse cost
5. Right-size cluster instances — profile jobs and downsize over-provisioned nodes`,
detailed:`**Cost drivers and solutions**:

**Cluster idle time** (biggest waste):
- Developer leaves cluster running → 8h × $X/hr while doing nothing
- Fix: auto-termination_minutes = 30 on every interactive cluster. Enforce via cluster policy — no exceptions.

**Spot instances** (largest single savings lever):
- Spot/Preemptible/Spot VMs: 60-80% cheaper than on-demand
- Risk: can be reclaimed (preempted) → in-flight tasks retry automatically (Spark handles this)
- Configure: "availability": "SPOT_WITH_FALLBACK" (try spot, fall back to on-demand)
- Keep driver on on-demand: "first_on_demand": 1 — only driver stays on-demand, workers go spot
- Best for: All batch ETL, DLT pipelines, ML training (fault-tolerant by design)

**DBU tier selection**:
- Jobs Compute DBUs: Cheapest — use for ALL production jobs, DLT, training
- All-Purpose Compute DBUs: More expensive — only for interactive notebook development
- SQL Compute DBUs: Separate pricing for SQL Warehouses
- Common mistake: running scheduled jobs on all-purpose clusters → 2-3× overpaying

**Photon for SQL workloads**:
- Photon processes more data per DBU → same query costs fewer DBUs
- A 10-min Photon query may cost less than a 30-min non-Photon query even at higher DBU rate
- Always enable on SQL Warehouses (automatic) and batch SQL-heavy ETL

**Auto-scaling**:
- Set min_workers = 1-2 (not 0 — zero workers = cluster shutdown)
- Set max_workers conservatively — over-provisioning is the #1 waste
- Enhanced autoscaling for DLT: responds faster to streaming backlog
- AQE helps reduce needed partitions/tasks → sometimes needs fewer workers

**Cost monitoring**:
- system.billing.usage: query all DBU consumption by cluster, tag, SKU
- system.compute.clusters: join with cluster metadata for team attribution
- Budget alerts in Account Console: 80% / 100% thresholds → Slack notifications
- Tag ALL clusters: team, project, cost_center — enables chargebacks`,
code:`# Cluster config: cost-optimized for production batch ETL
{
  "cluster_name": "prod-etl-cost-optimized",
  "spark_version": "13.3.x-scala2.12",
  "node_type_id": "m5d.2xlarge",         # Right-sized, not over-provisioned

  # Spot instances for workers (60-80% savings)
  "aws_attributes": {
    "availability": "SPOT_WITH_FALLBACK",
    "spot_bid_price_percent": 100,
    "first_on_demand": 1               # Driver stays on-demand, workers go spot
  },
  "autoscale": {"min_workers": 1, "max_workers": 6},
  "autotermination_minutes": 30,         # Always terminate idle clusters

  # Required cost tags
  "custom_tags": {
    "team": "data-engineering",
    "project": "appr-pipeline",
    "cost_center": "CC-1234",
    "environment": "production"
  }
}

-- Cost report by team (system tables — UC only)
SELECT
    t.custom_tags['team']     AS team,
    t.custom_tags['project']  AS project,
    SUM(u.usage_quantity)     AS total_dbus,
    SUM(u.usage_quantity * lp.default_unit_price) AS est_cost_usd
FROM system.billing.usage u
JOIN system.billing.list_prices lp
    ON u.sku_name = lp.sku_name
    AND lp.price_start_time = (
        SELECT MAX(price_start_time) FROM system.billing.list_prices
        WHERE sku_name = u.sku_name)
LEFT JOIN system.compute.clusters t
    ON u.cluster_id = t.cluster_id
WHERE u.usage_date >= DATEADD(MONTH, -1, CURRENT_DATE())
GROUP BY 1, 2
ORDER BY est_cost_usd DESC;`,
tags:['Cost Optimization','Spot Instances','Auto-termination','Cluster Policy','DBU','Serverless','Photon','System Tables','Cost Attribution','Autoscaling']},

{q:'How do Databricks Workflows orchestrate multi-step pipelines? Compare to Apache Airflow.',diff:'sr',
simple:`Databricks Workflows is the native orchestration layer — a DAG of tasks where each task can be a notebook, Python script, DLT pipeline, SQL query, dbt project, or another job. Tasks declare dependencies, retry logic, and can pass values to downstream tasks.

vs. Airflow: Workflows is simpler, fully managed, and deeply integrated with Databricks compute. Airflow has a larger operator ecosystem and is better for orchestrating across multiple platforms. Many teams use Airflow to trigger Databricks Workflows.`,
detailed:`**Workflow task types**:
- Notebook task: Run any Databricks notebook
- Python wheel task: Run packaged Python library (production-grade code)
- DLT pipeline task: Trigger and wait for a Delta Live Tables pipeline run
- SQL task: Execute a .sql file from a Databricks Repo
- dbt task: Integrated dbt Core execution
- Run job task: Trigger another Databricks job (meta-orchestration)
- Condition task: If/else branching based on task value
- For Each task: Parallel iteration over a list (e.g., process each airline in parallel)

**Key orchestration features**:

Task dependencies:
- depends_on: Run task B only after task A succeeds
- Multiple dependencies: all must succeed before downstream runs
- Outcome-specific: depends_on with outcome="SUCCESS" or "FAILED" for error handling

Conditional branching:
- Condition task compares task values → routes to different downstream tasks
- Pattern: check_row_count → if > 0 → proceed; if = 0 → send_alert_task

Task values (inter-task communication):
\`\`\`python
# Upstream task:
dbutils.jobs.taskValues.set(key="rows_processed", value=df.count())
# Downstream task:
count = dbutils.jobs.taskValues.get(taskKey="ingest", key="rows_processed", debugValue=0)
\`\`\`

Cluster sharing across tasks:
- job_cluster_key: Multiple tasks share one cluster (cost-efficient)
- Or: each task gets its own cluster (isolation but more startup time)

**Databricks Workflows vs Apache Airflow**:
| Aspect | Databricks Workflows | Apache Airflow |
|---|---|---|
| Setup | Zero (fully managed) | Self-managed or Astronomer |
| Databricks integration | Native, deep | Via provider operators |
| Operator ecosystem | Limited to Databricks | 500+ providers (S3, GCP, etc.) |
| Complex dependencies | Basic | Advanced (sensors, triggers) |
| Multi-platform | No | Yes |
| Cost | Included in Databricks | Separate infrastructure |

**Hybrid pattern** (best of both):
Use Airflow for: overall pipeline orchestration, non-Databricks steps, complex schedules
Use Workflows for: all Databricks-specific steps (DLT, ML training)
Connect via: DatabricksSubmitRunOperator in Airflow`,
code:`# Workflow: Full ML pipeline with branching
from databricks.sdk import WorkspaceClient
from databricks.sdk.service.jobs import *

w = WorkspaceClient()
w.jobs.create(
    name="weekly-delay-model-retrain",
    job_clusters=[{"job_cluster_key": "ml-cluster",
                   "new_cluster": {"spark_version": "13.3.x-ml-scala2.12",
                                   "node_type_id": "m5.4xlarge", "num_workers": 4}}],
    tasks=[
        # 1. Prepare training data
        Task(task_key="prepare_features",
             job_cluster_key="ml-cluster",
             notebook_task=NotebookTask("/ML/prepare_training_features"),
             timeout_seconds=3600, max_retries=1),

        # 2. Train model (depends on data prep)
        Task(task_key="train_model",
             depends_on=[{"task_key": "prepare_features"}],
             job_cluster_key="ml-cluster",
             notebook_task=NotebookTask("/ML/train_delay_classifier")),

        # 3. Evaluate model
        Task(task_key="evaluate_model",
             depends_on=[{"task_key": "train_model"}],
             job_cluster_key="ml-cluster",
             notebook_task=NotebookTask("/ML/evaluate_model")),

        # 4. Condition: promote only if AUC > 0.85
        Task(task_key="check_auc",
             depends_on=[{"task_key": "evaluate_model"}],
             condition_task=ConditionTask(
                 op=ConditionTaskOp.GREATER,
                 left="{{tasks.evaluate_model.values.val_auc}}",
                 right="0.85")),

        # 5a. Promote if good
        Task(task_key="promote_to_staging",
             depends_on=[{"task_key": "check_auc", "outcome": "true"}],
             notebook_task=NotebookTask("/ML/promote_model")),

        # 5b. Alert if not good
        Task(task_key="alert_low_auc",
             depends_on=[{"task_key": "check_auc", "outcome": "false"}],
             notebook_task=NotebookTask("/ML/alert_team")),
    ],
    schedule={"quartz_cron_expression": "0 0 2 ? * MON", "timezone_id": "America/Toronto"},
    email_notifications={"on_failure": ["ml-team@company.com"]}
)`,

{q:'What is data mesh and how do you implement it on Databricks? What role does Unity Catalog play?',diff:'ar',
simple:`Data mesh is an architectural approach where data ownership is distributed to domain teams (flights team owns flight data, loyalty team owns loyalty data) rather than centralised in a single data team. Each domain publishes self-serve "data products" — governed, discoverable, reliable Delta tables that other teams consume.

Unity Catalog enables data mesh by providing: one governance layer across all domains, catalog-per-domain namespacing, Delta Sharing for cross-domain consumption, and column/row security for access control without data duplication.`,
detailed:`**Data mesh four principles on Databricks**:

**1. Domain ownership**:
- Each business domain owns its data end-to-end: ingestion → transformation → publishing
- Unity Catalog: flights_catalog.silver.*, flights_catalog.gold.* owned by flights team
- Data stewards: each catalog has assigned owners (Unity Catalog table_owner tag)
- No central data team doing ETL for every domain — domains self-serve

**2. Data as a product**:
- Each domain publishes curated Gold tables as "data products"
- Data products must meet: SLAs (freshness, quality), documentation, schema stability
- Unity Catalog: tables have descriptions, column comments, data contracts as tags
- Discovery: Unity Catalog Explorer — search tables by tag, name, domain
- Databricks Marketplace: publish data products internally or externally

**3. Self-serve infrastructure**:
- Platform team provides: workspace templates, DLT pipeline templates, cluster policies
- Domain teams self-serve: create DLT pipelines, SQL Warehouses, MLflow experiments
- No ticket to platform team to create a table — Unity Catalog permissions allow self-service within domain

**4. Federated computational governance**:
- Global policies (PII masking, audit logging) applied centrally via Unity Catalog
- Domain-specific policies (who sees which domain's data) applied per catalog
- Central: masking functions in governance catalog
- Domain: GRANT decisions per catalog/schema

**Unity Catalog data mesh topology**:
\`\`\`
main_metastore (one per region)
├── platform_catalog    (shared infrastructure tables)
│   └── governance.*    (masking functions, classification tags)
├── flights_catalog     (flights domain)
│   ├── bronze.*        (owned by flights-ingest team)
│   ├── silver.*        (owned by flights-transform team)
│   └── gold.*          (published data products: flight_performance, appr_eligibility)
├── loyalty_catalog     (loyalty domain)
│   └── gold.*          (loyalty_member_profile, points_balance — data products)
└── shared_catalog      (cross-domain joined products)
    └── gold.*          (combined flight+loyalty analytics)
\`\`\`

**Cross-domain consumption**:
- GRANT SELECT ON TABLE flights_catalog.gold.flight_performance TO \`loyalty-team\`
- No data duplication: loyalty team queries flights_catalog directly
- Or: Delta Sharing for external partners / different regions`,
code:`-- Data mesh: Unity Catalog topology setup

-- Platform team: create domain catalogs
CREATE CATALOG flights_catalog COMMENT 'Flights domain — owned by flights-data-team@airline.com';
CREATE CATALOG loyalty_catalog COMMENT 'Loyalty domain — owned by loyalty-data-team@airline.com';

-- Assign domain ownership
ALTER CATALOG flights_catalog OWNER TO \`flights-data-team\`;
ALTER CATALOG loyalty_catalog OWNER TO \`loyalty-data-team\`;

-- Domain schemas
CREATE SCHEMA flights_catalog.bronze MANAGED LOCATION 'abfss://flights/bronze';
CREATE SCHEMA flights_catalog.silver MANAGED LOCATION 'abfss://flights/silver';
CREATE SCHEMA flights_catalog.gold   MANAGED LOCATION 'abfss://flights/gold';

-- Data product: documented, tagged, with data contract metadata
CREATE TABLE flights_catalog.gold.appr_eligibility (
    flight_id      STRING  NOT NULL COMMENT 'Unique disruption event ID',
    disruption_date DATE   NOT NULL COMMENT 'Date of disruption',
    carrier_code   STRING  NOT NULL COMMENT 'IATA carrier code',
    delay_minutes  INT              COMMENT 'Minutes delayed (negative=early)',
    is_eligible    BOOLEAN NOT NULL COMMENT 'APPR compensation eligible',
    compensation_tier STRING        COMMENT 'MINOR/MODERATE/MAJOR per APPR schedule'
)
TBLPROPERTIES (
    'data_product'       = 'true',
    'data_owner'         = 'flights-data-team@airline.com',
    'refresh_frequency'  = '15_minutes',
    'freshness_sla_min'  = '60',
    'quality_sla_pct'    = '99.5',
    'data_classification'= 'INTERNAL'
);

-- Cross-domain: loyalty team reads flights data product
GRANT SELECT ON TABLE flights_catalog.gold.appr_eligibility TO \`loyalty-data-team\`;

-- Shared catalog: cross-domain join owned by analytics team
CREATE TABLE shared_catalog.gold.member_flight_disruptions AS
SELECT m.loyalty_id, m.tier, f.disruption_date, f.is_eligible, f.compensation_tier
FROM loyalty_catalog.gold.member_profile m
JOIN flights_catalog.gold.appr_eligibility f ON m.recent_flight_id = f.flight_id;`,

{q:'How do you design a lakehouse for real-time analytics with sub-minute data freshness?',diff:'ar',
simple:`Sub-minute freshness requires streaming ingestion throughout the pipeline. Stack: Kafka → Structured Streaming Bronze (Auto Loader for files, Kafka connector for events) → DLT Continuous Silver → Databricks SQL Serverless Warehouse with dynamic tables for Gold. The key constraint: no batch anywhere in the critical path.`,
detailed:`**Sub-minute freshness architecture**:

**Ingestion (< 5 second lag)**:
- Kafka: events published immediately from source systems
- Databricks Kafka connector with maxOffsetsPerTrigger for smooth micro-batching
- Or: Auto Loader with file notification mode + file arrival Workflow trigger

**Bronze → Silver (< 30 second lag)**:
- DLT Continuous pipeline: always-on, processes each Kafka micro-batch as it arrives
- Trigger.AvailableNow() alternative if cost is constraint (1-2 min lag instead)
- Critical: no batch ETL in this path — batch jobs add minutes of latency

**Silver → Gold (< 30 second lag)**:
- Option A: Snowflake Dynamic Tables with TARGET_LAG = '1 minute' (not available on Databricks)
- Option B: DLT Continuous Materialized Views — auto-refreshed, incremental computation
- Option C: Structured Streaming directly to Gold Delta tables (aggregations with stateful streaming)

**Serving (< 100ms query latency)**:
- Databricks SQL Serverless: instant start, auto-scale per query
- Pre-computed aggregations in Gold: avoid heavy computation at query time
- Result cache: identical queries within 24h return cached result (zero compute)
- Databricks SQL: sub-second latency for point lookups on Gold tables

**Cost management for always-on streaming**:
- DLT Enhanced Autoscaling: scales workers down during quiet periods (nights/weekends)
- Serverless SQL Warehouse: scale-to-zero during off-hours (BI inactive)
- Monitoring: track lag metrics — if lag > SLA, alert and scale up

**Trade-off: freshness vs cost**:
- < 1 min: DLT Continuous (always-on cluster = highest cost)
- 1-5 min: DLT Triggered every 1-5 min (lower cost, brief latency spike on trigger)
- 5-15 min: DLT Triggered (moderate cost, good for most BI/dashboards)
- 15-60 min: Batch job (lowest cost, acceptable for morning reports)

**Monitoring freshness SLAs**:
- Track: max(event_time) of last record in Gold table
- Alert if: NOW() - max(event_time) > 3 × expected_refresh_interval`,
code:`# Sub-minute freshness: end-to-end streaming architecture

import dlt
from pyspark.sql import functions as F

# BRONZE: Kafka → Delta (DLT Continuous)
@dlt.table(name="bronze_flight_events",
           table_properties={"quality":"bronze","pipelines.reset.allowed":"false"})
def bronze_flight_events():
    return (spark.readStream
        .format("kafka")
        .option("kafka.bootstrap.servers", dbutils.secrets.get("kafka","brokers"))
        .option("subscribe", "flight-events")
        .option("maxOffsetsPerTrigger", 10_000)   # Smooth micro-batches
        .option("startingOffsets", "latest")
        .load()
        .select(
            F.col("timestamp").alias("kafka_ts"),
            F.from_json(F.col("value").cast("string"), flight_schema).alias("d"))
        .select("kafka_ts", "d.*")
        .withColumn("_bronze_ts", F.current_timestamp()))

# SILVER: clean + validate (DLT Continuous, < 15s lag)
@dlt.table(name="silver_flight_events", partition_cols=["event_date"])
@dlt.expect_or_drop("valid_flight", "flight_id IS NOT NULL AND carrier_code IS NOT NULL")
def silver_flight_events():
    return (dlt.read_stream("bronze_flight_events")
        .withColumn("event_date", F.to_date("event_timestamp"))
        .withColumn("delay_category",
            F.when(F.col("delay_min") > 180, "MAJOR")
            .when(F.col("delay_min") > 45, "MODERATE")
            .otherwise("MINOR")))

# GOLD: streaming aggregation (< 30s lag from Silver)
@dlt.table(name="gold_realtime_carrier_metrics")
def gold_realtime_carrier_metrics():
    return (dlt.read_stream("silver_flight_events")
        .withWatermark("event_timestamp", "2 minutes")   # 2-min late tolerance
        .groupBy(
            F.window("event_timestamp", "5 minutes"),    # 5-min tumbling window
            "carrier_code"
        )
        .agg(
            F.avg("delay_min").alias("avg_delay"),
            F.count("*").alias("flight_count"),
            F.sum(F.when(F.col("status")=="CANCELLED",1).otherwise(0)).alias("cancellations")
        ))

# DLT Pipeline config: CONTINUOUS mode for sub-minute freshness
# pipeline_settings: {"continuous": true, "photon": true}

-- Freshness monitoring query (Databricks SQL Alert)
SELECT
    CURRENT_TIMESTAMP() AS check_time,
    MAX(event_timestamp) AS latest_event,
    TIMESTAMPDIFF(SECOND, MAX(event_timestamp), CURRENT_TIMESTAMP()) AS lag_seconds,
    CASE WHEN TIMESTAMPDIFF(SECOND, MAX(event_timestamp), CURRENT_TIMESTAMP()) > 120
         THEN 'BREACH' ELSE 'OK' END AS sla_status
FROM prod.gold.gold_realtime_carrier_metrics;
-- Alert: if sla_status = 'BREACH' → PagerDuty`,
tags:['Real-time Analytics','Sub-minute Freshness','DLT Continuous','Kafka','Streaming Aggregation','Watermark','Freshness SLA','Serverless SQL','Cost vs Latency','Lakehouse']},

{q:'How would you design a Databricks platform for a data science team of 50 people? What self-service vs centralized controls do you enforce?',diff:'ar',
simple:`50-person data science platform design: Unity Catalog with per-domain namespacing, cluster policies per role (DS gets ML clusters with GPU, Analysts get small SQL clusters), Databricks Repos for collaborative code, MLflow with shared experiments per project, and Feature Store for cross-team feature reuse.

Key tension: self-service speed vs governance/cost control. Resolve with guardrails (policies, budgets) not gates (approval queues).`,
detailed:`**Platform design for 50-person DS team**:

**User segmentation** (different needs → different configs):
- Data Engineers (10): DLT pipelines, job clusters, OPTIMIZE/VACUUM jobs → DE policy
- Data Scientists (25): ML clusters, GPU access, long experiments, notebooks → DS policy
- ML Engineers (10): Model training + serving, Feature Store, Model Registry → MLE policy
- Analysts (5): SQL only, Databricks SQL, no cluster access → Analyst SQL policy

**Cluster policy design**:
\`\`\`json
// Data Scientist policy
{
  "node_type_id": {"type":"allowlist","values":["m5.4xlarge","g4dn.xlarge","p3.2xlarge"]},
  "autoscale.max_workers": {"type":"range","maxValue":8},
  "autotermination_minutes": {"type":"range","maxValue":120},  // 2hr max (experiments can run long)
  "spark_version": {"type":"allowlist","values":["13.3.x-ml-scala2.12","14.3.x-ml-scala2.12"]}
}
// Analyst policy (SQL Warehouse only, no cluster creation)
\`\`\`

**Unity Catalog namespacing**:
- dev_catalog: DS free experimentation (no approval, self-serve)
- staging_catalog: validated data products (DE-reviewed)
- prod_catalog: production data (production team manages, least privilege for DS)
- Each scientist: personal schema in dev_catalog for scratch tables

**MLflow governance**:
- Shared experiments per project: /Shared/Projects/appr-model (everyone logs here)
- Personal experiments: /Users/{username}/ (scratch, ephemeral)
- Model Registry: project-namespaced models main.{project}.{model_name}
- Auto-cleanup: personal experiments >90 days old → archived

**Self-service guardrails** (not gates):
- Budget alerts per user/team: alert at 80% → not block
- Auto-termination enforced via policy: no long-idle clusters
- Spot instance default in DS policy: cost-savings automatic
- GPU access: policy-allowed (no approval) but audit-logged

**Collaboration features**:
- Databricks Repos: shared Git repos → PR workflow
- Feature Store: discover and reuse features across teams (avoid duplicate feature computation)
- MLflow: public experiments browsable by all in team
- Shared SQL Warehouse for ad-hoc analysis`,

{q:'How would you architect a real-time ML inference pipeline on Databricks? (e.g., APPR Claims Chatbot)',diff:'ar',
simple:`Real-time ML pipeline: incoming request → feature retrieval → model inference → response. On Databricks: Model Serving endpoint + Feature Store online store + MLflow model registered in Unity Catalog.

For a RAG chatbot (APPR Claims): Databricks Vector Search for semantic retrieval + Model Serving for LLM invocation + MLflow for tracking + LangChain/LangGraph for orchestration.`,
detailed:`**Architecture for APPR Claims RAG Chatbot** (your canonical story):

**Offline pipeline** (batch, runs nightly or triggered):
1. **Ingestion**: Auto Loader → bronze_appr_documents (PDFs, regulations, rulings)
2. **Processing**: DLT Silver pipeline → extract text, chunk, standardize
3. **Embedding**: DBR ML cluster → generate embeddings (BGE-M3, Ada-002)
4. **Vector Store**: Databricks Vector Search → index embeddings with Delta Sync
5. **Feature Store**: Pre-compute airline delay statistics, carrier performance features

**Online pipeline** (real-time, per request):
1. **User query** → Model Serving endpoint
2. **Semantic search**: Vector Search similarity query → retrieve top-K relevant chunks
3. **Context assembly**: Retrieved chunks + claim metadata + user question
4. **LLM invocation**: Claude 3.5 Sonnet / GPT-4 via Foundation Model APIs
5. **Response + metadata**: Return answer + source citations + confidence score
6. **Logging**: Payload logged to Delta table for evaluation

**Evaluation loop** (continuous quality):
- RAGAS metrics on logged payloads (faithfulness 0.87, answer relevancy)
- Semantic caching: Redis stores embedding → response for repeated queries (42% cost reduction)
- HITL (Human-in-the-Loop): Low-confidence responses flagged for human review
- Drift detection: Lakehouse Monitoring on payload table

**Why Databricks for this**:
- Delta Lake: audit-grade storage of all claims and regulatory documents
- Vector Search: managed, Delta-synced, no infrastructure to manage
- MLflow: experiment tracking for RAG pipeline hyperparameters (chunk size, top-K, temperature)
- Model Serving: unified endpoint for custom model + Foundation Model APIs
- Unity Catalog: governance over sensitive passenger data (column masking on PII)

**Component choices**:
- Embeddings: BGE-M3 (open-source, on Databricks Model Serving) vs OpenAI Ada-002 (cost vs quality tradeoff)
- Vector DB: Databricks Vector Search vs Pinecone (chose DBS for Unity Catalog governance + Delta Sync)
- LLM: Claude 3.5 Sonnet via Anthropic API (best faithfulness on regulatory text)
- Orchestration: LangGraph (stateful, supports HITL, async, streaming)`,
code:`# APPR Claims RAG Pipeline Architecture
from databricks.vector_search.client import VectorSearchClient
import mlflow
from langchain_databricks import DatabricksVectorSearch, DatabricksEmbeddings, ChatDatabricks

# 1. Vector Search Index (Delta Sync → auto-updates)
vsc = VectorSearchClient()
index = vsc.create_delta_sync_index(
    endpoint_name="appr-vector-endpoint",
    source_table_name="prod.silver.appr_documents_chunked",
    index_name="prod.vector_indexes.appr_regulations",
    primary_key="chunk_id",
    embedding_source_column="chunk_text",
    embedding_model_endpoint_name="databricks-bge-large-en"  # BGE model on Model Serving
)

# 2. Retriever
embeddings = DatabricksEmbeddings(endpoint="databricks-bge-large-en")
retriever = DatabricksVectorSearch(
    index=index,
    embedding=embeddings,
    text_column="chunk_text",
    columns=["chunk_text", "source_doc", "regulation_section"]
).as_retriever(search_kwargs={"k": 5})

# 3. LLM via Foundation Model APIs
llm = ChatDatabricks(
    endpoint="databricks-claude-3-5-sonnet",  # Or external Anthropic endpoint
    max_tokens=1024,
    temperature=0.0   # Deterministic for regulatory Q&A
)

# 4. LangGraph stateful pipeline with HITL
from langgraph.graph import StateGraph
from langgraph.checkpoint.postgres import PostgresSaver

# State tracks: conversation, retrieved docs, confidence, hitl flag
class APPRState(TypedDict):
    query: str
    retrieved_docs: list
    answer: str
    confidence: float
    requires_human_review: bool

# 5. MLflow tracking for RAG evaluation
with mlflow.start_run(run_name="appr-rag-eval"):
    mlflow.log_param("chunk_size", 512)
    mlflow.log_param("top_k", 5)
    mlflow.log_param("embedding_model", "bge-large-en")
    # RAGAS metrics
    mlflow.log_metric("faithfulness", 0.87)
    mlflow.log_metric("answer_relevancy", 0.91)
    mlflow.log_metric("context_recall", 0.89)`,
tags:['RAG','APPR','LangGraph','Vector Search','MLflow','Model Serving','HITL','Foundation Model','LangChain','Semantic Caching','RAGAS']},

{q:'How do you design a multi-team Databricks workspace? Explain workspace governance, cluster policies, and Unity Catalog design.',diff:'ar',
simple:`Multi-team Databricks setup requires: separate workspaces per environment (dev/staging/prod), Unity Catalog for cross-workspace governance, cluster policies to control costs per team, and IAM/SCIM for user management.

The key design principle: Unity Catalog provides ONE governance layer across ALL workspaces — you don't need separate metastores per workspace.`,
detailed:`**Workspace topology**:

**Recommended: Environment-based workspace separation**:
- dev-workspace: Free experimentation, dev cluster policies, dev catalogs
- staging-workspace: Pre-prod validation, prod-like cluster policies
- prod-workspace: Production workloads, strict cluster policies, production catalogs

**Unity Catalog metastore design**:
- One metastore per region (attached to all workspaces in that region)
- Catalog per environment: dev_catalog, staging_catalog, prod_catalog
- Or catalog per business domain (data mesh): flights_catalog, loyalty_catalog, finance_catalog
- Schema per team/domain within catalogs: prod.flights.silver, prod.loyalty.gold

**Cluster Policy design by team**:
\`\`\`json
// Data Engineering Policy (higher compute, job clusters)
{
  "node_type_id": {"type": "allowlist", "values": ["i3.2xlarge","i3.4xlarge"]},
  "autoscale.max_workers": {"type": "range", "maxValue": 20},
  "autotermination_minutes": {"type": "fixed", "value": 30}
}

// Data Science Policy (ML, GPU allowed, auto-term required)
{
  "node_type_id": {"type": "allowlist", "values": ["g4dn.xlarge","p3.2xlarge"]},
  "num_workers": {"type": "range", "maxValue": 8},
  "autotermination_minutes": {"type": "range", "maxValue": 60}
}

// Analysts Policy (small SQL clusters only)
{
  "node_type_id": {"type": "fixed", "value": "m5.xlarge"},
  "num_workers": {"type": "fixed", "value": 2},
  "autotermination_minutes": {"type": "fixed", "value": 20}
}
\`\`\`

**RBAC design in Unity Catalog**:
- Groups (synced via SCIM/AAD): data-engineers, data-scientists, analysts, admins
- Catalog-level: GRANT USE CATALOG ON prod TO data-engineers
- Schema-level: GRANT SELECT ON SCHEMA prod.silver TO analysts
- Table-level: GRANT MODIFY ON TABLE prod.bronze.raw_pii TO data-engineers
- Column masking: automatic for PII columns based on group membership

**Cost governance**:
- DBU budgets per workspace/team (Databricks account console)
- Budget alerts at 80%/100% → Slack notification
- Tag clusters by team/project → cost allocation
- SQL Warehouse channel: identify which team's queries cost most

**CI/CD for Databricks**:
- Databricks Asset Bundles (DABs): Infrastructure as code for jobs, pipelines, clusters
- Git integration: notebooks in Databricks connected to GitHub/Azure DevOps
- Deployment: dev → staging → prod using DABs + CI/CD pipeline (GitHub Actions/Azure DevOps)`,
code:`# Databricks Asset Bundle (DAB): Infrastructure as Code
# databricks.yml

bundle:
  name: appr-claims-pipeline

variables:
  env:
    default: dev

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dev.azuredatabricks.net
  prod:
    mode: production
    workspace:
      host: https://prod.azuredatabricks.net

resources:
  pipelines:
    appr_dlt_pipeline:
      name: "APPR Claims DLT Pipeline [\${bundle.target}]"
      catalog: \${bundle.target}_catalog
      schema: silver
      development: \${bundle.target == 'dev'}
      photon: true
      clusters:
        - label: default
          autoscale:
            min_workers: 2
            max_workers: 8
            mode: ENHANCED
      libraries:
        - notebook:
            path: ./pipelines/bronze_ingestion
        - notebook:
            path: ./pipelines/silver_transformation

  jobs:
    daily_gold_refresh:
      name: "Daily Gold Refresh [\${bundle.target}]"
      tasks:
        - task_key: refresh_gold
          pipeline_task:
            pipeline_id: \${resources.pipelines.appr_dlt_pipeline.id}
