{q:'What cluster managers does Spark support? How does Databricks Runtime differ from vanilla Spark on YARN or Kubernetes?',diff:'sr',
simple:`Spark supports three cluster managers: Standalone, Apache YARN, and Kubernetes. Databricks uses its own cluster manager built on cloud auto-scaling (EC2 Auto Scaling Groups on AWS, VMSSes on Azure) — not YARN or standard Kubernetes.

Databricks Runtime (DBR) = Spark + Delta Lake + MLflow + Databricks optimizations (Photon, auto-scaling improvements, IO cache). It's not vanilla Spark.`,
detailed:`**Spark Cluster Managers**:

**Standalone**:
- Spark's built-in cluster manager (no Hadoop needed)
- Simple master-worker architecture
- Good for dedicated Spark clusters on-prem
- Limitation: no fine-grained resource sharing with other frameworks

**Apache YARN** (Hadoop ecosystem):
- Dynamic resource sharing with other Hadoop workloads (Hive, HBase, MR)
- Two deploy modes: client (driver on submitting machine) or cluster (driver on YARN)
- NodeManager reports resource usage to ResourceManager
- Still common in legacy Hadoop on-prem environments
- EMR and Dataproc use YARN for Spark

**Kubernetes (K8s)**:
- Growing adoption for cloud-native Spark
- Each executor = one pod; driver = one pod
- Benefits: fine-grained resource isolation per job, existing K8s infrastructure reuse
- Challenges: shuffle I/O (local disk) vs pod ephemeral storage, startup latency
- spark-on-k8s: use PVCs for shuffle or remote shuffle service

**Databricks Runtime cluster manager**:
- Not YARN, not standard K8s
- Auto Scaling Groups (AWS EC2) / VM Scale Sets (Azure) — cloud-native scaling
- Cluster manager integrated with Databricks control plane
- Warm pools: pre-provisioned instances → reduce startup time
- Enhanced autoscaling for DLT: finer-grained than standard Spark autoscale
- Delta caching: local SSD caching on cluster nodes (transparent, persistent across Spark jobs within session)

**DBR vs vanilla Spark key differences**:
| Feature | Vanilla Spark | Databricks Runtime |
|---|---|---|
| Delta Lake | Not built-in | Deeply integrated |
| Photon | Not available | Vectorized C++ engine |
| MLflow | Not built-in | Pre-installed, auto-configured |
| I/O cache | Not available | Local SSD Delta cache |
| Unity Catalog | Not available | Native integration |
| Autoscaling | Basic | Enhanced (DLT-aware) |
| Observability | Basic Spark UI | Enhanced UI + System Tables |`,
code:`# Spark submit: different cluster managers

# YARN (submit from edge node)
spark-submit \
    --master yarn \
    --deploy-mode cluster \
    --num-executors 10 \
    --executor-memory 8g \
    --executor-cores 4 \
    --class com.company.ETLJob \
    etl-job.jar

# Kubernetes (spark-on-k8s)
spark-submit \
    --master k8s://https://k8s-api-server:6443 \
    --deploy-mode cluster \
    --conf spark.kubernetes.container.image=company/spark:3.4 \
    --conf spark.kubernetes.executor.request.cores=2 \
    --conf spark.kubernetes.namespace=spark-jobs \
    local:///opt/spark/jars/etl-job.jar

# Databricks: cluster config (no spark-submit needed)
# Just define cluster_id in job config or use notebook attached to cluster
# DBR handles provisioning, autoscaling, Delta cache, Photon automatically

# Check which cluster manager is running
print(spark.sparkContext.master)
# Databricks: "local[*]" for single-node or custom master URL
# YARN: "yarn"
# K8s: "k8s://..."

# Databricks: check runtime info
print(spark.conf.get("spark.databricks.sparkContextId"))
print(spark.conf.get("spark.databricks.clusterUsageTags.clusterWorkers"))`,
tags:['Cluster Manager','YARN','Kubernetes','Standalone','Databricks Runtime','DBR vs Spark','Warm Pools','Enhanced Autoscaling','Delta Cache','Photon','EMR']},

{q:'What is the Spark MLlib pipeline API? How does it compare to scikit-learn pipelines?',diff:'sr',
simple:`Spark MLlib Pipeline is Spark's distributed ML framework. Like scikit-learn, it has Pipeline, Transformer, and Estimator abstractions — but operations run distributed across Spark executors on DataFrames.

Key difference: MLlib runs on distributed DataFrames (billions of rows). scikit-learn runs on in-memory NumPy arrays (millions of rows max). Use MLlib when data doesn't fit on one machine; use scikit-learn (via Pandas UDFs or native Python) when data fits in memory.`,
detailed:`**MLlib Pipeline components**:

**Transformer**: Takes a DataFrame, produces a new DataFrame (adds columns)
- VectorAssembler: combines feature columns into a single vector column
- StringIndexer: encodes categorical string → numeric index
- OneHotEncoder: one-hot encodes indexed column
- MinMaxScaler, StandardScaler: normalize features
- Tokenizer, HashingTF: text feature extraction

**Estimator**: Fitted on data (produces a Transformer via fit())
- LinearRegression, LogisticRegression, GBTClassifier, RandomForestClassifier
- KMeans, PCA, ALS (collaborative filtering)
- CrossValidator, TrainValidationSplit: hyperparameter tuning

**Pipeline**: Chain of Stages (Transformers + Estimators)
- pipeline.fit(train_df) → PipelineModel
- PipelineModel.transform(test_df) → predictions DataFrame
- Serializable: save/load with .save() / PipelineModel.load()

**MLlib vs scikit-learn decision**:
- Data > 10M rows or doesn't fit in RAM → MLlib (distributed)
- Data fits in RAM → scikit-learn (much richer API, easier, more algorithms)
- Best of both: train with scikit-learn on a sample → Pandas UDF for distributed scoring

**MLlib limitations**:
- Fewer algorithms than scikit-learn (no ARIMA, limited deep learning)
- Hyperparameter tuning slower (CrossValidator on cluster vs local optuna)
- Feature engineering less flexible than pandas/sklearn
- 2024 recommendation: use MLlib for distributed training only; use scikit-learn + Pandas UDF for scoring

**SparkML vs spark.ml**:
- Old API: org.apache.spark.mllib (RDD-based) → deprecated
- Current API: org.apache.spark.ml (DataFrame-based) → use this`,
code:`from pyspark.ml import Pipeline
from pyspark.ml.feature import (VectorAssembler, StringIndexer,
                                 OneHotEncoder, StandardScaler)
from pyspark.ml.classification import GBTClassifier
from pyspark.ml.evaluation import BinaryClassificationEvaluator
from pyspark.ml.tuning import CrossValidator, ParamGridBuilder

# MLlib Pipeline for flight delay prediction
# Step 1: Feature engineering stages
carrier_indexer = StringIndexer(
    inputCol="carrier_code", outputCol="carrier_idx", handleInvalid="keep"
)
carrier_ohe = OneHotEncoder(inputCols=["carrier_idx"], outputCols=["carrier_ohe"])

assembler = VectorAssembler(
    inputCols=["carrier_ohe", "distance_km", "departure_hour", "is_weekend"],
    outputCol="features"
)
scaler = StandardScaler(inputCol="features", outputCol="scaled_features")

# Step 2: Model
gbt = GBTClassifier(
    featuresCol="scaled_features",
    labelCol="is_delayed",
    maxDepth=6,
    numTrees=100
)

# Step 3: Pipeline (chain stages)
pipeline = Pipeline(stages=[carrier_indexer, carrier_ohe, assembler, scaler, gbt])

# Step 4: Hyperparameter tuning
param_grid = (ParamGridBuilder()
    .addGrid(gbt.maxDepth, [4, 6, 8])
    .addGrid(gbt.numTrees, [50, 100, 200])
    .build())

cv = CrossValidator(
    estimator=pipeline,
    estimatorParamMaps=param_grid,
    evaluator=BinaryClassificationEvaluator(labelCol="is_delayed", metricName="areaUnderROC"),
    numFolds=3,
    parallelism=4       # Train 4 models in parallel
)

# Fit on training data
cv_model = cv.fit(train_df)

# Save best model
cv_model.bestModel.save("/Volumes/main/models/flight-delay-pipeline")

# Load and predict
from pyspark.ml import PipelineModel
loaded_model = PipelineModel.load("/Volumes/main/models/flight-delay-pipeline")
predictions = loaded_model.transform(test_df)`,

{q:'How does Spark handle schema evolution? What are the strategies for handling changing schemas in production?',diff:'pr',
simple:`Schema evolution — source data adds/renames/drops columns over time. Three approaches:
• mergeSchema: Union of source and existing schema (adds new columns, keeps existing)
• Schema-on-read: Define schema at read time (strict — any extra columns cause errors)
• schemaEvolutionMode in Auto Loader: addNewColumns, rescue, failOnNewColumns

Delta Lake handles schema evolution gracefully with mergeSchema option.`,
detailed:`**Schema evolution scenarios**:

1. New column added to source: most common, usually safe
2. Column dropped from source: dangerous — downstream pipelines break if they expect that column
3. Column renamed: most dangerous — appears as drop + add → data loss if not handled
4. Type change (int → long): usually safe (widening); can break (string → int)

**Delta Lake schema handling**:

**Schema enforcement** (default):
- Writes that don't match the Delta table schema → rejected with AnalysisException
- Protects data quality but blocks legitimate schema changes

**Schema evolution** (opt-in):
- mergeSchema=True: allow new columns to be added; old columns get NULLs for new rows
- overwriteSchema=True: completely replace schema (destructive — use with care)

**Auto Loader schema evolution options**:
- cloudFiles.schemaEvolutionMode=addNewColumns: new columns added to inferred schema
- cloudFiles.schemaEvolutionMode=rescue: new columns written to _rescued_data JSONB column
- cloudFiles.schemaEvolutionMode=failOnNewColumns: fail pipeline when new column detected
- cloudFiles.schemaEvolutionMode=none: ignore new columns (data lost silently)

**DLT schema evolution**:
- DLT Streaming Tables: automatically handles schema evolution from Auto Loader sources
- APPLY CHANGES: handles column additions gracefully

**Production best practices**:
1. Bronze: accept anything (schemaEvolutionMode=addNewColumns or rescue)
2. Silver: explicit schema validation via DLT Expectations + rescue column
3. Gold: strict schema (schema enforcement on) — consumers depend on stable Gold schema
4. Schema registry: use Confluent Schema Registry for Kafka sources → Avro schema evolution rules
5. Data contracts: document expected schema per table with owner accountability`,
code:`# Schema evolution strategies

# 1. Auto Loader: add new columns automatically
bronze_stream = (spark.readStream
    .format("cloudFiles")
    .option("cloudFiles.format", "json")
    .option("cloudFiles.schemaLocation", "/schemas/flights")
    .option("cloudFiles.schemaEvolutionMode", "addNewColumns")   # New cols added
    .option("cloudFiles.inferColumnTypes", "true")
    .load("s3://bucket/landing/flights/"))

# 2. Auto Loader: rescue unknown columns (don't lose data, don't break pipeline)
bronze_rescued = (spark.readStream
    .format("cloudFiles")
    .option("cloudFiles.format", "json")
    .option("cloudFiles.schemaEvolutionMode", "rescue")          # Unknown cols → _rescued_data
    .option("rescuedDataColumn", "_rescued_data")
    .load("s3://bucket/landing/flights/"))

# 3. Delta: write with schema evolution
df_new_cols.write \
    .format("delta") \
    .option("mergeSchema", "true") \       # Adds new columns to Delta table
    .mode("append") \
    .saveAsTable("silver.flights")

# 4. Detect schema changes and alert
from delta.tables import DeltaTable

def check_schema_drift(table_name: str, expected_schema):
    current = spark.table(table_name).schema
    expected_fields = set(f.name for f in expected_schema.fields)
    current_fields  = set(f.name for f in current.fields)
    added   = current_fields - expected_fields
    dropped = expected_fields - current_fields
    if added or dropped:
        raise Exception(f"Schema drift detected! Added: {added}, Dropped: {dropped}")

# 5. DLT: schema evolution handled automatically in streaming tables
# Bronze Auto Loader → DLT automatically propagates new columns downstream`,
tags:['Schema Evolution','mergeSchema','Auto Loader','schemaEvolutionMode','Rescue Column','Delta Lake','Schema Enforcement','Data Contracts','Schema Registry','Bronze Silver Gold']},

{q:'What is the Pandas API on Spark (pyspark.pandas)? When should you use it instead of PySpark DataFrame?',diff:'sr',
simple:`The Pandas API on Spark (formerly Koalas, now pyspark.pandas) provides a pandas-compatible interface on top of Spark — same API, distributed execution. You can run your existing pandas code on billions of rows with minimal changes.

Use it when: migrating existing pandas codebases to Spark, or when your team knows pandas but not PySpark. Avoid for performance-critical pipelines — native PySpark DataFrame with built-in functions is faster.`,
detailed:`**What pyspark.pandas provides**:
- Almost identical API to pandas: df.head(), df.groupby(), df.merge(), df.plot(), etc.
- Runs on Spark under the hood (distributed execution)
- Lazy evaluation with Spark backend
- In Databricks: import pyspark.pandas as ps (DBR 10+)

**Key differences from pandas**:
- Not all pandas operations supported (check pyspark.pandas compatibility list)
- Operations that require full data (sort, percentile) trigger full shuffles
- Index semantics differ: Spark doesn't have true pandas index → operations on index = expensive shuffles
- Performance: pyspark.pandas adds overhead vs native PySpark API

**When to use pyspark.pandas**:
✅ Migrating existing pandas scripts to run on large data
✅ Data scientists who know pandas but not PySpark
✅ Interactive exploration with pandas-like syntax
✅ Using pandas-specific libraries (statsmodels, seaborn) on distributed data via toPandas()

**When to use native PySpark DataFrame**:
✅ Performance-critical production pipelines
✅ SQL/Spark-native operations (groupBy/agg, join, window)
✅ Streaming (pyspark.pandas doesn't support streaming)
✅ Any operation that uses Catalyst optimizer benefits (predicate pushdown, column pruning)

**Performance impact**:
pyspark.pandas: additional abstraction layer + some operations force eager evaluation
Native PySpark: Catalyst-optimized, lazy evaluation, Photon-compatible

**Interoperability**:
\`\`\`python
# Convert between APIs
ps_df = ps.from_pandas(pandas_df)         # pandas → pyspark.pandas
spark_df = ps_df.to_spark()               # pyspark.pandas → PySpark DataFrame
ps_df2 = spark_df.pandas_api()            # PySpark DataFrame → pyspark.pandas
local_df = spark_df.toPandas()            # PySpark → local pandas (collect!)
\`\`\``,
code:`import pyspark.pandas as ps
import pandas as pd

# pyspark.pandas: pandas-like syntax, distributed execution
ps_flights = ps.read_delta("prod.silver.flights")

# Same as pandas:
delayed = ps_flights[ps_flights["delay_min"] > 30]
avg_by_carrier = delayed.groupby("carrier_code")["delay_min"].mean()
print(avg_by_carrier.sort_values(ascending=False).head(10))  # Pandas-style output

# Operations that trigger eager evaluation (watch for performance):
ps_flights.sort_values("delay_min")   # Requires global sort → shuffle!
ps_flights["delay_min"].percentile(95)  # Requires all data on one node

# Interoperability: start in pyspark.pandas, switch to PySpark for performance
ps_df = ps.read_delta("prod.silver.flights")
# Do pandas-style exploration
print(ps_df.describe())
print(ps_df.dtypes)

# Switch to PySpark DataFrame for production logic
spark_df = ps_df.to_spark()
result = (spark_df
    .groupBy("carrier_code")
    .agg(F.avg("delay_min"), F.count("*"))
    .orderBy(F.desc("avg(delay_min)")))

# Enabling pyspark.pandas options
ps.set_option("compute.default_index_type", "sequence")    # Default index
ps.set_option("compute.shortcut_limit", 1000)              # max rows for shortcut
ps.set_option("display.max_rows", 1000)`,

{q:'What is GraphFrames? How do you use Spark for graph processing?',diff:'sr',
simple:`GraphFrames is a Spark package for graph processing built on DataFrames (vs GraphX which is RDD-based). It represents a graph as two DataFrames: a vertices DataFrame and an edges DataFrame. Supports: BFS (breadth-first search), shortest paths, connected components, PageRank, triangle counting.

Use cases: fraud ring detection, airline route optimization, social network analysis, supply chain graphs, knowledge graphs.`,
detailed:`**GraphFrames vs GraphX**:
- GraphX: RDD-based, legacy (Spark 1.x), still available but not actively developed
- GraphFrames: DataFrame-based, integrates with Catalyst optimizer, works with Spark ML/SQL
- GraphFrames: preferred for new code

**Graph representation**:
- Vertices DataFrame: must have an "id" column. Any other columns = vertex properties.
- Edges DataFrame: must have "src" and "dst" columns. Any other = edge properties.

**Core GraphFrames algorithms**:
1. BFS (Breadth-First Search): Find shortest path from one vertex to another
2. Shortest Paths: Shortest path from a vertex to a set of landmark vertices
3. Connected Components: Find clusters of connected vertices
4. Strongly Connected Components: Directed graph — find nodes reachable from each other
5. Triangle Counting: Count triangles per vertex (friend-of-friend density)
6. PageRank: Vertex importance based on incoming edges
7. Label Propagation: Community detection

**Graph Motif Finding** (pattern matching):
- GraphFrames can find patterns like: "(a)-[e]->(b)" (find all edges from a to b)
- "(a)-[e1]->(b); (b)-[e2]->(c)" (find all paths of length 2)
- Use for: fraud ring detection (circular payment patterns), route analysis

**Aviation use case**:
- Vertices: airports (with properties: city, country, capacity)
- Edges: flights (with properties: carrier, frequency, avg_delay)
- PageRank: find most connected hub airports
- Connected components: find disjoint route networks
- Shortest paths: minimum connection hops between any two airports`,
code:`from graphframes import GraphFrame
from pyspark.sql import functions as F

# Create airport network graph
vertices = spark.createDataFrame([
    ("YYZ", "Toronto", "CA"),
    ("YVR", "Vancouver", "CA"),
    ("LAX", "Los Angeles", "US"),
    ("JFK", "New York", "US"),
    ("LHR", "London", "GB")
], ["id", "city", "country"])

edges = spark.table("gold.flight_routes").select(
    F.col("origin_airport").alias("src"),
    F.col("dest_airport").alias("dst"),
    "carrier_code", "weekly_frequency", "avg_delay_min"
)

# Create graph
g = GraphFrame(vertices, edges)

# 1. PageRank: find most important hub airports
pr = g.pageRank(resetProbability=0.15, tol=0.01)
pr.vertices.select("id", "city", "pagerank") \
    .orderBy(F.desc("pagerank")).show(10)

# 2. Connected components: find isolated route clusters
sc = g.connectedComponents()
sc.groupBy("component").count().orderBy(F.desc("count")).show()

# 3. BFS: find path from YYZ to LHR with max 2 hops
paths = g.bfs(
    fromExpr="id = 'YYZ'",
    toExpr  ="id = 'LHR'",
    maxPathLength=2
)
paths.show()

# 4. Motif finding: detect triangular flight patterns (hub connections)
triangles = g.find("(a)-[e1]->(b); (b)-[e2]->(c); (c)-[e3]->(a)")
triangles.select("a.id","b.id","c.id").distinct().show()

# 5. Shortest paths to hub airports
landmarks = ["JFK", "LHR", "DXB"]
sp = g.shortestPaths(landmarks=landmarks)
sp.select("id", "distances").show(truncate=False)`,
tags:['GraphFrames','GraphX','Graph Processing','PageRank','Connected Components','BFS','Shortest Paths','Motif Finding','Fraud Detection','Airport Network','Triangle Counting']},
]},

{id:'dlt',icon:'🔗',label:'Delta Live Tables',desc:'Declarative pipelines, expectations, DLT architecture',qs:[
{q:'What is Delta Live Tables (DLT)? How does it differ from writing Spark jobs manually?',diff:'sr',
simple:`Delta Live Tables (DLT) is Databricks' declarative framework for building data pipelines. You declare WHAT your tables should contain (using SQL or Python @dlt.table decorators), and DLT handles HOW: scheduling, dependency resolution, error recovery, data quality enforcement, and monitoring.

vs. manual Spark: You write Python/SQL; DLT handles orchestration, retries, Delta OPTIMIZE, and schema management automatically.`,
detailed:`**DLT key concepts**:

**Streaming Tables** (DLT equivalent of writeStream to Delta):
- Continuously or incrementally process data from a streaming source (Auto Loader, Kafka, Delta CDF)
- Only processes NEW data since last run (incremental by default)
- Use for: Ingestion (Bronze), event-driven Silver tables

**Materialized Views** (DLT equivalent of batch write to Delta):
- Full recomputation on each pipeline run (or incremental if Spark can determine changes)
- No streaming source required — can read from any Delta table
- Use for: Aggregations, Gold layer tables, complex transformations

**Data Quality (Expectations)**:
- @dlt.expect("valid_delay", "delay_min >= 0"): Log violations, don't fail
- @dlt.expect_or_drop("valid_carrier", "carrier_code IS NOT NULL"): Drop violating rows
- @dlt.expect_or_fail("no_duplicates", "..."): Fail entire pipeline on violation
- Violations tracked in event log and DLT UI (data quality dashboard built-in)

**DLT vs manual pipelines**:
| Aspect | Manual Spark | DLT |
|---|---|---|
| Dependencies | Manual ordering/orchestration | Automatic DAG from lineage |
| Error recovery | Custom retry logic | Built-in, configurable |
| Data quality | Custom checks | Declarative Expectations |
| Monitoring | External tools | Built-in pipeline UI |
| OPTIMIZE/VACUUM | Manual scheduling | Auto-managed |
| Schema evolution | Manual handling | Automatic |
| Development | Flexible | More constrained |

**DLT pipelines run in two modes**:
- Triggered: Run once (like a batch job), then stop. For scheduled pipelines.
- Continuous: Always-on streaming. For low-latency streaming use cases.

**Enhanced Autoscaling** (DLT-specific):
- DLT clusters automatically scale workers up/down based on streaming backlog
- Different from standard Databricks autoscaling (better for streaming)`,
code:`# DLT Pipeline in Python
import dlt
from pyspark.sql import functions as F

# Bronze: Streaming table from Auto Loader
@dlt.table(
    name="bronze_flights",
    comment="Raw flight events from S3 landing zone",
    table_properties={"quality": "bronze"}
)
def bronze_flights():
    return (spark.readStream
        .format("cloudFiles")
        .option("cloudFiles.format", "json")
        .option("cloudFiles.schemaLocation", "/schemas/flights")
        .load("s3://bucket/landing/flights/"))

# Silver: Streaming table with data quality expectations
@dlt.table(
    name="silver_flights",
    comment="Cleaned and validated flight events",
    partition_cols=["flight_date"]
)
@dlt.expect("valid_delay", "delay_minutes >= -30")           # Log violations
@dlt.expect_or_drop("valid_carrier", "carrier_code IS NOT NULL")  # Drop bad rows
@dlt.expect_or_fail("no_null_flight_id", "flight_id IS NOT NULL") # Fail pipeline
def silver_flights():
    return (dlt.read_stream("bronze_flights")   # Read from upstream DLT table
        .filter(F.col("status").isin(["DELAYED","ON_TIME","CANCELLED"]))
        .withColumn("flight_date", F.to_date("event_timestamp"))
        .withColumn("delay_category",
            F.when(F.col("delay_minutes") > 180, "MAJOR")
            .when(F.col("delay_minutes") > 45, "MODERATE")
            .otherwise("MINOR")))

# Gold: Materialized View (batch aggregation)
@dlt.table(name="gold_carrier_performance")
def gold_carrier_performance():
    return (dlt.read("silver_flights")  # Non-streaming read
        .groupBy("carrier_code", "flight_date")
        .agg(
            F.avg("delay_minutes").alias("avg_delay"),
            F.count("*").alias("total_flights"),
            F.sum(F.when(F.col("status")=="CANCELLED",1).otherwise(0)).alias("cancellations")
        ))`,
tags:['Delta Live Tables','DLT','Streaming Table','Materialized View','Expectations','Data Quality','Auto Loader','Declarative Pipeline','Triggered','Continuous']},

{q:'Explain DLT Expectations. How do they enforce data quality and what happens to violating rows?',diff:'pr',
simple:`DLT Expectations are declarative data quality rules defined on a table. Three enforcement levels:

• expect: Log violations to the event log but KEEP the row. Monitor quality without blocking.
• expect_or_drop: Drop violating rows, keep the rest. Clean data flows forward.
• expect_or_fail: If ANY row violates, FAIL the entire pipeline immediately. Use for critical invariants.`,
detailed:`**Expectation syntax**:
\`\`\`python
@dlt.expect("name", "SQL_condition")
@dlt.expect_or_drop("name", "SQL_condition")
@dlt.expect_or_fail("name", "SQL_condition")
@dlt.expect_all({"rule1": "cond1", "rule2": "cond2"})  # Multiple rules
@dlt.expect_all_or_drop({"rule1": "cond1", "rule2": "cond2"})
\`\`\`

**When to use each**:
- expect (warn): Monitoring known imperfect sources, tracking quality trends over time, upstream data you don't control
- expect_or_drop: Remove clearly invalid rows (negative prices, null IDs, future dates), keep clean data flowing
- expect_or_fail: Absolutely critical invariants (duplicate flight IDs would corrupt aggregations, missing schema columns)

**Expectation event log**:
All expectation results stored in the DLT event log (Delta table):
- Accessible via: spark.sql("SELECT * FROM event_log('/pipelines/...')")
- DLT UI shows quality dashboard: pass/fail/drop rates per expectation per run
- Alert on expectation failure via DLT notifications

**Advanced expectations patterns**:
\`\`\`python
# Referential integrity (check FK exists in another table)
@dlt.expect_or_drop("valid_airport",
    "EXISTS (SELECT 1 FROM live.dim_airport d WHERE d.iata_code = airport_code)")

# Statistical thresholds (catch anomalies)
# Can't use aggregates directly in expectations — use separate monitoring table

# Multi-column expectations
@dlt.expect("valid_date_range",
    "departure_time < arrival_time AND departure_time >= '2020-01-01'")
\`\`\`

**Quarantine pattern** (capture dropped rows for investigation):
\`\`\`python
@dlt.table("bronze_flights_quarantine")
@dlt.expect_all_or_drop({"valid_carrier": "carrier_code IS NOT NULL"})
def quarantine():
    # Return ONLY the rows that FAILED expectations
    return (dlt.read_stream("bronze_raw")
        .filter(F.col("carrier_code").isNull()))
\`\`\``,
code:`import dlt
from pyspark.sql import functions as F

# Production-grade expectations on Silver table
@dlt.table(
    name="silver_passenger_rights",
    comment="APPR-validated flight disruption records for claims processing"
)
# Log-only: track data issues without blocking
@dlt.expect("valid_delay_range", "delay_minutes BETWEEN -60 AND 1440")
@dlt.expect("has_passenger_count", "passenger_count > 0")

# Drop: clean bad records
@dlt.expect_or_drop("valid_flight_id",   "flight_id IS NOT NULL AND LENGTH(flight_id) > 0")
@dlt.expect_or_drop("valid_flight_date", "flight_date >= '2019-01-01' AND flight_date <= current_date()")
@dlt.expect_or_drop("valid_carrier",     "carrier_code RLIKE '^[A-Z0-9]{2}$'")

# Fail: critical business invariants
@dlt.expect_or_fail("no_duplicate_disruption_id",
    "disruption_id IS NOT NULL")
def silver_passenger_rights():
    return (dlt.read_stream("bronze_appr_events")
        .withColumn("flight_date", F.to_date("departure_time"))
        .withColumn("disruption_type",
            F.when(F.col("delay_minutes") >= 180, "DELAY_3H")
            .when(F.col("is_cancelled"), "CANCELLATION")
            .otherwise("MINOR")))

# Query the event log for quality metrics
expectations_df = spark.sql("""
    SELECT
        timestamp, details.flow_name,
        details.expectations[0].name   AS rule,
        details.expectations[0].passed AS passed_count,
        details.expectations[0].failed AS failed_count
    FROM event_log('/pipelines/my-pipeline-id/system/events')
    WHERE event_type = 'flow_progress'
    ORDER BY timestamp DESC
""")`,
tags:['DLT Expectations','Data Quality','expect_or_drop','expect_or_fail','Event Log','Quarantine Pattern','Data Validation','APPR','Pipeline Quality']},

{q:'How does DLT APPLY CHANGES handle CDC? What are the different modes and how does it compare to writing MERGE manually?',diff:'pr',
simple:`APPLY CHANGES INTO is DLT's built-in CDC (Change Data Capture) handler. It reads change events (inserts, updates, deletes) from a source and automatically applies them to a target Delta table — handling out-of-order events, deduplication, and SCD Type 1/2 automatically.

Much simpler than writing MERGE manually — DLT handles the entire CDC materialization pattern declaratively.`,
detailed:`**APPLY CHANGES syntax**:
\`\`\`python
dlt.apply_changes(
    target="silver.customers",
    source="bronze.customer_changes",
    keys=["customer_id"],
    sequence_by="updated_at",
    apply_as_deletes=expr("op_type = 'DELETE'"),
    stored_as_scd_type=1  # or 2
)
\`\`\`

**How it works under the hood**:
1. Reads new change events from source streaming table
2. For each key: finds the most recent change (by sequence_by column)
3. Applies the change: INSERT (new key), UPDATE (existing key), DELETE (soft delete)
4. Handles out-of-order: events arriving late are still applied correctly (sequence_by determines order)
5. Deduplicates: multiple events for the same key in same batch → only latest applied

**SCD Type 1 (default — overwrite)**:
- Updates existing row in place
- No history maintained
- Simple, space-efficient

**SCD Type 2 (historical)**:
\`\`\`python
dlt.apply_changes(
    ...,
    stored_as_scd_type=2,
    track_history_column_list=["address","tier","region"]  # Only track changes to these columns
)
\`\`\`
- Creates new row on each tracked column change
- Adds __START_AT, __END_AT system columns for point-in-time queries
- Automatically manages is_current-equivalent logic

**APPLY CHANGES vs manual MERGE**:
| Aspect | APPLY CHANGES | Manual MERGE |
|---|---|---|
| Out-of-order handling | Built-in (sequence_by) | You must handle |
| Deduplication | Automatic | You must deduplicate first |
| SCD Type 2 | Built-in flag | Complex custom logic |
| Error handling | DLT expectations integration | Manual |
| CDC sources | Kafka, Auto Loader, Delta CDF | Any |
| Flexibility | Less (opinionated) | Full control |

**Truncate / Overwrite mode** (new in DLT 2024):
- APPLY CHANGES with apply_as_truncates for full-table refresh events from CDC
- Handles "TRUNCATE + re-seed" patterns from source systems`,
code:`import dlt
from pyspark.sql import functions as F

# SCD Type 1: Apply CDC events (overwrite)
dlt.apply_changes(
    target="silver.passengers",
    source="bronze.passenger_cdc",        # Kafka CDC source (Debezium events)
    keys=["passenger_id"],
    sequence_by="__source_ts_ms",         # Debezium timestamp
    apply_as_deletes=expr("op = 'd'"),    # Delete when op='d'
    except_column_list=["_rescued_data", "__db_name"],  # Skip metadata cols
    stored_as_scd_type=1
)

# SCD Type 2: Track full history
dlt.apply_changes(
    target="silver.customers_history",
    source="bronze.customer_cdc",
    keys=["customer_id"],
    sequence_by="updated_at",
    apply_as_deletes=expr("change_type = 'DELETE'"),
    stored_as_scd_type=2,
    # Only track history for meaningful business columns

{q:'What is the difference between DLT Triggered and Continuous pipeline modes? When do you choose each?',diff:'sr',
simple:`Two DLT pipeline execution modes:

• Triggered: Runs once, processes all available new data, then shuts down cluster. Like a scheduled batch job. Lower cost.
• Continuous: Always-on, processes data with very low latency (seconds). Higher cost (cluster always running).

Triggered for: ETL pipelines where hourly/daily freshness is enough. Continuous for: near-real-time requirements (<1 min latency), event-driven dashboards, real-time fraud detection.`,
detailed:`**Triggered Mode**:
- Cluster spins up → processes all pending data → cluster terminates
- Latency: depends on schedule + cluster start time (typically minutes to hours)
- Cost: Pay only for compute during the run (most efficient for batch workloads)
- Scheduling: triggered via Databricks Workflows cron schedule, file arrival, or API call
- Tables: Updated at end of each triggered run
- Retries: On failure, can re-run from checkpoint (no reprocessing of already-processed data)

**Continuous Mode**:
- Cluster stays running 24/7
- Latency: seconds to sub-minute (data processed as it arrives)
- Cost: Continuous compute cost (significantly higher than triggered)
- Enhanced autoscaling: DLT automatically scales workers based on streaming backlog
- Best for: sub-5-minute data freshness requirements
- Monitoring: Continuous pipeline has active health checks + Slack/email alerts for issues

**AvailableNow trigger** (middle ground, added in DBR 11+):
- Like Triggered but processes all available data in multiple micro-batches (better throughput than single-batch)
- Terminates after all data processed (not continuous)
- Better than Once for catching up on large backlogs

**Decision matrix**:
| Requirement | Mode |
|---|---|
| Daily batch ETL | Triggered (hourly schedule) |
| Near-real-time BI (< 5 min) | Triggered (5-min schedule) |
| Sub-minute latency | Continuous |
| Cost-sensitive analytics | Triggered |
| Real-time fraud detection | Continuous |
| Catch-up after backlog | AvailableNow |

**Cost comparison** (example):
- Triggered hourly (runs 5 min): 5/60 of hourly DBU rate → 8% of continuous cost
- Continuous: 100% of hourly DBU rate
- For non-real-time workloads: triggered is 10-20× cheaper

**Multi-pipeline topology** (common pattern):
- Bronze: Continuous (captures every event immediately)
- Silver: Triggered every 5-15 minutes (balance freshness vs cost)
- Gold: Triggered hourly (aggregations, less frequent need)`,

{q:'How do you unit test and debug Delta Live Tables pipelines? What are the biggest DLT pain points?',diff:'pr',
simple:`DLT is harder to test locally than regular Spark because DLT decorators require a DLT runtime context. Three approaches: (1) extract transformation logic into plain functions testable with PySpark, (2) use DLT development mode (runs pipeline on smaller data with detailed error output), (3) use Databricks Labs dlt-meta or nutter for pipeline-level integration tests.`,
detailed:`**The DLT testing challenge**:
- @dlt.table, @dlt.expect decorators only resolve inside a DLT pipeline run
- You cannot import and run DLT notebooks locally or with plain pytest + SparkSession
- Solution: separate business logic from DLT declarations

**Strategy 1 — Extract logic into testable functions**:
\`\`\`python
# transformations.py — pure Spark, no DLT imports
def transform_silver_flights(df: DataFrame) -> DataFrame:
    return (df
        .filter(F.col("flight_id").isNotNull())
        .withColumn("delay_category",
            F.when(F.col("delay_min") > 180, "MAJOR").otherwise("MINOR")))

# dlt_pipeline.py — DLT declarations only
import dlt
from transformations import transform_silver_flights

@dlt.table(name="silver_flights")
@dlt.expect_or_drop("valid_flight_id", "flight_id IS NOT NULL")
def silver_flights():
    return transform_silver_flights(dlt.read_stream("bronze_flights"))
\`\`\`

Now \`transform_silver_flights\` is testable with plain pytest + SparkSession.

**Strategy 2 — DLT development mode**:
- Set Development mode in pipeline settings
- DLT development mode: retains cluster between runs (faster iteration), shows verbose error output
- Use with a small sample dataset (Auto Loader: restrict to a few files)

**Strategy 3 — Pipeline integration tests with nutter**:
- Databricks/nutter library: run DLT pipeline, assert on resulting Delta tables
- Can run in CI/CD: trigger pipeline run → wait → assert row counts, schema, quality metrics

**Common DLT pain points and workarounds**:
1. No local debugging: workaround = extract logic functions as above
2. Restart latency: DLT cluster takes 3-5 min to start — use dev mode to keep cluster warm
3. Event log querying complexity: requires spark.sql("SELECT ... FROM event_log(...)") with specific path
4. APPLY CHANGES ordering issues: ensure sequence_by column is monotonically increasing and not null
5. Schema evolution restarts: pipeline must restart when DLT detects schema change (brief downtime)
6. Cost of continuous mode: always-on cluster costs — use triggered mode with 5-15 min schedule for most use cases`,
code:`# Strategy 1: Testable DLT — extract logic
# File: src/transformations/silver_flights.py
from pyspark.sql import DataFrame, functions as F

def transform_silver_flights(raw_df: DataFrame) -> DataFrame:
    """Transform raw flight events to silver quality."""
    return (raw_df
        .filter(F.col("flight_id").isNotNull())
        .filter(F.col("carrier_code").rlike(r'^[A-Z0-9]{2}$'))
        .withColumn("delay_category",
            F.when(F.col("delay_min") > 180, "MAJOR")
            .when(F.col("delay_min") > 45,  "MODERATE")
            .otherwise("MINOR"))
        .withColumn("flight_date", F.to_date("departure_time")))

# File: tests/test_silver_flights.py

{q:'What is the DLT event log? How do you monitor pipeline health and diagnose failures programmatically?',diff:'pr',
simple:`The DLT event log is a Delta table at /pipelines/{pipeline_id}/system/events that records every pipeline event: pipeline starts/stops, flow progress (records processed + expectation results), data quality violations, errors, and schema changes. You query it with SQL like any Delta table to build monitoring dashboards.`,
detailed:`**Event log schema** (key fields):
- id: unique event ID
- timestamp: when the event occurred
- event_type: flow_progress, create_update, maintenance_progress, user_action, error
- level: INFO, WARN, ERROR
- details: JSON struct containing event-specific data
  - For flow_progress: records_written, records_dropped, expectations results
  - For error: message, stack trace, fatal_error flag
- maturity_level: STABLE (reliable schema) vs EVOLVING (subject to change)

**Key event types to monitor**:
- flow_progress: emitted after each micro-batch, contains quality metrics
- maintenance_progress: OPTIMIZE/VACUUM runs on pipeline tables
- create_update: pipeline definition changed
- error: pipeline-level failures

**Querying expectations from event log**:
\`\`\`sql
SELECT
    details:flow_name::STRING              AS table_name,
    details:expectations[0].name::STRING   AS rule,
    details:expectations[0].passed::LONG   AS passed,
    details:expectations[0].failed::LONG   AS failed
FROM event_log('/pipelines/{id}/system/events')
WHERE event_type = 'flow_progress'
ORDER BY timestamp DESC
\`\`\`

**Production monitoring dashboard** (Databricks SQL):
1. Pipeline run frequency + duration trend
2. Records ingested per table per run
3. Expectation pass rates over time (detect data quality degradation)
4. Error count and stack traces (alert on ERROR events)
5. Records dropped by each expect_or_drop rule

**Programmatic access** (via REST API):
- GET /api/2.0/pipelines/{pipeline_id}/events → paginated event list
- Filter by level=ERROR for failure alerting
- Integrate with PagerDuty/Slack via Databricks Alerts or custom webhook`,
code:`-- DLT Event Log: comprehensive monitoring queries

-- 1. Recent pipeline run summary (last 7 days)
SELECT
    DATE_TRUNC('hour', timestamp)               AS run_hour,
    event_type,
    level,
    details:origin:flow_name::STRING            AS flow_name,
    details:metrics:num_output_rows::LONG       AS records_out,
    details:metrics:num_dropped_records::LONG   AS records_dropped
FROM event_log('/pipelines/appr-pipeline-id/system/events')
WHERE timestamp >= DATEADD(DAY, -7, CURRENT_TIMESTAMP())
  AND event_type = 'flow_progress'
ORDER BY timestamp DESC;

-- 2. Expectation violation trend (quality degradation detection)
SELECT
    DATE_TRUNC('day', timestamp)                   AS day,
    details:origin:flow_name::STRING               AS table_name,
    EXPLODE(details:expectations)                  AS expectation
FROM event_log('/pipelines/appr-pipeline-id/system/events')
WHERE event_type = 'flow_progress'
  AND timestamp >= DATEADD(DAY, -30, CURRENT_TIMESTAMP())
) e
SELECT day, table_name,
    expectation.name                               AS rule_name,
    SUM(expectation.passed)                        AS total_passed,
    SUM(expectation.failed)                        AS total_failed,
    ROUND(100.0 * SUM(expectation.passed) /
        NULLIF(SUM(expectation.passed + expectation.failed), 0), 2) AS pass_rate
GROUP BY 1, 2, 3
ORDER BY 1 DESC, pass_rate ASC;

-- 3. Pipeline errors (for alerting)
SELECT timestamp, level,
    details:error:fatal_error::STRING              AS error_msg,
    details:error:cause::STRING                    AS stack_trace
FROM event_log('/pipelines/appr-pipeline-id/system/events')
WHERE level = 'ERROR'
  AND timestamp >= DATEADD(HOUR, -24, CURRENT_TIMESTAMP())
ORDER BY timestamp DESC;

# Python: programmatic event log access
pipeline_id = "appr-pipeline-id"
events_df = spark.sql(f"""
    SELECT * FROM event_log(
        '/pipelines/{pipeline_id}/system/events'
    )
    WHERE event_type = 'flow_progress'
      AND timestamp >= DATEADD(HOUR, -1, CURRENT_TIMESTAMP())
""")`,

{q:'What is MLflow? Explain its four core components and how they work together.',diff:'sr',
simple:`MLflow is an open-source platform for managing the ML lifecycle. It's deeply integrated into Databricks.

Four components:
• MLflow Tracking: Log experiments (parameters, metrics, artifacts, code versions) — compare runs
• MLflow Projects: Package ML code for reproducibility
• MLflow Models: Standard format for packaging ML models from any framework
• MLflow Model Registry: Versioned model store with staging/production lifecycle management`,
detailed:`**MLflow Tracking** (most commonly used):
- Every experiment run logs: parameters (hyperparameters), metrics (loss, accuracy, AUC), artifacts (model files, plots, data samples), tags, source code version
- Organized into Experiments (logical groupings of related runs)
- Compare runs: find best hyperparameters, track training progress
- In Databricks: tracking server is automatically set up — no configuration needed
- Autologging: many frameworks (sklearn, XGBoost, LightGBM, PyTorch, TF) auto-log without any code changes

**MLflow Projects**:
- MLproject file: defines entry points, dependencies (conda/pip), parameters
- Makes experiments reproducible: anyone can run your project from git with mlflow run github.com/...
- Less commonly used in practice (Docker/Wheel packages serve similar purpose)

**MLflow Models** (mlflow.models.Model):
- Standard packaging format for ANY ML framework
- Includes: model weights, conda environment, pip requirements, model signature (input/output schema)
- Model flavors: sklearn, tensorflow, pytorch, pyfunc (custom), spark, xgboost, lightgbm, huggingface
- pyfunc (Python function) flavor: universal serving interface — any model logged as pyfunc can be served the same way

**MLflow Model Registry** (production workflow):
- Versioned model store: each logged model can be registered with a version number
- Lifecycle stages: None → Staging → Production → Archived
- Transition history and comments: auditable promotion path
- Annotations: descriptions, tags, responsible team
- Databricks Unity Catalog Model Registry: models registered in Unity Catalog namespace (catalog.schema.model_name) — fine-grained access control per model

**Databricks-specific features**:
- Auto experiment creation from notebooks
- Run comparison UI built into Databricks
- Model lineage: trace a model back to its training data and code
- Feature Store integration: training data automatically linked to Feature Store features`,
code:`import mlflow
import mlflow.sklearn
from sklearn.ensemble import GradientBoostingClassifier
from sklearn.metrics import roc_auc_score

# Set experiment
mlflow.set_experiment("/Shared/flight-delay-prediction")

# Training run with full tracking
with mlflow.start_run(run_name="gbm-v3-feature-set-2") as run:
    # Log parameters
    params = {"n_estimators": 200, "max_depth": 6, "learning_rate": 0.05}
    mlflow.log_params(params)

    # Train model
    model = GradientBoostingClassifier(**params)
    model.fit(X_train, y_train)

    # Log metrics
    train_auc = roc_auc_score(y_train, model.predict_proba(X_train)[:,1])
    val_auc   = roc_auc_score(y_val,   model.predict_proba(X_val)[:,1])
    mlflow.log_metric("train_auc", train_auc)
    mlflow.log_metric("val_auc",   val_auc)

    # Log model with signature (input/output schema)
    from mlflow.models.signature import infer_signature
    signature = infer_signature(X_train, model.predict(X_train))
    mlflow.sklearn.log_model(model, "gbm-model", signature=signature)

    # Log artifacts
    mlflow.log_artifact("feature_importance.png")

    print(f"Run ID: {run.info.run_id}")

# Register in Unity Catalog Model Registry
mlflow.set_registry_uri("databricks-uc")
result = mlflow.register_model(
    f"runs:/{run.info.run_id}/gbm-model",
    "main.ml_models.flight_delay_classifier"
)`,

{q:'What is MLflow autologging? What does it capture and what are its limitations?',diff:'sr',
simple:`Autologging enables MLflow to automatically log parameters, metrics, and models from supported frameworks without any mlflow.log_* code. One line enables it: mlflow.autolog()

It captures: hyperparameters, training metrics, model artifacts, feature importances (for tree models), training/validation curves. Works with: sklearn, XGBoost, LightGBM, TensorFlow, PyTorch Lightning, Spark ML.`,
detailed:`**Enabling autologging**:
- Global: mlflow.autolog() — enables for all frameworks
- Specific: mlflow.sklearn.autolog(), mlflow.xgboost.autolog(), etc.
- In Databricks: autologging is enabled by default for most frameworks

**What sklearn autologging captures**:
- All __init__ parameters of the estimator/pipeline
- Training metrics: training_score (R², accuracy, etc.)
- Validation metrics if cross-validation used
- Model artifact (saved sklearn model)
- Feature importances (for tree-based models)
- Confusion matrix, precision-recall curve, ROC curve (classification)
- Residual plots (regression)
- Fitted model pipeline structure

**What XGBoost/LightGBM autologging captures**:
- All booster parameters
- Evaluation metrics at each boosting round (logged as metrics over steps)
- Feature importance (gain, weight, cover)
- Best iteration

**Autologging limitations**:
- Custom metrics: Must still use mlflow.log_metric() for business metrics
- Non-standard models: Custom PyTorch/TF training loops may not be captured
- Data logging: Autologging doesn't log training data or feature values
- Batch inference metrics: Only logs training-time metrics
- Production serving metrics: Latency, throughput, drift — must be logged separately

**Best practice in production**:
\`\`\`python
# Use autologging as baseline, supplement with custom logs
mlflow.sklearn.autolog(
    log_input_examples=True,  # Log sample inputs
    log_model_signatures=True,  # Log schema
    log_models=True
)

with mlflow.start_run():
    model.fit(X_train, y_train)
    # Autologging captured above ↑
    # Add business-specific metrics manually:
    mlflow.log_metric("revenue_impact_usd", calculate_business_value(model, X_val))
    mlflow.set_tags({"team": "ml-ops", "data_version": "v3.2"})
\`\`\``,
code:`# Autologging — minimal code, maximum capture
import mlflow
import mlflow.sklearn
from sklearn.pipeline import Pipeline
from sklearn.preprocessing import StandardScaler
from sklearn.ensemble import RandomForestClassifier

# Enable autologging for sklearn
mlflow.sklearn.autolog(
    log_input_examples=True,       # Log sample inputs for schema inference
    log_model_signatures=True,     # Capture input/output schema
    log_models=True,               # Save model artifact
    disable=False,
    exclusive=False,               # Allow manual logging alongside autolog
    silent=True                    # Suppress verbose output
)

with mlflow.start_run(run_name="rf-pipeline-autolog"):
    # Full Pipeline: autologging captures ALL params from each step
    pipeline = Pipeline([
        ("scaler", StandardScaler()),
        ("classifier", RandomForestClassifier(
            n_estimators=100, max_depth=8,
            class_weight="balanced", random_state=42
        ))
    ])
    pipeline.fit(X_train, y_train)
    # Autologged: n_estimators, max_depth, class_weight, all scaler params
    # Autologged: training accuracy, feature importances, confusion matrix

    # Manual supplemental logging
    mlflow.log_metric("business_recall_at_95_precision",
                      get_recall_at_precision(pipeline, X_val, y_val, 0.95))
    mlflow.log_param("feature_set_version", "v2.3")
    mlflow.set_tag("data_engineer", "sid")`,

{q:'Explain the MLflow Model Registry workflow. How do you manage model promotion from Staging to Production?',diff:'pr',
simple:`The Model Registry provides a versioned, governed store for production ML models. Workflow:

1. Log model in an experiment run → register it (gets Version 1 in None stage)
2. Test/validate → transition to Staging
3. A/B test or shadow mode → transition to Production
4. Previous production model → Archived

In Databricks with Unity Catalog: models are registered in catalog.schema.model format with full access control.`,
detailed:`**Model Registry lifecycle stages** (classic MLflow):
- None: Freshly registered, no stage assignment
- Staging: Under evaluation — running tests, benchmarks, shadow mode
- Production: Currently serving live traffic
- Archived: Retired but preserved for audit/rollback

**Unity Catalog Model Registry** (Databricks recommended):
- Models registered as: catalog.schema.model_name
- Fine-grained access control: data stewards control who can promote models
- Model lineage: trace back to training notebook, data used, feature store features
- No manual stage transitions — uses aliases instead (champion, challenger)
- Governance: model approval workflows via Model Registry webhooks

**Production workflow with webhooks/CI**:
1. Training job completes → registers model → triggers Webhook
2. Webhook triggers CI job → runs automated tests (accuracy, latency, bias checks)
3. Tests pass → automatically transition to Staging
4. Manual approval by ML lead → transition to Production
5. Deploy to Model Serving endpoint (reference by alias "champion")

**Model aliasing** (Unity Catalog pattern):
\`\`\`python
client.set_registered_model_alias(
    name="main.ml_models.flight_delay",
    alias="champion",
    version=5
)
# Serving endpoint references alias:
mlflow.pyfunc.load_model("models:/main.ml_models.flight_delay@champion")
\`\`\`

**Rollback**: If production model causes issues:
1. Promote previous "champion" version back to champion alias
2. Update Serving endpoint to reference new champion
3. Typically < 5 minutes to roll back`,
code:`import mlflow
from mlflow.tracking import MlflowClient

client = MlflowClient()

# 1. Register model from training run
model_uri = f"runs:/{run_id}/model"
registered = mlflow.register_model(
    model_uri=model_uri,
    name="main.ml_models.flight_delay_classifier"
)
print(f"Model version: {registered.version}")

# 2. Add description and tags
client.update_model_version(
    name="main.ml_models.flight_delay_classifier",
    version=registered.version,
    description="GBM v3 trained on 2024 data. Val AUC: 0.923"
)
client.set_model_version_tag(
    name="main.ml_models.flight_delay_classifier",
    version=registered.version,
    key="training_data_version", value="v3.2"
)

# 3. Classic MLflow: Transition to Staging
client.transition_model_version_stage(
    name="main.ml_models.flight_delay_classifier",
    version=registered.version,
    stage="Staging",
    archive_existing_versions=False
)

# 4. Unity Catalog: Use aliases instead of stages
client.set_registered_model_alias(
    name="main.ml_models.flight_delay_classifier",
    alias="challenger",        # New model is challenger
    version=registered.version
)

# After A/B test: promote challenger to champion
client.set_registered_model_alias(
    name="main.ml_models.flight_delay_classifier",
    alias="champion",
    version=registered.version  # Challenger becomes champion
)

# 5. Load champion model (in serving or batch inference)
champion = mlflow.pyfunc.load_model(
    "models:/main.ml_models.flight_delay_classifier@champion"
)
predictions = champion.predict(inference_data)`,

{q:'What is MLflow Model Serving on Databricks? How does Mosaic AI Model Serving work?',diff:'pr',
simple:`Databricks Model Serving (Mosaic AI Model Serving) deploys MLflow models as REST API endpoints with one click. It handles: auto-scaling (including scale-to-zero), A/B traffic splitting, GPU serving for LLMs, and payload logging for monitoring.

Endpoint URL: https://<workspace>.azuredatabricks.net/serving-endpoints/<endpoint-name>/invocations`,
detailed:`**Mosaic AI Model Serving features**:

**Deployment**:
- One-click from Model Registry → creates REST endpoint
- Supports: any MLflow pyfunc model, sklearn, XGBoost, LightGBM, TF, PyTorch, LLMs
- Containerized: Each endpoint has isolated, versioned container
- GPU serving: Deploy GPU-accelerated LLMs (Llama 2, Mistral, DBRX)

**Scaling**:
- Auto-scale: 0 to N replicas based on traffic
- Scale-to-zero: Cost optimization for low-traffic endpoints (cold start latency)
- Compute types: CPU (general), GPU Small (small LLMs), GPU Medium (Llama-13B), GPU Large (70B+)

**Traffic splitting** (A/B testing):
- Split traffic between model versions: 90% v1 (champion) + 10% v2 (challenger)
- No code change on client side — routing handled by serving layer

**Payload logging** (model monitoring):

- Used for: data drift detection, prediction distribution monitoring, ground truth joining

**External model endpoint** (Foundation Model APIs):
- Serve OpenAI, Anthropic, Amazon Bedrock models through unified Databricks endpoint
- Same invocation API as custom models
- Route: Databricks → your VPC's external model → unified response

{q:'What is an MLflow model signature and why is it critical for production serving?',diff:'sr',
simple:`A model signature defines the expected input schema (column names + types) and output schema of an MLflow model. Stored with the model artifact when logged.

In production: Model Serving validates every inference request against the signature before calling the model — catching type mismatches and missing columns immediately with a clear error instead of a cryptic failure deep in the model code.`,
detailed:`**Model Signature components**:
- inputs: SchemaSpec of column names + types expected by the model
- outputs: SchemaSpec of what the model returns
- params: Optional overridable inference params (temperature, max_tokens for LLMs)

**Why signatures matter**:
1. Schema validation at serving time: 400 error on bad request before any ML compute wasted
2. API documentation: signature IS the contract — consumers know what to send
3. Drift detection: Lakehouse Monitoring compares incoming requests against signature
4. Safe model loading: mlflow.pyfunc.load_model validates against signature

**Inference signature** (inferred from data):
signature = infer_signature(X_train, model.predict(X_train))
→ Inspects Pandas/Spark DataFrame schemas automatically

**Manual signature** (for complex models):
\`\`\`python
input_schema = Schema([ColSpec("string", "carrier_code"), ColSpec("double", "delay_min")])
output_schema = Schema([ColSpec("double", "delay_probability")])
signature = ModelSignature(inputs=input_schema, outputs=output_schema)
\`\`\`

**Input examples** (complement to signature):
- A sample 3-5 rows logged with the model
- Used for: Model Serving UI testing, documentation, auto-generating client code
- Log with: mlflow.log_model(..., input_example=X_train.head(3))

**Signature enforcement in Model Serving**:
- Validates every /invocations request
- Missing required column → 422 with field-level error message
- Wrong type → tries reasonable coercion (int → float); fails if incompatible
- Extra columns → passed through (ignored by default)`,
code:`import mlflow
from mlflow.models.signature import infer_signature, ModelSignature
from mlflow.types.schema import Schema, ColSpec

# Method 1: Infer from data (recommended, automatic)
with mlflow.start_run():
    model.fit(X_train, y_train)
    predictions = model.predict(X_train)

    signature = infer_signature(
        model_input=X_train,       # Input schema inferred from DataFrame
        model_output=predictions   # Output schema inferred from predictions
    )
    # Logs: {carrier_code: string, delay_min: double, distance_km: long} → {delay_prob: double}

    mlflow.sklearn.log_model(
        model, "delay-model",
        signature=signature,
        input_example=X_train.head(3)  # Sample rows for documentation
    )

# Method 2: Manual for custom models
signature = ModelSignature(
    inputs=Schema([
        ColSpec("string", "carrier_code"),
        ColSpec("double", "delay_minutes"),
        ColSpec("string", "origin_airport")
    ]),
    outputs=Schema([
        ColSpec("double", "delay_probability"),
        ColSpec("string", "delay_category")
    ])
)

# Validate before logging
from mlflow.models.signature import validate_schema
validate_schema(X_test, signature.inputs)  # Raises if mismatch

# Test serving endpoint with signature-compliant payload
payload = {
    "dataframe_records": [{
        "carrier_code": "AC",
        "delay_minutes": 45.0,
        "origin_airport": "YYZ"
    }]
}`,

{q:'What is MLflow Evaluation? How do you evaluate LLM/RAG quality at scale?',diff:'pr',
simple:`mlflow.evaluate() is a structured framework for automated model assessment. For traditional ML: computes accuracy, AUC, F1, confusion matrices. For LLM/RAG: evaluates faithfulness, answer relevancy, context recall, and toxicity — using LLM-as-a-judge or built-in scorers.

For your APPR chatbot: you'd use RAGAS metrics logged via MLflow to compare different RAG configurations (chunk sizes, top-K, models) systematically across experiments.`,
detailed:`**mlflow.evaluate() for classification/regression**:
- Auto-computes: accuracy, F1, precision, recall, ROC-AUC, log loss (classification)
- Fairness analysis: per-slice metrics to detect bias across demographic groups
- SHAP explainability: feature importance plots auto-logged as artifacts
- Calibration curve: assess prediction confidence calibration

**mlflow.evaluate() for LLM/RAG** (MLflow 2.8+):
- Built-in scorers: toxicity, readability (Flesch-Kincaid), perplexity
- LLM-as-judge scorers: faithfulness, coherence, answer_correctness, relevance
- Judge model: any Model Serving endpoint (Claude, GPT-4, DBRX) evaluates generated text
- Batch evaluation: runs your eval dataset through the model + judge, logs all scores

**RAGAS integration pattern**:
\`\`\`python
from ragas import evaluate
from ragas.metrics import faithfulness, answer_relevancy, context_recall, context_precision
from datasets import Dataset

ragas_scores = evaluate(Dataset.from_pandas(eval_df),
                         metrics=[faithfulness, answer_relevancy, context_recall])
mlflow.log_metrics({
    "ragas_faithfulness": ragas_scores["faithfulness"],
    "ragas_answer_relevancy": ragas_scores["answer_relevancy"],
    "ragas_context_recall": ragas_scores["context_recall"]
})
\`\`\`

**Evaluation-driven RAG development** (your APPR chatbot approach):
1. Build eval dataset: 200 Q&A pairs from APPR regulations with ground-truth answers
2. Establish baseline: chunk_size=512, top_k=5, temp=0.0 → RAGAS scores
3. Experiment: vary hyperparameters, log all scores to same MLflow experiment
4. Compare runs: use MLflow UI to find optimal configuration
5. Promote: register best model version to Model Registry`,

import pandas as pd

# Evaluation dataset

    {
        "question": "What compensation for 3h delay on Air Canada domestic flight?",
        "answer": model_response,           # Your RAG model's response

        "ground_truth": "Standard comp..."  # Human-verified correct answer
    }
    for question, model_response, retrieved_docs, ground_truth in eval_data

{q:'How do you compare MLflow runs and select the best model? Walk through your experiment management workflow.',diff:'sr',
simple:`MLflow experiment management: log all experiments to the same named experiment → compare runs in the MLflow UI or via MlflowClient API → filter/sort by primary metric → register the winning run's model to Model Registry.

Key practice: every run must be reproducible — log the exact data version, code commit hash, and all hyperparameters so you can recreate any run.`,
detailed:`**Experiment management best practices**:

**1. Consistent experiment naming**:
- One experiment per model type / problem: /Shared/appr-delay-classifier
- All runs for that problem go into the same experiment
- Never put unrelated models in the same experiment

**2. Log everything for reproducibility**:
\`\`\`python
with mlflow.start_run(run_name="gbm-v3-feat-set-2"):
    mlflow.log_param("data_version", "silver.flights@v42")
    mlflow.log_param("git_commit", subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip())
    mlflow.log_params({"n_estimators":200, "max_depth":6, "lr":0.05})
    # ... train ...
    mlflow.log_metric("val_auc", 0.923)
    mlflow.set_tag("feature_set", "v2_with_route_history")
    mlflow.set_tag("data_engineer", "sid")
\`\`\`

**3. Programmatic run comparison**:
- MlflowClient.search_runs(): filter + sort across hundreds of runs
- mlflow.search_runs(): returns pandas DataFrame — easy analysis

**4. Parent + child run hierarchy** (for hyperparameter sweeps):
- Parent run: hyperparameter sweep job
- Child runs: each individual trial
- Cleaner than flat list when running 100+ trials

**5. MLflow + Hyperopt / Optuna integration**:
- Hyperopt: Bayesian optimization, logs each trial as a child MLflow run
- Optuna: same pattern with MLflowCallback

**6. Model comparison criteria** (beyond single metric):
- Primary metric: val_auc / val_f1 (business-agreed metric)
- Secondary: inference latency (P95), model size (disk/RAM for serving)
- Tertiary: training cost (# of trials × cluster time)
- Never choose a model that wins on metric but is 10× slower to serve`,
code:`import mlflow
from mlflow.tracking import MlflowClient
import pandas as pd

# Query and compare all runs in an experiment
client = MlflowClient()
experiment = client.get_experiment_by_name("/Shared/appr-delay-classifier")

# Get all runs sorted by validation AUC descending
runs = client.search_runs(
    experiment_ids=[experiment.experiment_id],
    filter_string="metrics.val_auc > 0.85 AND tags.feature_set = 'v2_with_route_history'",
    order_by=["metrics.val_auc DESC"],
    max_results=20
)

# Convert to DataFrame for analysis
runs_df = pd.DataFrame([{
    "run_id":       r.info.run_id,
    "run_name":     r.info.run_name,
    "val_auc":      r.data.metrics.get("val_auc"),
    "val_f1":       r.data.metrics.get("val_f1"),
    "n_estimators": r.data.params.get("n_estimators"),
    "max_depth":    r.data.params.get("max_depth"),
    "feature_set":  r.data.tags.get("feature_set"),
    "duration_min": (r.info.end_time - r.info.start_time)/60000
} for r in runs])

print(runs_df.head(10))

# Select best run and register
best_run = runs[0]
print(f"Best: {best_run.info.run_name}, AUC={best_run.data.metrics['val_auc']:.4f}")

mlflow.register_model(
    f"runs:/{best_run.info.run_id}/model",
    "main.ml_models.appr_delay_classifier"
)

# Hyperopt integration: auto-logs child runs
from hyperopt import fmin, tpe, hp, Trials, STATUS_OK

def objective(params):
    with mlflow.start_run(nested=True):  # Child run under parent
        mlflow.log_params(params)
        model = train_model(**params)
        auc = evaluate(model)
        mlflow.log_metric("val_auc", auc)
        return {"loss": -auc, "status": STATUS_OK}

with mlflow.start_run(run_name="hyperopt-sweep"):  # Parent run
    best = fmin(fn=objective, space={
        "max_depth":    hp.choice("max_depth", [4, 6, 8]),
        "n_estimators": hp.quniform("n_estimators", 50, 300, 50),
        "learning_rate": hp.loguniform("lr", -4, -1)
    }, algo=tpe.suggest, max_evals=50)`,

{q:'What is the MLflow pyfunc flavor? How do you build custom model wrappers for complex inference logic?',diff:'pr',
simple:`MLflow pyfunc (Python Function) is the universal model flavor — a wrapper that lets any Python logic (custom pre/post-processing, ensemble of models, RAG pipeline, LLM chains) be packaged and served as an MLflow model. It exposes a single predict(data) method regardless of what's inside.

Use pyfunc when: your inference involves multiple steps, custom business logic, multiple models, or a non-standard framework not natively supported by MLflow.`,
detailed:`**Why pyfunc exists**:
- MLflow has native flavors for sklearn, XGBoost, TensorFlow, PyTorch etc.
- But many production models have: custom pre-processing, post-processing rules, business thresholds, ensembles, LLM chains
- pyfunc lets you wrap ALL of that into a single predict() interface
- Model Serving sees a pyfunc model the same as any other — no special handling needed

**pyfunc model structure**:
\`\`\`python
class MyModel(mlflow.pyfunc.PythonModel):
    def load_context(self, context):
        # Called once at model load time (not per request)
        # Load heavy assets here: ML model, tokenizer, lookup tables
        import mlflow.sklearn
        self.model = mlflow.sklearn.load_model(context.artifacts["sklearn_model"])
        self.threshold = 0.75  # Business rule

    def predict(self, context, model_input):
        # Called for every inference request
        # model_input: pandas DataFrame (from REST API)
        probs = self.model.predict_proba(model_input)[:, 1]
        # Custom business logic: apply threshold + add category label
        return pd.DataFrame({
            "delay_probability": probs,
            "delay_predicted":   (probs >= self.threshold).astype(int),
            "confidence_tier":   pd.cut(probs, bins=[0,.5,.8,1],
                                        labels=["LOW","MEDIUM","HIGH"])
        })
\`\`\`

**Artifacts** (files packaged with pyfunc model):
- context.artifacts: dict of file paths available to load_context
- Log with: mlflow.pyfunc.log_model(..., artifacts={"sklearn_model": model_path, "vocab": vocab_path})

**pyfunc for LangChain/LLM pipelines**:
- Package entire RAG chain as pyfunc → serve via Model Serving
- load_context: load Vector Search index, LLM client, system prompt
- predict: run retrieval + LLM call → return answer string

**Common pyfunc patterns**:
1. Pre/post-processing wrapper around sklearn/XGBoost
2. Ensemble: average predictions from 3 models
3. Multi-model: route to specialist model based on input feature
4. LLM chain: retrieval + LLM invocation
5. Business rule override: if confidence < threshold → return "REVIEW"`,
code:`import mlflow
import mlflow.pyfunc
import pandas as pd
import numpy as np

# Custom pyfunc: APPR claims scoring with business rules
class APPRScoringModel(mlflow.pyfunc.PythonModel):

    def load_context(self, context):
        """Load artifacts once at startup — called per replica, not per request."""
        import mlflow.sklearn
        # Load underlying ML model
        self.delay_model = mlflow.sklearn.load_model(
            context.artifacts["delay_model"])
        # Load business rule thresholds from artifact file
        import json
        with open(context.artifacts["thresholds"]) as f:
            self.thresholds = json.load(f)
        # Load carrier override table
        self.carrier_overrides = pd.read_csv(
            context.artifacts["carrier_overrides"])

    def predict(self, context, model_input: pd.DataFrame) -> pd.DataFrame:
        """Inference with business rule overlay."""
        # Step 1: Base model prediction
        probs = self.delay_model.predict_proba(
            model_input[["delay_min","distance_km","departure_hour"]])[:, 1]

        # Step 2: Apply carrier-specific adjustment
        carrier_adj = model_input["carrier_code"].map(
            self.carrier_overrides.set_index("carrier_code")["adjustment"].to_dict()
        ).fillna(1.0)
        adjusted_probs = (probs * carrier_adj).clip(0, 1)

        # Step 3: Business rule: flag for human review if borderline
        threshold = self.thresholds["compensation_threshold"]
        return pd.DataFrame({
            "delay_probability": adjusted_probs,
            "compensation_eligible": (adjusted_probs >= threshold).astype(int),
            "requires_review": ((adjusted_probs > 0.45) &
                                (adjusted_probs < 0.55)).astype(int)
        })

# Log the pyfunc model with all artifacts
with mlflow.start_run():
    # Save artifacts locally first
    sklearn_path = "/tmp/delay_model"
    mlflow.sklearn.save_model(delay_model, sklearn_path)

    mlflow.pyfunc.log_model(
        artifact_path="appr-scoring",
        python_model=APPRScoringModel(),
        artifacts={
            "delay_model":      sklearn_path,
            "thresholds":       "/tmp/thresholds.json",
            "carrier_overrides":"/tmp/carrier_overrides.csv"
        },
        pip_requirements=["scikit-learn==1.3.0","pandas==2.0.3"],
        signature=infer_signature(X_test, model.predict(X_test))
    )`,

{q:'How do you run MLflow batch inference at scale in Databricks? Compare mlflow.pyfunc.spark_udf() vs pandas_udf vs Model Serving.',diff:'pr',
simple:`Three patterns for batch inference at scale:

• spark_udf(): Register a logged MLflow model as a Spark UDF — runs model on each row across the cluster. Easy but row-at-a-time overhead.
• Pandas UDF (Iterator): Load model once per partition via @pandas_udf with Iterator pattern — vectorized, efficient for large batches.
• Model Serving REST call: Send batches to endpoint via HTTP — decoupled but adds network latency and cost per call.

For Databricks batch scoring: spark_udf() or Iterator Pandas UDF are preferred (in-cluster, no network overhead).`,
detailed:`**spark_udf()** (simplest, built-in):
- mlflow.pyfunc.spark_udf(spark, model_uri): returns a Spark UDF
- Loads the model on each executor once per partition
- Calls predict() row by row → data crosses JVM-Python per row
- Good for: simple models, moderate data volumes (<100M rows)
- Limitation: per-row overhead; not Photon-optimized

**Iterator Pandas UDF** (most efficient for large scale):
- Load model ONCE per partition via Iterator pattern
- Process each batch as pandas DataFrame — vectorized
- Best for: 100M+ rows, GPU inference, heavy models
- Pattern: model loaded in generator function preamble, not inside loop

**Model Serving REST batch** (decoupled):
- POST /serving-endpoints/{name}/invocations with batch payload
- Good for: when inference team != data engineering team, cross-language, A/B test routing
- Limitation: network RTT, request size limits (typically 16MB payload), cost per call
- Use for: real-time or near-real-time paths; batch jobs should use in-cluster methods

**FeatureStoreClient.score_batch()** (for Feature Store models):
- Automatically fetches features from Feature Store + runs model
- Handles feature joining, online store lookups
- Best for: models logged with Feature Store training set linkage

**GPU batch inference**:
- Use GPU cluster (p3/p4d on AWS)
- Iterator Pandas UDF + torch.no_grad() for efficient GPU utilization
- Pin model to GPU in load_context: self.model.to("cuda")`,
code:`import mlflow
from pyspark.sql import functions as F
from pyspark.sql.functions import pandas_udf
from pyspark.sql.types import *
from typing import Iterator
import pandas as pd

model_uri = "models:/main.ml_models.appr_delay_classifier@champion"

# METHOD 1: spark_udf() — simplest, good for moderate scale
score_udf = mlflow.pyfunc.spark_udf(
    spark,
    model_uri=model_uri,
    result_type=DoubleType()    # Match model output type
)
# Apply to DataFrame
scored = inference_df.withColumn(
    "delay_probability",
    score_udf("delay_min", "distance_km", "carrier_code", "departure_hour")
)

# METHOD 2: Iterator Pandas UDF — most efficient for large scale
@pandas_udf(returnType=StructType([
    StructField("delay_probability", DoubleType()),
    StructField("compensation_eligible", IntegerType())
]))
def batch_score(iterator: Iterator[pd.DataFrame]) -> Iterator[pd.DataFrame]:
    # Load model ONCE per partition (not per row, not per batch)
    import mlflow.pyfunc
    model = mlflow.pyfunc.load_model(model_uri)

    for batch_df in iterator:          # Process each batch efficiently
        predictions = model.predict(batch_df)
        yield predictions[["delay_probability","compensation_eligible"]]

# Apply across cluster (model loaded once per executor partition)
scored = inference_df.select(
    "*",
    batch_score(
        F.struct("delay_min","distance_km","carrier_code","departure_hour")
    ).alias("predictions")
).select("*", "predictions.*")

# METHOD 3: FeatureStoreClient.score_batch() (for FS-linked models)
from databricks.feature_engineering import FeatureEngineeringClient
fe = FeatureEngineeringClient()

scored = fe.score_batch(
    model_uri=model_uri,
    df=inference_df.select("flight_id","carrier_code","flight_date"),
    result_type=DoubleType()
)
# Automatically fetches features from Feature Store and runs model`,
tags:['Batch Inference','spark_udf','Pandas UDF Iterator','Model Serving','FeatureStoreClient','score_batch','GPU Inference','MLflow pyfunc','Large Scale','Efficiency']},
{q:'What is Unity Catalog? How does it differ from the legacy Hive Metastore?',diff:'pr',
simple:`Unity Catalog (UC) is Databricks' unified governance layer for data and AI assets across all workspaces in an account. It governs: tables, views, volumes (files), functions, ML models, and dashboards — with a three-level namespace (catalog.schema.table).

vs. Legacy Hive Metastore: Per-workspace, no cross-workspace sharing, no column-level security, no lineage, no model/volume governance. UC is centralized, account-wide, and governs all asset types.`,
detailed:`**Unity Catalog three-level namespace**:
catalog.schema.table
- Catalog: Top-level grouping. e.g., prod, dev, raw, analytics
- Schema (database): Named collection within a catalog. e.g., prod.silver, prod.gold
- Table/View/Volume/Function: The object itself

**Key Unity Catalog features vs. Hive Metastore**:

| Feature | Hive Metastore | Unity Catalog |
|---|---|---|
| Scope | Per-workspace | Account-wide (all workspaces) |
| Data sharing | Manual copies | Delta Sharing natively |
| Access control | Table-level | Column-level, row-level, tag-based |
| Lineage | None | Automatic column-level lineage |
| ML models | Not governed | Models as first-class objects |
| Volumes | Not governed | Volumes (unstructured file governance) |
| Audit log | Limited | Full query-level audit log |
| External locations | Per-cluster | Centralized external location mgmt |

**Metastore** (top-level Unity Catalog object):
- One metastore per region
- Attached to multiple Databricks workspaces
- All catalogs, schemas, tables live under a metastore
- Account admin manages metastore; workspace admins manage within

**External Locations** (replacing legacy mount points):
- Named, governed connection to cloud storage (s3://, abfss://)
- Governed: access requires Unity Catalog privilege (EXTERNAL USE SCHEMA)
- No cluster-level credentials needed — UC handles storage credentials

**Volumes** (governed file storage):
- External volumes: governed access to existing cloud storage paths
- Managed volumes: storage managed by Databricks
- Use for: ML training data, raw files, feature store offline data`,
code:`-- Unity Catalog three-level namespace
USE CATALOG prod;
USE SCHEMA silver;

-- Create catalog (admin)
CREATE CATALOG dev COMMENT 'Development environment catalog';

-- Create schema
CREATE SCHEMA IF NOT EXISTS prod.silver
COMMENT 'Cleaned and validated data layer'
MANAGED LOCATION 'abfss://datalake@storage.dfs.core.windows.net/prod/silver';

-- Fine-grained access control
GRANT SELECT ON TABLE prod.silver.flights TO \`data-analysts\`;
GRANT MODIFY ON TABLE prod.silver.flights TO \`data-engineers\`;
GRANT ALL PRIVILEGES ON SCHEMA prod.gold TO \`analytics-leads\`;

-- Column-level masking (PII protection)
CREATE FUNCTION prod.governance.mask_passenger_name(name STRING)
RETURNS STRING

{q:'What is data lineage in Unity Catalog? How is it captured and why does it matter at the enterprise level?',diff:'pr',
simple:`Data lineage in Unity Catalog automatically tracks how data flows through your system — from source tables, through transformations, to downstream tables and dashboards — at the column level.

Without lineage: "Where did this Gold table's revenue_usd column come from?" is a mystery requiring manual code archaeology. With UC lineage: see the full graph in the Catalog Explorer UI or query it programmatically.`,
detailed:`**What Unity Catalog tracks automatically**:
- Table-level lineage: Table A → transformation → Table B (as read/write by Spark, SQL, DLT)
- Column-level lineage: Which source columns contribute to each target column
- ML model lineage: Which tables were used to train a model
- Dashboard lineage: Which tables power a given Databricks dashboard

**How lineage is captured**:
- Databricks intercepts query execution plans at the Spark/SQL level
- Automatically extracts read/write relationships
- No code changes needed — works for: Spark DataFrames, SQL queries, DLT pipelines, Notebooks, Jobs

**Lineage APIs**:
- Catalog Explorer UI: Visual graph of upstream/downstream dependencies
- REST API: Programmatic access for integration with data catalogs (Atlan, DataHub, Collibra)
- Python SDK: workspace_client.table_lineage.list(...)

**Why lineage matters at enterprise level**:

1. **Impact analysis**: "If I change the schema of bronze.flights, which 47 downstream tables and 12 dashboards will break?" — Unity Catalog answers this instantly.

2. **Root cause analysis**: "Our revenue report is wrong — trace the revenue_usd column back to find where bad data entered."

3. **Compliance/GDPR**: "Where is passenger_name stored or derived?" — lineage shows every table containing that column's derivatives.

4. **Trust**: Data consumers know data provenance — "this Gold table was derived from certified Bronze sources."

5. **Data mesh**: Cross-domain lineage shows how data products are consumed across domains.

**Lineage limitations**:
- Only captures data flows through Unity Catalog-governed workspaces
- External systems (S3 direct access, non-Databricks tools) not captured
- Column-level lineage may miss complex custom UDFs (approximation)`,
code:`# Query lineage via REST API (Python SDK)
from databricks.sdk import WorkspaceClient

w = WorkspaceClient()

# Get table lineage (upstream sources)
upstream = w.table_lineage.retrieve(
    table_name="prod.gold.carrier_performance",
    include_entity_lineage=True
)

for link in upstream.upstream_tables:
    print(f"Upstream: {link.table_name}")

# Column-level lineage
col_lineage = w.column_lineage.retrieve(
    table_name="prod.gold.carrier_performance",
    column_name="revenue_usd"
)

print("revenue_usd derives from:")
for source in col_lineage.upstream_cols:
    print(f"  {source.table_name}.{source.name}")

# Lineage in Catalog Explorer (UI):
# 1. Open Catalog Explorer → navigate to table
# 2. Click "Lineage" tab
# 3. See upstream/downstream graph with column-level detail

-- SQL: Find all tables that read from a source table
-- (via Unity Catalog system tables)
SELECT * FROM system.access.audit
WHERE service_name = 'dataAccess'
  AND action_name = 'getTable'
  AND request_params:full_name_arg = 'prod.bronze.flights'
ORDER BY event_time DESC;`,
